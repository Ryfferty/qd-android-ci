name: qd-abc
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'a=native hook / b=attach after wait / c=okhttp capture'
        default: 'b'

jobs:
  t:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: deps + redroid + adb root + frida
        run: |
          set +e
          sudo -S -p '' apt-get update -qq || true
          sudo -S -p '' apt-get install -y -qq linux-modules-extra-$(uname -r) android-tools-adb curl xz-utils unzip python3-pip || echo APT_PARTIAL
          sudo -S -p '' modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>&1 || echo MODPROBE_MAYBE
          pip install -q "frida==16.7.19" "frida-tools<14" pycryptodome 2>&1 | tail -1
          sudo -S -p '' docker rm -f redroid 2>/dev/null || true
          VOLS=""
          for d in binder hwbinder vndbinder; do [ -e /dev/$d ] && VOLS="$VOLS -v /dev/$d:/dev/$d"; done
          sudo -S -p '' docker run -d --privileged --name redroid $VOLS -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.redroid_width=720 androidboot.redroid_height=1184 androidboot.redroid_dpi=240 \
            androidboot.redroid_gpu_mode=guest 2>&1 | tail -1
          adb start-server >/dev/null 2>&1; sleep 5
          for i in $(seq 1 40); do adb connect localhost:5555 >/dev/null 2>&1; S=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r'); [ "$S" = "1" ] && break; sleep 6; done
          adb -s localhost:5555 shell "echo BOOT_OK"
          FR=16.7.19
          curl -sSL --max-time 300 -o fs.xz "https://github.com/frida/frida/releases/download/${FR}/frida-server-${FR}-android-arm64.xz"
          unxz -f fs.xz 2>/dev/null || gunzip -f fs.xz 2>/dev/null
          mv -f fs fs-server 2>/dev/null; chmod +x fs-server
          adb -s localhost:5555 root 2>&1 | head -1
          sleep 6; adb -s localhost:5555 wait-for-device
          adb -s localhost:5555 shell "id" | head -1
          adb -s localhost:5555 shell "setenforce 0" 2>&1 | head -1; adb -s localhost:5555 shell getenforce
          adb -s localhost:5555 push fs-server /data/local/tmp/frida-server >/dev/null 2>&1
          adb -s localhost:5555 shell "chmod 755 /data/local/tmp/frida-server"
          adb -s localhost:5555 shell "setsid /data/local/tmp/frida-server -D >/dev/null 2>&1 &"
          sleep 10
          adb -s localhost:5555 forward tcp:27042 tcp:27042
          echo "=== frida-ps 自检 ==="
          frida-ps -H 127.0.0.1:27042 2>&1 | head -4
          exit 0

      - name: 装 464 + 按模式执行
        run: |
          set +e
          B=localhost:5555
          M="${{ inputs.mode }}"
          echo "MODE=$M"
          curl -sSL --max-time 1800 -o q464.apk "https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/qidian_7.9.464.apk"
          adb -s $B push q464.apk /data/local/tmp/q464.apk >/dev/null 2>&1
          adb -s $B shell "pm install -r -d -t --user 0 /data/local/tmp/q464.apk" 2>&1 | tail -1
          adb -s $B logcat -c 2>/dev/null
          nohup adb -s $B logcat -v time > /tmp/lc.txt 2>&1 &

          if [ "$M" = "d" ]; then
            echo "########## D: spawn + 挂钩自杀点 ##########"
            ( sleep 60 ) | timeout 120 frida -H 127.0.0.1:27042 -f com.qidian.QDReader -l stepD_antikill.js > /tmp/outD.txt 2>&1
            echo "--- 原始 ---"; head -30 /tmp/outD.txt
            grep -oE "\{'m': '[^']*'" /tmp/outD.txt | sed "s/^{'m': '//" | head -80
            cp /tmp/outD.txt /tmp/outA.txt 2>/dev/null
          elif [ "$M" = "a" ]; then
            echo "########## A: native 层（spawn）##########"
            ( sleep 100 ) | timeout 160 frida -H 127.0.0.1:27042 -f com.qidian.QDReader -l stepA_native.js > /tmp/outA.txt 2>&1
            echo "--- 原始 ---"; head -30 /tmp/outA.txt
            grep -oE "\{'m': '[^']*'" /tmp/outA.txt | sed "s/^{'m': '//" | head -30
          elif [ "$M" = "b" ]; then
            echo "########## B: 启动后等 45 秒再 attach ##########"
            adb -s $B shell "am start -n com.qidian.QDReader/.ui.activity.SplashActivity" >/dev/null 2>&1
            sleep 45
            P=$(adb -s $B shell pidof com.qidian.QDReader | tr -d '\r')
            echo "PID=[$P]"
            if [ -n "$P" ]; then
              ( sleep 80 ) | timeout 140 frida -H 127.0.0.1:27042 -p "$P" -l stepB_attach.js > /tmp/outB.txt 2>&1
              echo "--- 原始 ---"; head -25 /tmp/outB.txt
              grep -oE "\{'m': '[^']*'" /tmp/outB.txt | sed "s/^{'m': '//" | head -30
            fi
          else
            echo "########## C: hook okhttp 抓正文/密钥响应 ##########"
            adb -s $B shell "am start -n com.qidian.QDReader/.ui.activity.SplashActivity" >/dev/null 2>&1
            sleep 40
            P=$(adb -s $B shell pidof com.qidian.QDReader | tr -d '\r')
            echo "PID=[$P]"
            [ -z "$P" ] && { echo NO_APP; exit 0; }
            ( sleep 30; adb -s $B shell "am start -a android.intent.action.VIEW -d QDReader://OpenBook/1049120379/903350205" >/dev/null 2>&1 ) &
            ( sleep 110 ) | timeout 170 frida -H 127.0.0.1:27042 -p "$P" -l stepC_okhttp.js > /tmp/outC.txt 2>&1
            echo "--- 原始 ---"; head -25 /tmp/outC.txt
            grep -oE "\{'m': '[^']*'" /tmp/outC.txt | sed "s/^{'m': '//" | head -40
            echo "--- 设备端抓到的 body ---"
            adb -s $B shell "ls -la /data/local/tmp/http_body_* 2>/dev/null" | head -5
          fi
          cp /tmp/outA.txt /tmp/outB.txt /tmp/outC.txt /tmp/ 2>/dev/null
          cp /tmp/lc.txt /tmp/logcat.txt 2>/dev/null
          exit 0

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abc-${{ inputs.mode }}
          path: |
            /tmp/outA.txt
            /tmp/outB.txt
            /tmp/outC.txt
            /tmp/logcat.txt
          if-no-files-found: warn
