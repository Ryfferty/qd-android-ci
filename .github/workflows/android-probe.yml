name: android-probe

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probe host
        run: |
          echo "===== CPU ====="; nproc; grep -m1 'model name' /proc/cpuinfo || true
          echo "===== MEM ====="; free -h
          echo "===== DISK ====="; df -h / | tail -1
          echo "===== KVM ====="; ls -la /dev/kvm || echo "!! NO /dev/kvm"
          echo "virt flags count: $(egrep -c '(vmx|svm)' /proc/cpuinfo || echo 0)"
          echo "===== KVM usable? ====="
          sudo apt-get update -qq
          sudo apt-get install -y -qq cpu-checker >/dev/null 2>&1 || true
          (kvm-ok && echo "KVM_OK") || echo "KVM_NOT_OK"

      - name: Install Android SDK
        run: |
          set -e
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/emulator" >> $GITHUB_PATH
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "emulator" \
            "system-images;android-30;google_apis;x86_64" >/dev/null 2>&1
          echo "=== installed ==="
          ls $ANDROID_SDK_ROOT

      - name: Create AVD and boot emulator
        run: |
          set -e
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator
          echo no | avdmanager create avd -n probe30 -k "system-images;android-30;google_apis;x86_64" --force
          echo "=== AVD created ==="
          nohup emulator -avd probe30 -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -accel on -memory 4096 -cores 4 \
            > /tmp/emu.log 2>&1 &
          echo "emulator launched, waiting for boot..."
          adb wait-for-device
          echo "device connected, waiting for sys.boot_completed..."
          for i in $(seq 1 60); do
            B=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$B" = "1" ]; then echo "BOOT_COMPLETED after ${i}0s"; break; fi
            sleep 10
          done
          echo "=== Android version ==="
          adb shell getprop ro.build.version.release
          adb shell getprop ro.build.version.sdk
          echo "=== abilist ==="
          adb shell getprop ro.product.cpu.abilist
          echo "=== adb devices ==="
          adb devices -l
          echo "=== emulator log tail ==="
          tail -20 /tmp/emu.log || true

      - name: Screenshot + info
        if: always()
        run: |
          export PATH=$PATH:$HOME/android-sdk/platform-tools
          mkdir -p out
          adb shell screencap -p /sdcard/screen.png 2>/dev/null && adb pull /sdcard/screen.png out/screen.png 2>/dev/null || echo "screenshot failed"
          adb shell dumpsys window 2>/dev/null | head -30 > out/window.txt || true
          adb shell pm list packages 2>/dev/null | head -40 > out/packages.txt || true
          echo "=== files ==="; ls -la out/ || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-out
          path: out/
          retention-days: 3
