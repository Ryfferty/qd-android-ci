name: qd-acct
on:
  workflow_dispatch:
    inputs:
      q16:
        description: '用作协议身份的 QIMEI16（两个账号都用这个值）'
        default: '90de39fdaa21774b6b5487fd100015f1a911'
      book:
        default: '1049120379'
      cid:
        default: '903350205'

jobs:
  t:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          set +e
          pip install -q pycryptodome 2>&1 | tail -1
          python3 -c "print('deps ok')"
          exit 0

      - name: IMEI 矩阵测试（同一 Q，不同 IMEI）
        run: |
          set +e
          mkdir -p /tmp/sess
          echo "${{ secrets.QD_SESS_900069660351 }}" | base64 -d > /tmp/sess/900069660351.json 2>/dev/null
          Q="${{ inputs.q16 }}"
          # IMEI 候选矩阵：空 / 我们原本的假值 / 与 Q 相同 / androidId（这里用 Q 的前 15 位近似）
          i=0
          for IM in "" "5a271be5da434be" "$Q" "${Q:0:15}"; do
            i=$((i+1))
            echo "########## IMEI 候选 $i = [$IM] ##########"
            DEV_IMEI="$IM" DEV_ANDROID_ID="$Q" DEV_MODEL=redroid11_arm64 SESS=/tmp/sess/900069660351.json \
              BOOK=${{ inputs.book }} CID=${{ inputs.cid }} timeout 90 python3 argus_final.py 2>&1 | tail -4
            cp /tmp/params.json /tmp/params_i$i.json 2>/dev/null
            python3 summarize_params.py 2>/dev/null
            echo
          done
          ls -la /tmp/params_i*.json
          exit 0

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imei
          path: |
            /tmp/params_i1.json
            /tmp/params_i2.json
            /tmp/params_i3.json
            /tmp/params_i4.json
          if-no-files-found: warn
