name: qd-qq-login-flow
on:
  workflow_dispatch:
    inputs:
      qq_url:
        description: QQ apk
        default: https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/com.tencent.mobileqq.apk
        required: false
      qd_url:
        description: qidian apk
        default: https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/qidian_7.9.200.apk
        required: false

jobs:
  flow:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Setup binder and adb
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq linux-modules-extra-$(uname -r) adb curl xz-utils || echo APT_FAILED
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>&1 || echo MODPROBE_FAILED

      - name: Start redroid
        run: |
          sudo docker rm -f redroid 2>/dev/null || true
          VOLS=""
          for d in binder hwbinder vndbinder; do if [ -e /dev/$d ]; then VOLS="$VOLS -v /dev/$d:/dev/$d"; fi; done
          sudo docker run -d --privileged --name redroid $VOLS -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.redroid_gpu_mode=guest androidboot.redroid_width=1080 \
            androidboot.redroid_height=2340 androidboot.redroid_dpi=420 \
            androidboot.redroid_adb=5555 || echo DOCKER_FAILED
          sleep 15

      - name: Boot + install both apps
        run: |
          adb start-server >/dev/null 2>&1 || true
          timeout 30 adb connect localhost:5555 2>&1 || true
          for i in $(seq 1 30); do
            B=$(timeout 15 adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "$B" = "1" ]; then echo "booted try $i"; break; fi
            sleep 8
          done
          curl -sSL --max-time 900 -o /tmp/qq.apk "${{ inputs.qq_url }}" || echo QQ_DL_FAIL
          curl -sSL --max-time 300 -o /tmp/qd.apk "${{ inputs.qd_url }}" || echo QD_DL_FAIL
          timeout 900 adb -s localhost:5555 install -r -t /tmp/qq.apk 2>&1 | tail -2
          timeout 300 adb -s localhost:5555 install -r -t /tmp/qd.apk 2>&1 | tail -2

      - name: Helpers (dump + tap-by-text)
        run: |
          cat > /tmp/dump.sh <<'EOS'
          #!/bin/bash
          TAG=$1
          D="localhost:5555"
          timeout 30 adb -s $D exec-out screencap -p > /tmp/${TAG}.png 2>/dev/null || true
          timeout 30 adb -s $D shell uiautomator dump /sdcard/${TAG}.xml >/dev/null 2>&1 || true
          timeout 30 adb -s $D pull /sdcard/${TAG}.xml /tmp/${TAG}.xml >/dev/null 2>&1 || true
          echo "--- $TAG focus ---"
          timeout 20 adb -s $D shell "dumpsys window 2>/dev/null | grep mCurrentFocus" || true
          echo "--- $TAG ALL TEXT ---"
          sed 's/></>\n</g' /tmp/${TAG}.xml 2>/dev/null | grep -oE 'text="[^"]+"' | sort -u | head -60 || true
          echo "--- $TAG nodes still on screen ---"
          sed 's/></>\n</g' /tmp/${TAG}.xml 2>/dev/null | grep -oE 'text="[^"]*"[^>]*bounds="\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]"' | head -25 || true
          EOS
          cat > /tmp/tap.sh <<'EOS'
          #!/bin/bash
          TAG=$1; RE=$2
          D="localhost:5555"
          LINE=$(sed 's/></>\n</g' /tmp/${TAG}.xml 2>/dev/null \
            | grep -oE 'text="[^"]*"[^>]*bounds="\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]"' \
            | grep -E "text=\"(${RE})\"" | head -1)
          echo "tap match[$RE]: ${LINE:0:120}"
          BB=$(echo "$LINE" | grep -oE '\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]' | head -1)
          if [ -z "$BB" ]; then echo "NO MATCH for $RE"; exit 1; fi
          N=$(echo "$BB" | sed -E 's/^\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]$/\1 \2 \3 \4/')
          echo "parsed: $N"
          set -- $N
          CX=$(( ($1 + $3) / 2 ))
          CY=$(( ($2 + $4) / 2 ))
          echo "tapping ($CX,$CY)"
          timeout 20 adb -s $D shell "input tap $CX $CY" || true
          EOS
          chmod +x /tmp/dump.sh /tmp/tap.sh

      - name: Launch QQ and walk past privacy
        run: |
          timeout 20 adb -s localhost:5555 shell "logcat -c" || true
          timeout 40 adb -s localhost:5555 shell "am start -W -n com.tencent.mobileqq/com.tencent.mobileqq.activity.SplashActivity" 2>&1 | tail -2
          sleep 30
          /tmp/dump.sh qq1 || true
          for round in 1 2 3 4; do
            echo "########## QQ round $round ##########"
            /tmp/tap.sh qq$round '同意|允许|确定|我知道了|进入' || true
            sleep 12
            NX=$(( round + 1 ))
            /tmp/dump.sh qq$NX || true
          done
          echo "=== LOGIN OPTION SCAN ==="
          for kw in 扫码 二维码 密码登录 手机号 验证码 其他方式 注册; do
            if grep -q "$kw" /tmp/qq5.xml 2>/dev/null; then echo "FOUND: $kw"; fi
          done

      - name: Screenshot the login screen too
        run: |
          timeout 30 adb -s localhost:5555 exec-out screencap -p > /tmp/qq_login_final.png 2>/dev/null || true
          ls -l /tmp/qq_login_final.png || true

      - name: Logs
        if: always()
        run: |
          echo "=== crash ==="
          timeout 30 adb -s localhost:5555 shell "logcat -d -b crash -v time" 2>&1 | tail -25 || true
          echo "=== msf/wtlogin ==="
          timeout 40 adb -s localhost:5555 shell "logcat -d -v time" 2>/dev/null | grep -i -E "wtlogin|MSF_|login success|kick|risk|安全|验证" | tail -40 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qq-login-flow-evidence
          path: |
            /tmp/*.png
            /tmp/*.xml
          if-no-files-found: warn
