name: qqread-capture

# QQ阅读 App 游客态全量流量 MITM 采集 (2026-10-19)
#   底稿: qd-mitm-login.yml 的成熟 MITM 接线(CA系统证书 + iptables DNAT 172.17.0.0/16
#   + 封QUIC + 全局http_proxy + mitmdump -w 落盘) + qd-app-consent.yml 的弹窗处理经验
#   驱动: ci/qqread_driver.py — 全程不登录(游客态是实验条件):
#   首启弹窗点掉(白名单/黑名单) → 书城浏览 → deeplink搜索《大生意人》(bid=54425396)
#   → 书详情 → 读第1章翻页 → 目录点第5章撞付费墙 → flows+截图+dump+logcat 全落盘
# 派活: gh workflow run qqread-capture --repo Ryfferty/qd-android-ci
on:
  workflow_dispatch:
    inputs:
      bid:
        description: '目标书 bid (大生意人)'
        default: '54425396'

permissions:
  contents: read

jobs:
  qqread:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: "Setup adb/mitmproxy/binder"
        run: |
          set +e
          sudo -S -p '' apt-get update -qq || true
          sudo -S -p '' apt-get install -y -qq linux-modules-extra-$(uname -r) adb sqlite3 curl || echo APT_PARTIAL
          sudo -S -p '' modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>&1 || echo MODPROBE_MAYBE
          pip install -q mitmproxy 2>&1 | tail -1
          mitmdump --version | head -2

      - name: "Start redroid (1080x2340@420) + root"
        run: |
          set +e
          sudo -S -p '' docker rm -f redroid 2>/dev/null || true
          VOLS=""
          for d in binder hwbinder vndbinder; do [ -e /dev/$d ] && VOLS="$VOLS -v /dev/$d:/dev/$d"; done
          sudo -S -p '' docker run -d --privileged --name redroid $VOLS -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.redroid_gpu_mode=guest androidboot.redroid_width=1080 \
            androidboot.redroid_height=2340 androidboot.redroid_dpi=420 \
            androidboot.redroid_adb=5555 2>&1 | tail -1
          adb start-server >/dev/null 2>&1; sleep 12
          B=localhost:5555
          for i in $(seq 1 30); do
            adb connect $B >/dev/null 2>&1
            S=$(timeout 10 adb -s $B shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$S" = "1" ] && echo "BOOT_OK try $i" && break
            sleep 7
          done
          OK=0
          for i in $(seq 1 10); do
            timeout 25 adb -s $B root >/dev/null 2>&1; sleep 5
            adb disconnect $B >/dev/null 2>&1; sleep 1
            adb connect $B >/dev/null 2>&1; sleep 3
            IDOUT=$(timeout 8 adb -s $B shell id 2>/dev/null | tr -d "\r")
            echo "root轮$i: $IDOUT"
            echo "$IDOUT" | grep -q "uid=0" && OK=1 && break
            sleep 3
          done
          [ $OK = 0 ] && echo "ROOT_FAIL(继续, CA证书写入需要root)"
          timeout 10 adb -s $B shell "setenforce 0" 2>/dev/null
          timeout 10 adb -s $B shell getprop ro.build.version.sdk | tr -d '\r'

      - name: "下载 qqreader.apk + 安装"
        run: |
          set +e
          B=localhost:5555
          for i in 1 2 3 4; do
            curl -sSL --max-time 900 -o /tmp/qqreader.apk "https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/qqreader.apk" || true
            SZ=$(stat -c%s /tmp/qqreader.apk 2>/dev/null || echo 0)
            echo "apk try $i size=$SZ"
            [ "$SZ" -gt 100000000 ] && break
            sleep 15
          done
          md5sum /tmp/qqreader.apk
          for i in 1 2 3; do
            timeout 600 adb -s $B install -r -t /tmp/qqreader.apk 2>&1 | tail -2
            if timeout 30 adb -s $B shell pm list packages 2>/dev/null | tr -d '\r' | grep -q com.qq.reader; then
              echo "INSTALL_OK try $i"; break
            fi
            sleep 8; adb connect $B >/dev/null 2>&1
          done
          timeout 20 adb -s $B shell "dumpsys package com.qq.reader | grep -E 'versionName|primaryCpuAbi' | head -2" 2>&1 || true

      - name: "MITM接线 (CA系统证书 + iptables DNAT + 封QUIC + mitmdump -w)"
        run: |
          set +e
          B=localhost:5555
          sudo -S -p '' modprobe nf_conntrack nf_nat iptable_nat nf_nat_ipv4 xt_TCPMSS xt_comment 2>&1 | head -2
          sudo iptables -t nat -L -n >/dev/null 2>&1 && echo HOST_NAT_OK || echo HOST_NAT_FAIL
          (timeout 8 mitmdump -p 8899 --set confdir=/tmp/mitm --set quiet=true >/dev/null 2>&1 &); sleep 8
          ls /tmp/mitm/ | head -4
          CA=/tmp/mitm/mitmproxy-ca-cert.pem
          HASH=$(openssl x509 -inform PEM -subject_hash_old -in $CA | head -1)
          echo "CAHASH=$HASH"
          timeout 30 adb -s $B push $CA /data/local/tmp/cacert.pem >/dev/null 2>&1
          timeout 30 adb -s $B shell "mount -o rw,remount / 2>/dev/null; mount -o rw,remount /system 2>/dev/null; cp /data/local/tmp/cacert.pem /system/etc/security/cacerts/$HASH.0; chmod 644 /system/etc/security/cacerts/$HASH.0; ls -la /system/etc/security/cacerts/$HASH.0" 2>&1 | tail -1
          timeout 20 adb -s $B shell "cp /data/local/tmp/cacert.pem /apex/com.android.conscrypt/cacerts/$HASH.0 2>/dev/null && chmod 644 /apex/com.android.conscrypt/cacerts/$HASH.0 && echo APEX_OK || echo APEX_FAIL"
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null 2>&1
          sudo iptables -t nat -A PREROUTING -s 172.17.0.0/16 -p tcp --dport 80  -j DNAT --to-destination 172.17.0.1:8899
          sudo iptables -t nat -A PREROUTING -s 172.17.0.0/16 -p tcp --dport 443 -j DNAT --to-destination 172.17.0.1:8899
          sudo iptables -A FORWARD -s 172.17.0.0/16 -p udp --dport 443 -j DROP
          sudo iptables -t nat -L PREROUTING -n -v | head -8
          GW=$(timeout 8 adb -s $B shell "ip route | awk '/^default/{print \$3; exit}'" | tr -d '\r')
          [ -z "$GW" ] && GW=172.17.0.1
          timeout 10 adb -s $B shell "settings put global http_proxy $GW:8899"
          echo "PROXY=$(timeout 8 adb -s $B shell settings get global http_proxy | tr -d '\r') GW=$GW"
          nohup mitmdump --listen-host 0.0.0.0 -p 8899 --set confdir=/tmp/mitm \
            --set block_global=false --set flow_detail=1 -w /tmp/all.flows \
            > /tmp/mitm.log 2>&1 &
          sleep 5
          pgrep -f mitmdump >/dev/null && echo MITMDUMP_ALIVE || echo MITMDUMP_NOT_RUNNING
          echo STEP_MITM_DONE

      - name: "采集驱动 (游客态: 弹窗-书城-搜索-书详情-第1章-第5章付费墙)"
        env:
          QQREAD_BID: ${{ inputs.bid || '54425396' }}
        run: |
          set +e
          python3 ci/qqread_driver.py 2>&1 | tee /tmp/driver_stdout.txt
          EC=${PIPESTATUS[0]}
          echo "driver exit=$EC (非0=异常; 证据照常上传)"
          echo "=== out/ 清单 ==="
          ls -la /tmp/out/ 2>/dev/null
          cat /tmp/out/driver_verdict.json 2>/dev/null
          echo "=== flows ==="
          ls -la /tmp/all.flows 2>/dev/null
          exit 0

      - name: "停mitmdump (flush flows)"
        if: always()
        run: |
          set +e
          pkill -f mitmdump 2>/dev/null; sleep 3
          ls -la /tmp/all.flows /tmp/mitm.log 2>/dev/null
          echo "=== mitm.log 头 ==="
          head -30 /tmp/mitm.log 2>/dev/null
          echo "=== mitm.log 尾 ==="
          tail -20 /tmp/mitm.log 2>/dev/null

      - name: "Upload (flows + 截图 + dump + logcat + verdict)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqread-capture
          path: |
            /tmp/out/
            /tmp/all.flows
            /tmp/mitm.log
            /tmp/driver_stdout.txt
          if-no-files-found: warn
          retention-days: 7
