name: qd-qr-live
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: qidian apk
        default: https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/qidian_7.9.200.apk
        required: false
      hook_url:
        description: frida hook（★ 用 hook_ssl.js：纯原生透明旁听，不替换 Java 实现）
        default: https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/hook_ssl2.js
        required: false
jobs:
  cap:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
    - name: Setup binder + adb + frida-tools
      run: 'sudo apt-get update -qq || true

        sudo apt-get install -y -qq linux-modules-extra-$(uname -r) adb curl xz-utils unzip || echo APT_FAILED

        sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>&1 || echo MODPROBE_FAILED

        # ★ frida 17 移除了内置 Java bridge（脚本里 Java 会 ReferenceError），必须锁 16.x

        pip install -q "frida==16.7.19" "frida-tools<14" 2>&1 | tail -2

        FV=$(frida --version)

        echo "FV=$FV" >> $GITHUB_ENV

        echo "frida version = $FV"

        '
    - name: Start redroid (arm64 Android 11)
      run: "sudo docker rm -f redroid 2>/dev/null || true\nVOLS=\"\"\nfor d in binder hwbinder vndbinder; do if [ -e /dev/$d ]; then VOLS=\"$VOLS -v /dev/$d:/dev/$d\"; fi; done\nsudo docker run -d --privileged --name redroid $VOLS -p 5555:5555 \\\n  redroid/redroid:11.0.0-latest \\\n  androidboot.redroid_gpu_mode=guest androidboot.redroid_width=1080 \\\n  androidboot.redroid_height=2340 androidboot.redroid_dpi=420 \\\n  androidboot.redroid_adb=5555 || echo DOCKER_FAILED\nsleep 15\n"
    - name: Boot + verify arm64
      run: "set +e\nadb start-server >/dev/null 2>&1\ntimeout 30 adb connect localhost:5555\nfor i in $(seq 1 30); do\n  B=$(timeout 15 adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r')\n  if [ \"$B\" = \"1\" ]; then echo \"BOOT_OK try $i\"; break; fi\n  sleep 8\ndone\nadb -s localhost:5555 shell getprop ro.product.cpu.abi\nadb -s localhost:5555 shell getprop ro.build.version.release\n"
    - name: ★ Guest 网络连通性检查（App 发不出请求的最可能原因）
      run: "set +e\necho \"=== 宿主侧 ===\"\ncurl -sS -o /dev/null -m 12 -w \"host->qidian %{http_code} %{time_total}s\\n\" https://bravev6.if.qidian.com/ || echo HOST_FAIL\necho \"=== guest DNS 配置 ===\"\nadb -s localhost:5555 shell \"getprop | grep -i dns\" | tr -d '\\r'\necho \"=== guest ping 网关/公网 ===\"\nadb -s localhost:5555 shell \"ping -c 2 -W 3 8.8.8.8 2>&1 | tail -3\" | tr -d '\\r'\necho \"=== guest 解析域名 ===\"\nadb -s localhost:5555 shell \"ping -c 2 -W 3 bravev6.if.qidian.com 2>&1 | tail -3\" | tr -d '\\r'\necho \"=== guest TCP 连 443 ===\"\nfor hp in \"bravev6.if.qidian.com 443\" \"ptlogin.yuewen.com 443\" \"openmobile.qq.com 443\"; do\n  set -- $hp\n  adb -s localhost:5555 shell \"toybox nc -w 5 $1 $2 < /dev/null; echo rc=\\$? for $1:$2\" 2>&1 | tr -d '\\r'\ndone\necho \"=== guest 代理设置 ===\"\nadb -s localhost:5555 shell \"settings get global http_proxy\" | tr -d '\\r'\n"
    - name: Download APK + hook + frida-server(arm64)
      run: "# ★ 带重试 + 校验，避免偶发下载失败把整轮跑废\nfor i in 1 2 3 4; do\n  curl -sSL --max-time 900 -o /tmp/qd.apk \"${{ inputs.apk_url }}\" || true\n  SZ=$(stat -c%s /tmp/qd.apk 2>/dev/null || echo 0)\n  echo \"apk try $i size=$SZ\"\n  [ \"$SZ\" -gt 10000000 ] && break\n  sleep 15\ndone\nls -l /tmp/qd.apk\nfor i in 1 2 3 4; do\n  curl -sSL --max-time 120 -o /tmp/hook_net.js \"${{ inputs.hook_url }}\" || true\n  curl -sSL --max-time 60 -o /tmp/frida_drive.py \"https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/frida_drive.py\" || true\n  echo \"frida_drive.py: $(stat -c%s /tmp/frida_drive.py 2>/dev/null) 字节\"\n  SZ=$(stat -c%s /tmp/hook_net.js 2>/dev/null || echo 0)\n  echo \"hook try $i size=$SZ\"\n  [ \"$SZ\" -gt 2000 ] && break\n  sleep 10\ndone\nfor i in 1 2 3 4; do\n  curl -sSL --max-time 600 -o /tmp/fs.xz \\\n    \"https://github.com/frida/frida/releases/download/${FV}/frida-server-${FV}-android-arm64.xz\" || true\n  if xz -t /tmp/fs.xz 2>/dev/null; then echo \"frida-server xz\
        \ ok (try $i)\"; break; fi\n  echo \"frida-server try $i 无效，重试\"\n  sleep 15\ndone\nunxz -f /tmp/fs.xz && chmod +x /tmp/fs && ls -l /tmp/fs\necho \"=== 全部下载校验 ===\"\nls -l /tmp/qd.apk /tmp/hook_net.js /tmp/fs\n"
    - name: Install Qidian + start frida-server
      run: "set +e\ntimeout 600 adb -s localhost:5555 install -r -t /tmp/qd.apk 2>&1 | tail -3\nadb -s localhost:5555 shell pm list packages | grep qidian\n# ★ 关键：frida-server 必须以 root 跑，否则无法 attach app 进程（shell uid 2000 无权限）\necho \"===== adb root =====\"\nadb -s localhost:5555 root 2>&1 | tail -2\nsleep 6\nadb -s localhost:5555 wait-for-device 2>/dev/null || true\ntimeout 20 adb -s localhost:5555 shell id 2>&1 | head -2\nadb -s localhost:5555 push /tmp/fs /data/local/tmp/fs\nadb -s localhost:5555 push /tmp/hook_net.js /data/local/tmp/hook_net.js\nadb -s localhost:5555 shell chmod 755 /data/local/tmp/fs\nadb -s localhost:5555 shell \"setsid /data/local/tmp/fs -D >/dev/null 2>&1 &\"\nsleep 12\nadb -s localhost:5555 shell \"ps -A -o USER,UID,PID,NAME | grep -w fs\" || echo NO_FS_PROC\n# ★ 必须做端口转发，直接用 localhost:5555 连会 connection closed\nadb -s localhost:5555 forward tcp:27042 tcp:27042 || true\nadb -s localhost:5555 forward --list || true\nfor i in 1 2 3; do\n  echo \"--- frida-ps try $i\
        \ ---\"\n  frida-ps -H 127.0.0.1:27042 2>&1 | head -8 && break\n  sleep 5\ndone\n"
    - name: Launch Qidian + attach frida + capture
      run: "set +e\nmkdir -p out\nadb -s localhost:5555 shell \"pm clear com.qidian.QDReader\" 2>&1 | tail -1\nadb -s localhost:5555 shell \"logcat -c\"\n# ★ 不用 frida spawn（在 redroid 上会 InvocationTargetException 并把 App 强停），\n#   改成 am start 显式拉起 + attach（这是之前跑通的拉起方式）\n# ★ 先起后台轮询：进程一出现立刻 attach（抢在 App 发启动请求之前/之中）\n( for i in $(seq 1 60); do\n    P=$(adb -s localhost:5555 shell \"pidof com.qidian.QDReader\" 2>/dev/null | tr -d '\\r')\n    if [ -n \"$P\" ]; then\n      echo \"RACE: pid=$P at try $i, attaching NOW\" >> out/race.log\n      echo \"=== 用 Python frida API 驱动（避免 CLI stdin=EOF 秒退）===\" >> out/capture.txt\n      timeout 4700 python3 /tmp/frida_drive.py \"$P\" /tmp/hook_net.js 4500 \\\n        > out/capture.txt 2>&1\n      break\n    fi\n    sleep 0.4\n  done ) &\necho \"===== am start =====\"\n# ★ 动态解析启动 Activity（不硬编码，加固包也能拉到）\nAPK_PKG=com.qidian.QDReader\necho \"--- 已安装的 qidian 包 ---\"\nadb -s localhost:5555 shell \"pm list packages | grep -i qidian\" | tr -d '\\r'\necho \"--- 解析\
        \ LAUNCHER activity ---\"\nLA=$(adb -s localhost:5555 shell \"cmd package resolve-activity --brief -c android.intent.category.LAUNCHER $APK_PKG\" 2>/dev/null | tail -1 | tr -d '\\r')\necho \"LAUNCHER=$LA\"\necho \"--- manifest 里的 MAIN 入口 ---\"\nadb -s localhost:5555 shell \"dumpsys package $APK_PKG | grep -A3 android.intent.action.MAIN\" 2>/dev/null | head -12 | tr -d '\\r'\nif [ -n \"$LA\" ] && [ \"$LA\" != \"No activity found\" ]; then\n  echo \">>> 用解析到的 Activity 启动: $LA\"\n  adb -s localhost:5555 shell \"am start -W -n $LA\" 2>&1 | tail -5\nelse\n  echo \">>> 解析失败，退回 monkey 全类别\"\n  adb -s localhost:5555 shell \"monkey -p $APK_PKG 1\" 2>&1 | tail -5\nfi\nsleep 25\ncat out/race.log 2>/dev/null || echo \"(race 未触发)\" \nadb -s localhost:5555 shell \"dumpsys activity activities | grep ResumedActivity\"\necho \"===== 等 attach 生效 =====\"\nfor i in $(seq 1 30); do\n  if grep -qF \"script loaded OK\" out/capture.txt 2>/dev/null; then echo \"hook ready (try $i)\"; break; fi\n  sleep 2\n\
        done\necho \"===== attach 后 capture 前 20 行 =====\"\nhead -20 out/capture.txt\necho \"===== T+45s capture =====\"\nwc -l out/capture.txt; head -70 out/capture.txt\nadb -s localhost:5555 shell \"dumpsys activity activities | grep ResumedActivity\"\n"
    - name: Drive UI (privacy agree -> login page)
      run: "set +e\ntap_checkable() {\n  adb -s localhost:5555 shell \"uiautomator dump /sdcard/uc.xml >/dev/null 2>&1\"\n  local XML=$(adb -s localhost:5555 shell \"cat /sdcard/uc.xml\" 2>/dev/null | tr -d '\\r')\n  # 找 checkable=\"true\" 或 CheckBox 类节点\n  local BB=$(echo \"$XML\" | sed 's/></>\\n</g' | grep -E 'checkable=\"true\"|android.widget.CheckBox' | grep -oE 'bounds=\"\\[[0-9]+,[0-9]+\\]\\[[0-9]+,[0-9]+\\]\"' | head -1 | grep -oE '\\[[0-9]+,[0-9]+\\]\\[[0-9]+,[0-9]+\\]')\n  echo \"  checkable bounds: $BB\"\n  if [ -n \"$BB\" ]; then\n    local N=$(echo \"$BB\" | sed -E 's/^\\[([0-9]+),([0-9]+)\\]\\[([0-9]+),([0-9]+)\\]$/\\1 \\2 \\3 \\4/')\n    set -- $N\n    adb -s localhost:5555 shell \"input tap $(( ($1+$3)/2 )) $(( ($2+$4)/2 ))\"\n    echo \"  已勾选协议复选框\"\n    return 0\n  fi\n  return 1\n}\ntap_text() {\n  local T=\"$1\"\n  adb -s localhost:5555 shell \"uiautomator dump /sdcard/u.xml >/dev/null 2>&1\"\n  local XML=$(adb -s localhost:5555 shell \"cat /sdcard/u.xml\" 2>/dev/null\
        \ | tr -d '\\r')\n  local BB=$(echo \"$XML\" | sed 's/></>\\n</g' | grep -oE \"text=\\\"$T\\\"[^>]*bounds=\\\"\\[[0-9]+,[0-9]+\\]\\[[0-9]+,[0-9]+\\]\\\"\" | head -1 | grep -oE '\\[[0-9]+,[0-9]+\\]\\[[0-9]+,[0-9]+\\]')\n  echo \"  tap '$T' bounds: $BB\"\n  if [ -n \"$BB\" ]; then\n    local N=$(echo \"$BB\" | sed -E 's/^\\[([0-9]+),([0-9]+)\\]\\[([0-9]+),([0-9]+)\\]$/\\1 \\2 \\3 \\4/')\n    set -- $N\n    adb -s localhost:5555 shell \"input tap $(( ($1+$3)/2 )) $(( ($2+$4)/2 ))\"\n    return 0\n  fi\n  return 1\n}\nsleep 20\necho \"--- 当前 activity ---\"\nadb -s localhost:5555 shell \"dumpsys activity activities | grep -E 'ResumedActivity'\"\necho \"--- 界面文本 ---\"\nadb -s localhost:5555 shell \"uiautomator dump /sdcard/u0.xml >/dev/null 2>&1\"\nadb -s localhost:5555 shell \"cat /sdcard/u0.xml\" 2>/dev/null | tr -d '\\r' | sed 's/></>\\n</g' | grep -oE 'text=\"[^\"]+\"' | sort -u | head -30\ntap_text \"同意并继续\" || tap_text \"同意\" || true\n# ★ 这个 App 就是慢（文献记录：点完同意后需要 ~140s 才进 GuidanceActivity\
        \ 登录页）\nfor w in 60 120 180 240; do\n  sleep 60\n  echo \"--- T+${w}s activity ---\"\n  adb -s localhost:5555 shell \"dumpsys activity activities | grep -E 'ResumedActivity'\" | tr -d '\\r'\n  adb -s localhost:5555 shell \"uiautomator dump /sdcard/uw.xml >/dev/null 2>&1\"\n  adb -s localhost:5555 shell \"cat /sdcard/uw.xml\" 2>/dev/null | tr -d '\\r' | sed 's/></>\\n</g' | grep -oE 'text=\"[^\"]+\"' | sort -u | head -20\n  echo \"  --- capture 行数: $(wc -l < out/capture.txt 2>/dev/null) ---\"\ndone\necho \"--- ★ 关键：在 hook 生效后主动触发请求（填号+获取验证码）---\"\n# 1) 点手机号输入框并输入（用 adb input text，不依赖 IME）\ntap_text \"请输入手机号码\" || true\nsleep 3\nadb -s localhost:5555 shell \"input text 13800138000\" || true\nsleep 3\nadb -s localhost:5555 shell \"uiautomator dump /sdcard/u2.xml >/dev/null 2>&1\"\nadb -s localhost:5555 shell \"cat /sdcard/u2.xml\" 2>/dev/null | tr -d '\\r' | sed 's/></>\\n</g' | grep -oE 'text=\"[^\"]+\"' | sort -u | head -15\n# 2) 勾协议 + 点获取验证码/登录\necho \"--- 勾选协议（精确点 checkable 节点）---\"\
        \ntap_checkable || tap_text \"我已阅读并接受《用户服务协议》及《隐私协议》\" || true\nsleep 3\nadb -s localhost:5555 shell \"uiautomator dump /sdcard/uc2.xml >/dev/null 2>&1\"\nadb -s localhost:5555 shell \"cat /sdcard/uc2.xml\" 2>/dev/null | tr -d '\\r' | sed 's/></>\\n</g' | grep -oE 'checkable=\"true\"[^>]*checked=\"[a-z]+\"' | head -3\necho \"   capture 行数: $(wc -l < out/capture.txt)\"\necho \"--- 点 获取验证码 ---\"\ntap_text \"获取验证码\" || true\nsleep 25\necho \"--- 点 登录 ---\"\ntap_text \"登录\" || true\nsleep 30\necho \"--- 触发后 capture 行数: $(wc -l < out/capture.txt) ---\"\necho \"--- ★★ 补强触发：点协议链接（开 WebView 必联网）---\"\ntap_text \"《用户服务协议》及《隐私协议》\" || true\nsleep 8\ntap_text \"《用户服务协议》\" || true\nsleep 15\nadb -s localhost:5555 shell \"input keyevent KEYCODE_BACK\" || true\nsleep 5\necho \"--- ★★ 点 +86 国家选择器（必拉服务端列表）---\"\ntap_text \"+86\" || true\nsleep 20\nadb -s localhost:5555 shell \"uiautomator dump /sdcard/u3.xml >/dev/null 2>&1\"\nadb -s localhost:5555 shell \"cat /sdcard/u3.xml\" 2>/dev/null | tr -d\
        \ '\\r' | sed 's/></>\\n</g' | grep -oE 'text=\"[^\"]+\"' | sort -u | head -15\necho \"   capture 行数: $(wc -l < out/capture.txt)\"\nadb -s localhost:5555 shell \"input keyevent KEYCODE_BACK\" || true\nsleep 5\necho \"--- QQ/微信入口（图标按钮，坐标兜底）---\"\nadb -s localhost:5555 shell \"input tap 539 1840\" || true\nsleep 25\nadb -s localhost:5555 shell \"input tap 232 1840\" || true\nsleep 25\necho \"--- 最终 capture 行数: $(wc -l < out/capture.txt) ---\"\necho \"--- 最终界面 ---\"\nadb -s localhost:5555 shell \"dumpsys activity activities | grep ResumedActivity\"\nadb -s localhost:5555 shell \"uiautomator dump /sdcard/u4.xml >/dev/null 2>&1\"\nadb -s localhost:5555 shell \"cat /sdcard/u4.xml\" 2>/dev/null | tr -d '\\r' | sed 's/></>\\n</g' | grep -oE 'text=\"[^\"]+\"' | sort -u | head -15\nadb -s localhost:5555 shell \"dumpsys activity activities | grep -E 'ResumedActivity'\" | tr -d '\\r'\n"
    - name: ★ 拉起登录页 + 立刻截图
      run: "set +e\nadb -s localhost:5555 shell \"am start -a android.intent.action.VIEW -d 'QDReader://login'\" 2>&1 | tail -3\nsleep 20\nadb -s localhost:5555 shell \"dumpsys activity activities | grep ResumedActivity\"\nmkdir -p qr\nfor i in 1 2; do\n  adb -s localhost:5555 exec-out screencap -p > qr/qr_$i.png 2>/dev/null\n  echo \"qr_$i size=$(stat -c%s qr/qr_$i.png 2>/dev/null || echo 0)\"\n  sleep 15\ndone\nls -la qr/\n"
    - name: ★★★ 勾协议 → 点QQ图标 → 连拍二维码
      run: "          set +e\n          echo \"===== 当前界面 =====\"\n          adb -s localhost:5555 shell \"dumpsys activity activities | grep ResumedActivity\" | tr -d '\\r'\n          adb -s localhost:5555 shell \"uiautomator dump /sdcard/q.xml >/dev/null 2>&1\"\n          adb -s localhost:5555 shell \"cat /sdcard/q.xml\" 2>/dev/null | tr -d '\\r' > q.xml\n          cat q.xml | sed 's/></>\\n</g' | grep -E 'clickable=\"true\"|checkable=\"true\"' | grep -oE '(text|content-desc|resource-id)=\"[^\"]*\"[^>]*bounds=\"\\[[0-9]+,[0-9]+\\]\\[[0-9]+,[0-9]+\\]\"' | head -20\n          mkdir -p qr2\n          # ① 先勾协议（QQ 登录要求先同意协议）\n          BB=$(cat q.xml | sed 's/></>\\n</g' | grep -E 'checkable=\"true\"' | grep -oE 'bounds=\"\\[[0-9]+,[0-9]+\\]\\[[0-9]+,[0-9]+\\]\"' | head -1)\n          echo \"协议勾选框: ${BB:-未找到}\"\n          if [ -n \"$BB\" ]; then\n            N=$(echo \"$BB\" | sed -E 's/bounds=\"\\[([0-9]+),([0-9]+)\\]\\[([0-9]+),([0-9]+)\\]\"/\\1 \\2 \\3 \\4/')\n            set -- $N; adb\
        \ -s localhost:5555 shell \"input tap $(( ($1+$3)/2 )) $(( ($2+$4)/2 ))\"; echo \"  已勾协议\"; sleep 4\n          fi\n          # ② 点 QQ 图标：真实坐标 (539,1840)；再试邻近\n          for C in \"539 1840\" \"660 1840\" \"420 1840\" \"539 1780\" \"539 1900\" \"660 1780\"; do\n            set -- $C\n            echo \">>> tap QQ ($1,$2)\"\n            adb -s localhost:5555 shell \"input tap $1 $2\"\n            sleep 12\n            adb -s localhost:5555 exec-out screencap -p > qr2/qq_$1_$2.png 2>/dev/null\n            echo \"   size=$(stat -c%s qr2/qq_$1_$2.png 2>/dev/null)\"\n            adb -s localhost:5555 shell \"dumpsys activity activities | grep ResumedActivity\" | tr -d '\\r'\n          done\n          echo \"===== 最终界面文字 =====\"\n          adb -s localhost:5555 shell \"uiautomator dump /sdcard/qf.xml >/dev/null 2>&1\"\n          adb -s localhost:5555 shell \"cat /sdcard/qf.xml\" 2>/dev/null | tr -d '\\r' | sed 's/></>\\n</g' | grep -oE 'text=\"[^\"]+\"' | sort -u | head -20\n          ls\
        \ -la qr2/"
    - name: ★★ 立刻上传二维码（这一条先传，好让你马上扫）
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: qr
        path: qr/
        if-no-files-found: warn
    - name: ★ 保持会话等你扫码（25 分钟）
      run: "set +e\nfor i in $(seq 1 120); do\n  sleep 30\n  R=$(adb -s localhost:5555 shell \"dumpsys activity activities | grep ResumedActivity\" 2>/dev/null | tr -d '\\r')\n  echo \"[$i] $R\"\n  # 登录成功后通常不再是登录页\n  case \"$R\" in *Login*|*login*) ;; *) echo \"★ 活动已变化，可能登录成功\"; break;; esac\ndone\nadb -s localhost:5555 exec-out screencap -p > out_after_login.png 2>/dev/null\necho \"===== 登录后挂钩输出 =====\"\ngrep -E \"★★|QIMEI|ibex|OLA|NIB|additionalKey|status=|明文|找不到类\" out/capture.txt 2>/dev/null | head -50\n"
    - name: ★ 深链打开一章（触发解密）
      run: 'set +e

        adb -s localhost:5555 shell "am start -a android.intent.action.VIEW -d ''QDReader://OpenBook/1049120379/903350205''" 2>&1 | tail -3

        sleep 40

        adb -s localhost:5555 exec-out screencap -p > out/after_chapter.png 2>/dev/null

        echo "===== 解密挂钩输出 ★★★ ====="

        grep -E "★★★|additionalKey|status=|明文|cipher 全量" out/capture.txt 2>/dev/null | head -60

        '
    - name: Keep capturing then dump
      run: 'set +e

        sleep 120

        echo "===== FULL CAPTURE ====="

        cat out/capture.txt

        echo "===== ★ 内核级：app uid 有没有 TCP 连接 ====="

        adb -s localhost:5555 shell "cat /proc/net/tcp /proc/net/tcp6 2>/dev/null | wc -l" | tr -d ''\r''

        echo "--- 非 00000000/0000000000000000 的对端连接（有外部连接就会出现在这）---"

        adb -s localhost:5555 shell "cat /proc/net/tcp /proc/net/tcp6 2>/dev/null" | tr -d ''\r'' | awk ''NR>1'' | head -20

        echo "--- app 进程的 socket 统计 ---"

        PIDX=$(adb -s localhost:5555 shell "pidof com.qidian.QDReader" 2>/dev/null | tr -d ''\r'')

        echo "app pid=$PIDX"

        adb -s localhost:5555 shell "ls -l /proc/$PIDX/fd 2>/dev/null | grep -c socket" | tr -d ''\r''

        echo "--- tcpdump 抓 15 秒（若容器里有）---"

        adb -s localhost:5555 shell "which tcpdump" | tr -d ''\r''

        echo "===== logcat 全量过滤（放宽 tag）====="

        adb -s localhost:5555 shell "logcat -d -v brief" 2>/dev/null | grep -iE "qidian|argus|sora|cmfu|QDInfo|okhttp|retrofit|http|network|Exception" | tail -80

        '
    - name: Upload
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: capture
        path: out/
        if-no-files-found: warn
