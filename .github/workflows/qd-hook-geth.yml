name: qd-hook-geth
on:
  workflow_dispatch:

jobs:
  hook:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup redroid + frida
        run: |
          set +e
          sudo -S -p '' -S -p '' apt-get update -qq || true
          sudo -S -p '' -S -p '' apt-get install -y -qq linux-modules-extra-$(uname -r) android-tools-adb curl xz-utils unzip python3-pip || echo APT_PARTIAL
          sudo -S -p '' -S -p '' modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>&1 || echo MODPROBE_MAYBE
          pip install -q "frida==16.7.19" "frida-tools<14" "pycryptodome" 2>&1 | tail -1
          
          sudo -S -p '' -S -p '' docker rm -f redroid 2>/dev/null || true
          VOLS=""
          for d in binder hwbinder vndbinder; do [ -e /dev/$d ] && VOLS="$VOLS -v /dev/$d:/dev/$d"; done
          sudo -S -p '' -S -p '' docker run -d --privileged --name redroid $VOLS -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.redroid_width=720 androidboot.redroid_height=1184 androidboot.redroid_dpi=240 \
            androidboot.redroid_gpu_mode=guest 2>&1 | tail -1
          
          adb start-server >/dev/null 2>&1; sleep 5
          for i in $(seq 1 30); do
            adb connect localhost:5555 >/dev/null 2>&1
            S=$(timeout 8 adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$S" = "1" ] && break
            sleep 6
          done
          adb -s localhost:5555 shell "echo BOOT_OK"
          
          FR=16.7.19
          curl -sSL --max-time 180 -o fs.xz "https://github.com/frida/frida/releases/download/${FR}/frida-server-${FR}-android-arm64.xz"
          unxz -f fs.xz 2>/dev/null || gunzip -f fs.xz 2>/dev/null
          mv -f fs fs-server 2>/dev/null; chmod +x fs-server
          timeout 30 adb -s localhost:5555 root 2>&1 | head -1
          sleep 6; timeout 30 adb -s localhost:5555 wait-for-device || true
          adb -s localhost:5555 shell "setenforce 0" 2>&1 | head -1
          adb -s localhost:5555 push fs-server /data/local/tmp/fs-srv >/dev/null 2>&1
          adb -s localhost:5555 shell "chmod 755 /data/local/tmp/fs-srv"
          echo "Setup complete"

      - name: Install App + Generate borgus
        run: |
          set +e
          B=localhost:5555
          
          curl -sSL --max-time 900 -o q464.apk "https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/qidian_7.9.464.apk"
          adb -s $B push q464.apk /data/local/tmp/q464.apk >/dev/null 2>&1
          adb -s $B shell "pm install -r -d -t --user 0 /data/local/tmp/q464.apk" 2>&1 | tail -1
          adb -s $B logcat -c 2>/dev/null
          
          adb -s $B shell "am start -n com.qidian.QDReader/.ui.activity.SplashActivity" >/dev/null 2>&1
          
          STABLE_PID=""
          for i in $(seq 1 15); do
            sleep 3
            P=$(adb -s $B shell pidof com.qidian.QDReader | tr -d '\r')
            if [ -n "$P" ]; then
              sleep 5
              P2=$(adb -s $B shell pidof com.qidian.QDReader | tr -d '\r')
              if [ "$P" = "$P2" ] && [ -n "$P2" ]; then
                STABLE_PID=$P
                echo "App stable PID=$STABLE_PID"
                break
              fi
            fi
          done
          
          [ -z "$STABLE_PID" ] && { echo "NO_APP"; exit 0; }
          
          adb -s $B shell "setsid /data/local/tmp/fs-srv -D >/dev/null 2>&1 &"
          sleep 8
          adb -s $B forward tcp:27042 tcp:27042
          
          cat > hook_geth.js << 'HOOKEOF'
          Java.perform(function() {
              setTimeout(function() {
                  try {
                      var FockUtil = Java.use("com.qidian.QDReader.component.util.FockUtil");
                      var instance = FockUtil.INSTANCE.value;
                      var RequestBody = Java.use("okhttp3.RequestBody");
                      var MediaType = Java.use("okhttp3.MediaType");
                      var mediaType = MediaType.parse("application/x-www-form-urlencoded");
                      
                      var url = "https://bravev6.if.qidian.com/argus/api/v1/client/getconf?localLabels=&gender=0";
                      var body = RequestBody.create(mediaType, "localLabels=&gender=0");
                      var result = instance.getH(url, "POST", body);
                      
                      var rm = Java.cast(result, Java.use("java.util.Map"));
                      var iter = rm.entrySet().iterator();
                      var output = {};
                      while (iter.hasNext()) {
                          var en = Java.cast(iter.next(), Java.use("java.util.Map$Entry"));
                          output[String(en.getKey())] = String(en.getValue());
                      }
                      console.log("[BORGUS_DATA] " + JSON.stringify(output));
                      
                  } catch(e) {
                      console.log("[ERROR] " + e);
                  }
              }, 3000);
          });
          HOOKEOF
          
          timeout 30 frida -H 127.0.0.1:27042 -p $STABLE_PID -l hook_geth.js 2>&1 | tee /tmp/geth_output.log
          echo "Frida done"

      - name: Call getconf with borgus
        run: |
          set +e
          echo "=== Calling getconf with fresh borgus ==="
          python3 getconf_test.py /tmp/geth_output.log 2>&1
          echo "=== Done ==="

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geth-hook-result
          path: |
            /tmp/geth_output.log
          if-no-files-found: warn
