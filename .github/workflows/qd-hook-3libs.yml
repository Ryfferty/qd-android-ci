name: qd-hook-3libs
on:
  workflow_dispatch:

jobs:
  hook:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        run: |
          set +e
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq linux-modules-extra-$(uname -r) android-tools-adb curl xz-utils unzip python3-pip || echo APT
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>&1 || echo MODPROBE
          pip install -q "frida==16.7.19" "frida-tools<14" "pycryptodome" 2>&1 | tail -1
          
          sudo docker rm -f redroid 2>/dev/null || true
          VOLS=""
          for d in binder hwbinder vndbinder; do [ -e /dev/$d ] && VOLS="$VOLS -v /dev/$d:/dev/$d"; done
          sudo docker run -d --privileged --name redroid $VOLS -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.redroid_width=720 androidboot.redroid_height=1184 \
            androidboot.redroid_dpi=240 androidboot.redroid_gpu_mode=guest
          
          adb start-server >/dev/null 2>&1; sleep 5
          for i in $(seq 1 30); do
            adb connect localhost:5555 >/dev/null 2>&1
            S=$(timeout 8 adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$S" = "1" ] && break
            sleep 6
          done
          echo "BOOT_OK"
          
          FR=16.7.19
          curl -sSL --max-time 180 -o fs.xz "https://github.com/frida/frida/releases/download/${FR}/frida-server-${FR}-android-arm64.xz"
          unxz -f fs.xz; mv -f fs fs-server; chmod +x fs-server
          timeout 30 adb -s localhost:5555 root 2>&1 | head -1
          sleep 6
          adb -s localhost:5555 shell "setenforce 0" 2>&1 | head -1
          adb -s localhost:5555 push fs-server /data/local/tmp/fs-srv >/dev/null 2>&1
          adb -s localhost:5555 shell "chmod 755 /data/local/tmp/fs-srv"

      - name: Hook 3 Libraries
        run: |
          set +e
          which adb || sudo apt-get install -y -qq android-tools-adb
          B=localhost:5555
          
          curl -sSL --max-time 300 -o q464.apk "https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/qidian_7.9.464.apk"
          timeout 120 adb -s $B push q464.apk /data/local/tmp/q464.apk >/dev/null 2>&1
          timeout 120 adb -s $B shell "pm install -r -d -t --user 0 /data/local/tmp/q464.apk" 2>&1 | tail -1
          timeout 30 adb -s $B shell "am start -n com.qidian.QDReader/.ui.activity.SplashActivity"
          
          # ★ 删除qv1.xml强制重新REGISTER!
          echo "=== Deleting qv1.xml to force re-register ==="
          timeout 10 adb -s $B shell "find /data/data/com.qidian.QDReader -name 'qv1*' -o -name '*ostar*' -o -name '*beacon*' 2>/dev/null" | head -10
          timeout 10 adb -s $B shell "rm -f /data/data/com.qidian.QDReader/files/qv1.xml 2>/dev/null"
          echo "qv1.xml deleted (if existed)" >/dev/null 2>&1
          
          STABLE_PID=""
          for i in $(seq 1 15); do
            sleep 3
            P=$(timeout 10 adb -s $B shell pidof com.qidian.QDReader | tr -d '\r')
            if [ -n "$P" ]; then
              sleep 5
              P2=$(timeout 10 adb -s $B shell pidof com.qidian.QDReader | tr -d '\r')
              if [ "$P" = "$P2" ] && [ -n "$P2" ]; then
                STABLE_PID=$P
                echo "PID=$STABLE_PID"
                break
              fi
            fi
          done
          [ -z "$STABLE_PID" ] && { echo "NO_APP"; exit 0; }
          
          timeout 10 adb -s $B shell "setsid /data/local/tmp/fs-srv -D >/dev/null 2>&1 &"
          sleep 8
          timeout 10 adb -s $B forward tcp:27042 tcp:27042
          
          # 用独立的干净JS文件!
          cp hook_3libs_clean.js hook_3libs.js
          
          
          timeout 30 frida -H 127.0.0.1:27042 -p $STABLE_PID -l hook_3libs.js 2>&1 | tee /tmp/hook_3libs_output.log
          echo "=== Hook done ==="

      - name: Python REGISTER
        run: |
          set +e
          echo "=== Python REGISTER ==="
          python3 << 'PYEOF'
          import json, re, urllib.request, urllib.parse, urllib.error, gzip, time, hashlib, base64
          from Crypto.Cipher import DES3, DES
          import sys
          sys.path.insert(0, '.')
          
          # 读取Frida输出!
          log = open('/tmp/hook_3libs_output.log').read()
          
          # 提取REGISTER_DATA!
          m = re.search(r'\[REGISTER_DATA\] (\{.*\})', log)
          if not m:
              print("NO_REGISTER_DATA")
              sys.exit(1)
          
          data = json.loads(m.group(1))
          headers = data['headers']
          print(f"borgus: {headers.get('borgus', 'NONE')}")
          print(f"cecelia: {headers.get('cecelia', 'NONE')[:50]}")
          print(f"QDSign: {headers.get('QDSign', 'NONE')[:40]}...")
          
          # 构造REGISTER body!
          nn = data['nn']
          tm = data['tm']
          pms = data['pms']
          
          # 用样本的sn格式!
          sn = "4c43851051e10785" + format(int(time.time() * 1000) % 0xFFFFFF, '06x') + "0000000000000000000000000000000000"
          
          reg_data = {
              "cpt": "2",
              "ext": "",
              "nn": nn,
              "pms": pms,
              "sn": sn,
              "tm": tm
          }
          body = "data=" + urllib.parse.quote(json.dumps(reg_data))
          
          # 构造完整headers!
          req_headers = {
              'User-Agent': headers.get('User-Agent', 'Mozilla/mobile QDReaderAndroid/7.9.480/1996/1002138/redroid'),
              'Cookie': headers.get('Cookie', ''),
              'QDInfo': headers.get('QDInfo', ''),
              'tstamp': headers.get('tstamp', str(int(time.time() * 1000))),
              'QDSign': headers.get('QDSign', ''),
              'borgus': headers.get('borgus', ''),
              'cecelia': headers.get('cecelia', ''),
              'ibex': data.get('ibex', ''),
              'Content-Type': 'application/x-www-form-urlencoded',
              'Referer': 'http://android.qidian.com',
              'Accept-Encoding': 'gzip',
          }
          
          url = data['url']
          print(f"\n--- Sending REGISTER ---")
          print(f"URL: {url}")
          print(f"body: {body[:100]}...")
          
          try:
              req = urllib.request.Request(url, data=body.encode(), headers=req_headers, method='POST')
              r = urllib.request.urlopen(req, timeout=30)
              raw = r.read()
              try: raw = gzip.decompress(raw)
              except: pass
              resp = raw.decode('utf-8', errors='replace')
              print(f"HTTP: {r.status}")
              print(f"★★★REGISTER RESPONSE: {resp[:500]}")
              
              # 解析!
              jr = json.loads(resp)
              print(f"Result: {jr.get('Result')}")
              inner = json.loads(jr.get('Data', '{}'))
              print(f"code: {inner.get('code')}")
              print(f"data(qimei): {inner.get('data', '')[:50]}")
          except urllib.error.HTTPError as e:
              b = e.read()
              try: b = gzip.decompress(b)
              except: pass
              print(f"HTTP {e.code}: {b.decode('utf-8', errors='replace')[:300]}")
          except Exception as e:
              print(f"Error: {e}")
          PYEOF

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hook-3libs-result
          path: /tmp/hook_3libs_output.log
          if-no-files-found: warn
