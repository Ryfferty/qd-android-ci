name: qd-ui-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm

      - name: Download APK
        run: |
          mkdir -p apks && cd apks
          wget -q "https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/qidian_7.9.200.apk" -O qidian.apk
          ls -la

      - name: Run emulator and probe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 4096 -cores 4
          disable-animations: true
          script: |
            set +e
            W=$GITHUB_WORKSPACE
            O=$W/out
            mkdir -p $O

            echo "##### install #####"
            adb install -r -t $W/apks/qidian.apk 2>&1 | tail -2
            adb shell pm list packages | grep qidian

            echo "##### launch #####"
            adb shell am start -n com.qidian.QDReader/.ui.activity.SplashActivity 2>&1 | tail -1
            sleep 35

            echo "##### capture 1 #####"
            adb shell screencap -p /sdcard/s1.png
            adb pull /sdcard/s1.png $O/1_launch.png
            adb shell uiautomator dump /sdcard/u1.xml >/dev/null 2>&1
            adb pull /sdcard/u1.xml $O/u1.xml
            adb shell dumpsys activity activities 2>/dev/null | grep -E "mResumedActivity" > $O/act1.txt

            echo "##### tap agree (bottom area) #####"
            adb shell input tap 540 1980
            sleep 8
            adb shell input tap 540 1980
            sleep 15

            echo "##### capture 2 #####"
            adb shell screencap -p /sdcard/s2.png
            adb pull /sdcard/s2.png $O/2_after_agree.png
            adb shell uiautomator dump /sdcard/u2.xml >/dev/null 2>&1
            adb pull /sdcard/u2.xml $O/u2.xml
            adb shell dumpsys activity activities 2>/dev/null | grep -E "mResumedActivity" > $O/act2.txt

            echo "##### tap bottom-right tab (my page) #####"
            adb shell input tap 1000 2290
            sleep 15

            echo "##### capture 3 #####"
            adb shell screencap -p /sdcard/s3.png
            adb pull /sdcard/s3.png $O/3_mytab.png
            adb shell uiautomator dump /sdcard/u3.xml >/dev/null 2>&1
            adb pull /sdcard/u3.xml $O/u3.xml
            adb shell dumpsys activity activities 2>/dev/null | grep -E "mResumedActivity" > $O/act3.txt

            echo "##### files #####"
            ls -la $O/

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-probe
          path: out/
          retention-days: 3
