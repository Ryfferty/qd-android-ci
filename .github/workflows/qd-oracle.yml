name: qd-oracle
# 抓 App 自己成功解密的 ground-truth: unlock 入参(★addKey真值)+明文+onError 诊断 JSON
# ★ 严格 §9.13: write_consent → 首启 → tap 跳引导(轮询到 MMKV>500) → 稳定 → frida 改名后起
#   → 单窗口同步 attach → +12s 深链免费章 → 抓 240s
on:
  workflow_dispatch:
    inputs:
      book:
        description: bookId(免费章)
        default: '1049120379'
        required: false
      chap:
        description: chapterId(免费章)
        default: '903350205'
        required: false

jobs:
  oracle:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: redroid boot + install 464 + §9.13 初始化到主界面
        run: |
          set +e
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq linux-modules-extra-$(uname -r) adb curl xz-utils unzip || echo APT_PARTIAL
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>&1 || echo MODPROBE_MAYBE
          sudo docker rm -f redroid 2>/dev/null || true
          VOLS=""
          for d in binder hwbinder vndbinder; do [ -e /dev/$d ] && VOLS="$VOLS -v /dev/$d:/dev/$d"; done
          sudo docker run -d --privileged --name redroid $VOLS -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.redroid_width=1080 androidboot.redroid_height=2340 androidboot.redroid_dpi=420 \
            androidboot.redroid_gpu_mode=guest 2>&1 | tail -1
          B=localhost:5555
          adb start-server >/dev/null 2>&1; sleep 5
          for i in $(seq 1 30); do adb connect $B >/dev/null 2>&1; S=$(timeout 8 adb -s $B shell getprop sys.boot_completed 2>/dev/null | tr -d '\r'); [ "$S" = "1" ] && break; sleep 6; done
          echo "boot=$(timeout 8 adb -s $B shell getprop sys.boot_completed | tr -d '\r')"
          echo "=== 装 464 原版 ==="
          for i in 1 2 3; do curl -sSL --max-time 1200 -o q464.apk "https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/qidian_7.9.464.apk" && [ $(stat -c%s q464.apk) -gt 100000000 ] && break; sleep 10; done
          echo "apk=$(stat -c%s q464.apk 2>/dev/null)"
          timeout 300 adb -s $B push q464.apk /data/local/tmp/q464.apk >/dev/null 2>&1
          timeout 300 adb -s $B shell "pm install -r -d -t --user 0 /data/local/tmp/q464.apk" 2>&1 | tail -1
          timeout 30 adb -s $B root >/dev/null 2>&1; sleep 5; timeout 30 adb -s $B wait-for-device
          timeout 20 adb -s $B shell "setenforce 0" 2>/dev/null
          echo "=== ③ 跳隐私: write_consent.sh ==="
          bash write_consent.sh 2>&1 | tail -2
          echo "=== ④ 首启 + tap 跳引导 (轮询到 MMKV>500) ==="
          timeout 20 adb -s $B shell "am start -n com.qidian.QDReader/.ui.activity.SplashActivity" >/dev/null 2>&1
          sleep 30
          for i in $(seq 1 14); do
            timeout 15 adb -s $B shell "uiautomator dump /sdcard/u.xml >/dev/null 2>&1"
            timeout 20 adb -s $B shell "cat /sdcard/u.xml" 2>/dev/null | tr -d '\r' > /tmp/u2.xml
            for ID in btnAgree upgrade_dialog_close_btn btn_negative tvSkip close_btn tv_skip; do
              XY=$(python3 tap_id.py /tmp/u2.xml $ID 2>/dev/null | head -1)
              [ -n "$XY" ] && { echo "  轮$i 点 $ID @ $XY"; timeout 10 adb -s $B shell "input tap $XY"; sleep 4; }
            done
            SZ=$(timeout 8 adb -s $B shell "stat -c%s /data/data/com.qidian.QDReader/files/mmkv/pref_utils 2>/dev/null" | tr -d '\r')
            RES=$(timeout 8 adb -s $B shell "dumpsys activity activities | grep -oE 'mResumedActivity[^ ]* [^ ]* [a-zA-Z0-9_./]*' | head -1" | tr -d '\r')
            echo "  轮$i MMKV=${SZ:-0}B 界面=${RES}"
            [ -n "$SZ" ] && [ "$SZ" -gt 500 ] && break
            sleep 8
          done
          echo "=== ⑤ 等初始化完成 (MMKV 涨过 500) ==="
          for i in $(seq 1 8); do sleep 10; SZ=$(timeout 8 adb -s $B shell "stat -c%s /data/data/com.qidian.QDReader/files/mmkv/pref_utils 2>/dev/null" | tr -d '\r'); echo "  t=$((i*10))s MMKV=${SZ:-?}B"; [ -n "$SZ" ] && [ "$SZ" -gt 500 ] && break; done
          echo "=== App 自己的池子痕迹 (ground-truth 对照组) ==="
          timeout 8 adb -s $B shell "strings /data/data/com.qidian.QDReader/files/mmkv/pref_fock_key 2>/dev/null | head -3" | tr -d '\r' | tee /tmp/fock_devkey.txt
          timeout 8 adb -s $B shell "ls -la /data/data/com.qidian.QDReader/files/mmkv/ 2>/dev/null | head -8" | tr -d '\r'
          P=$(timeout 8 adb -s $B shell pidof com.qidian.QDReader | tr -d '\r')
          echo "STABLE_PID=$P"
          echo "STABLE=$P" >> $GITHUB_ENV

      - name: 起 frida-server + 单窗口 attach + 延后深链抓 240s
        run: |
          set +e
          B=localhost:5555
          # ⑦ App 已稳定, 现在才起 frida-server (改名 fsd)
          FR=16.7.19
          curl -sSL --max-time 300 -o fs.xz "https://github.com/frida/frida/releases/download/${FR}/frida-server-${FR}-android-arm64.xz"
          unxz -f fs.xz; mv -f fs fsd; chmod +x fsd
          timeout 60 adb -s $B push fsd /data/local/tmp/fsd >/dev/null 2>&1
          timeout 20 adb -s $B shell "chmod 755 /data/local/tmp/fsd; setsid /data/local/tmp/fsd -D >/dev/null 2>&1 &"
          sleep 8
          timeout 20 adb -s $B forward tcp:27042 tcp:27042
          pip install -q "frida==16.7.19" "frida-tools<14" 2>&1 | tail -1
          timeout 15 frida-ps -H 127.0.0.1:27042 2>&1 | head -3
          P=${STABLE}
          [ -z "$P" ] && P=$(timeout 8 adb -s $B shell pidof com.qidian.QDReader | tr -d '\r')
          echo "attach PID=$P"
          # ⑧ 同步管道 attach; 后台计划在 +12s/+70s 各发一次深链
          ( sleep 12; timeout 15 adb -s $B shell "am start -a android.intent.action.VIEW -d 'QDReader://OpenBook/${{ inputs.book }}/${{ inputs.chap }}'" > /tmp/dl1.txt 2>&1; sleep 58; timeout 15 adb -s $B shell "am start -a android.intent.action.VIEW -d 'QDReader://OpenBook/${{ inputs.book }}/${{ inputs.chap }}'" > /tmp/dl2.txt 2>&1; sleep 160 ) &
          ( sleep 240 ) | timeout 250 frida -H 127.0.0.1:27042 -p "$P" -l ci/hook_oracle_final.js > /tmp/oracle.txt 2>&1
          echo "=== 深链回执 ==="
          cat /tmp/dl1.txt /tmp/dl2.txt 2>/dev/null | tee -a /tmp/oracle.txt
          echo "=== 结束状态 ==="
          timeout 10 adb -s $B shell "dumpsys activity activities | grep -oE 'mResumedActivity.{0,80}' | head -1" | tr -d '\r' | tee -a /tmp/oracle.txt
          timeout 10 adb -s $B shell "pidof com.qidian.QDReader" | tr -d '\r' | tee -a /tmp/oracle.txt
          echo "===== 关键行 ====="
          grep -aE '★★★★★|★★★|███████|status=|addKey|onError|明文|addedKeyVersions|hooks done|F\.it|F\.add|setup\(|Fock' /tmp/oracle.txt | sed -E "s/.*'m': '((?:[^']|'')*)'.*/\1/" | head -140
          exit 0

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-capture
          path: |
            /tmp/oracle.txt
            /tmp/fock_devkey.txt
          if-no-files-found: warn
