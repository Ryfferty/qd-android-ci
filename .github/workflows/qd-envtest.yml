name: qd-envtest
# 预检专用: 逐环节测试, 每步独立报告, 不跑完整流程
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: "T1: mitmproxy二进制"
        run: |
          # arm64 runner无官方mitmproxy二进制 → pip --user装(与python3同环境)
          pip3 install --user -q mitmproxy 2>&1 | tail -1 || echo T1_PIP_FAIL
          python3 -m mitmproxy --version 2>&1 | head -1
          python3 -c "import mitmproxy; print('mitmproxy可导入')" && echo "★T1_PASS" || echo "★T1_FAIL"
      - name: "T2: mitmdump实际抓包"
        run: |
          (python3 -m mitmproxy.tools.main -w /tmp/test.mitm --set block_global=false -p 8082 > /tmp/mitm2.log 2>&1 &)
          sleep 5
          # 本机自测: curl过mitm代理访问github
          curl -sS --proxy http://127.0.0.1:8082 -k --max-time 20 https://fockrt.yuewen.com/files?t=1 -o /dev/null -w "%{http_code}" || echo T2_CURL_FAIL
          sleep 3
          pkill -f mitmdump 2>/dev/null
          # 验证: mitm是否记录了流量
          python3 -m mitmproxy.tools.main -nr /tmp/test.mitm --set flow_detail=1 2>/dev/null | grep -E "fockrt|GET|CONNECT" | head -5
          [ -s /tmp/test.mitm ] && echo "★T2_PASS(流量已记录)" || echo "★T2_FAIL"
      - name: "T3: redroid启动"
        run: |
          sudo -S -p '' modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>&1 || echo MODPROBE_MAYBE
          sudo -S -p '' docker rm -f redroid 2>/dev/null || true
          VOLS=""
          for d in binder hwbinder vndbinder; do [ -e /dev/$d ] && VOLS="$VOLS -v /dev/$d:/dev/$d"; done
          sudo -S -p '' docker run -d --privileged --name redroid $VOLS -p 5555:5555 \
            redroid/redroid:11.0.0-latest androidboot.redroid_gpu_mode=guest 2>&1 | tail -1
          sleep 15; adb start-server >/dev/null 2>&1
          for i in $(seq 1 20); do adb connect localhost:5555 >/dev/null 2>&1; S=$(timeout 8 adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r'); [ "$S" = "1" ] && break; sleep 6; done
          [ "$S" = "1" ] && echo "★T3_PASS(redroid启动)" || echo "★T3_FAIL"
      - name: "T4: CA证书注入"
        run: |
          B=localhost:5555
          timeout 30 adb -s $B root >/dev/null 2>&1; sleep 3
          CACERT=$(ls ~/.mitmproxy/mitmproxy-ca-cert.cer 2>/dev/null)
          if [ -z "$CACERT" ]; then
            # mitmdump跑一次生成CA
            (python3 -m mitmproxy.tools.main -p 8083 >/dev/null 2>&1 &); sleep 4; pkill -f mitmdump
            CACERT=$(ls ~/.mitmproxy/mitmproxy-ca-cert.cer 2>/dev/null)
          fi
          echo "CA: $CACERT"
          if [ -n "$CACERT" ]; then
            HASH=$(openssl x509 -inform PEM -subject_hash_old -in "$CACERT" | head -1)
            timeout 30 adb -s $B push "$CACERT" /data/local/tmp/cert.0 >/dev/null 2>&1
            R=$(timeout 30 adb -s $B shell "mount -o rw,remount /system 2>/dev/null; cp /data/local/tmp/cert.0 /system/etc/security/cacerts/$HASH.0 && chmod 644 /system/etc/security/cacerts/$HASH.0 && echo CA_OK" 2>&1 | tr -d '\r')
            echo "  注入结果: $R"
          else
            echo "★T4_FAIL(CA未生成)"
          fi
      - name: "T5: DNAT转发验证"
        run: |
          sudo -S -p '' iptables -t nat -A PREROUTING -s 172.17.0.0/16 -p tcp --dport 443 -j DNAT --to-destination 172.17.0.1:8082 2>&1 || echo IPT_FAIL
          # 验证规则存在
          sudo -S -p '' iptables -t nat -L PREROUTING -n 2>/dev/null | grep -c "8082" && echo "★T5_PASS(DNAT规则)" || echo "★T5_FAIL"
      - name: "总结"
        run: |
          echo "========== 环节测试总结 =========="
          echo "T1-T5结果见上方各step"
