name: qd-capture

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: qidian apk
        default: https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/qidian_7.9.200.apk
        required: false
      hook_url:
        description: frida hook
        default: https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/hook_net.js
        required: false

jobs:
  cap:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Setup binder + adb + frida-tools
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq linux-modules-extra-$(uname -r) adb curl xz-utils unzip || echo APT_FAILED
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>&1 || echo MODPROBE_FAILED
          pip install -q frida-tools 2>&1 | tail -2
          FV=$(frida --version)
          echo "FV=$FV" >> $GITHUB_ENV
          echo "frida version = $FV"

      - name: Start redroid (arm64 Android 11)
        run: |
          sudo docker rm -f redroid 2>/dev/null || true
          VOLS=""
          for d in binder hwbinder vndbinder; do if [ -e /dev/$d ]; then VOLS="$VOLS -v /dev/$d:/dev/$d"; fi; done
          sudo docker run -d --privileged --name redroid $VOLS -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.redroid_gpu_mode=guest androidboot.redroid_width=1080 \
            androidboot.redroid_height=2340 androidboot.redroid_dpi=420 \
            androidboot.redroid_adb=5555 || echo DOCKER_FAILED
          sleep 15

      - name: Boot + verify arm64
        run: |
          set +e
          adb start-server >/dev/null 2>&1
          timeout 30 adb connect localhost:5555
          for i in $(seq 1 30); do
            B=$(timeout 15 adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$B" = "1" ]; then echo "BOOT_OK try $i"; break; fi
            sleep 8
          done
          adb -s localhost:5555 shell getprop ro.product.cpu.abi
          adb -s localhost:5555 shell getprop ro.build.version.release

      - name: Download APK + hook + frida-server(arm64)
        run: |
          curl -sSL --max-time 900 -o /tmp/qd.apk "${{ inputs.apk_url }}" || echo APK_DL_FAIL
          ls -l /tmp/qd.apk
          curl -sSL --max-time 120 -o /tmp/hook_net.js "${{ inputs.hook_url }}" || echo HOOK_DL_FAIL
          wc -c /tmp/hook_net.js
          curl -sSL --max-time 300 -o /tmp/fs.xz \
            "https://github.com/frida/frida/releases/download/${FV}/frida-server-${FV}-android-arm64.xz" || echo FS_DL_FAIL
          unxz -f /tmp/fs.xz && chmod +x /tmp/fs && ls -l /tmp/fs

      - name: Install Qidian + start frida-server
        run: |
          set +e
          timeout 600 adb -s localhost:5555 install -r -t /tmp/qd.apk 2>&1 | tail -3
          adb -s localhost:5555 shell pm list packages | grep qidian
          adb -s localhost:5555 push /tmp/fs /data/local/tmp/fs
          adb -s localhost:5555 push /tmp/hook_net.js /data/local/tmp/hook_net.js
          adb -s localhost:5555 shell chmod 755 /data/local/tmp/fs
          adb -s localhost:5555 shell "setsid /data/local/tmp/fs -D >/dev/null 2>&1 &"
          sleep 12
          adb -s localhost:5555 shell "ps -A | grep fs" || echo NO_FS_PROC
          frida-ps -H localhost:5555 2>&1 | head -15 || echo FRIDA_CONNECT_FAIL

      - name: Spawn Qidian under frida and capture traffic
        run: |
          set +e
          mkdir -p out
          adb -s localhost:5555 shell "pm clear com.qidian.QDReader" 2>&1 | tail -1
          adb -s localhost:5555 shell "logcat -c"
          # 用 spawn 模式，确保启动即挂上 hook
          timeout 420 frida -H localhost:5555 -f com.qidian.QDReader -l /data/local/tmp/hook_net.js -q \
            > out/capture.txt 2>&1 &
          FPID=$!
          sleep 60
          echo "===== T+60s capture head ====="
          head -80 out/capture.txt

      - name: Drive UI (privacy agree -> login page)
        run: |
          set +e
          tap_text() {
            local T="$1"
            adb -s localhost:5555 shell "uiautomator dump /sdcard/u.xml >/dev/null 2>&1"
            local XML=$(adb -s localhost:5555 shell "cat /sdcard/u.xml" 2>/dev/null | tr -d '\r')
            local BB=$(echo "$XML" | sed 's/></>\n</g' | grep -oE "text=\"$T\"[^>]*bounds=\"\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]\"" | head -1 | grep -oE '\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]')
            echo "  tap '$T' bounds: $BB"
            if [ -n "$BB" ]; then
              local N=$(echo "$BB" | sed -E 's/^\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]$/\1 \2 \3 \4/')
              set -- $N
              adb -s localhost:5555 shell "input tap $(( ($1+$3)/2 )) $(( ($2+$4)/2 ))"
              return 0
            fi
            return 1
          }
          sleep 20
          echo "--- 当前 activity ---"
          adb -s localhost:5555 shell "dumpsys activity activities | grep -E 'ResumedActivity'"
          echo "--- 界面文本 ---"
          adb -s localhost:5555 shell "uiautomator dump /sdcard/u0.xml >/dev/null 2>&1"
          adb -s localhost:5555 shell "cat /sdcard/u0.xml" 2>/dev/null | tr -d '\r' | sed 's/></>\n</g' | grep -oE 'text="[^"]+"' | sort -u | head -30
          tap_text "同意并继续" || tap_text "同意" || tap_text "同意并接受" || true
          sleep 25
          echo "--- 同意后 activity ---"
          adb -s localhost:5555 shell "dumpsys activity activities | grep -E 'ResumedActivity'"
          adb -s localhost:5555 shell "uiautomator dump /sdcard/u1.xml >/dev/null 2>&1"
          adb -s localhost:5555 shell "cat /sdcard/u1.xml" 2>/dev/null | tr -d '\r' | sed 's/></>\n</g' | grep -oE 'text="[^"]+"' | sort -u | head -30

      - name: Keep capturing then dump
        run: |
          set +e
          sleep 120
          echo "===== FULL CAPTURE ====="
          cat out/capture.txt
          echo "===== logcat qidian grep ====="
          adb -s localhost:5555 shell "logcat -d -v brief" 2>/dev/null | grep -iE "qidian|argus|sora|cmfu|QDInfo" | tail -60

      - name: Upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture
          path: out/
          if-no-files-found: warn
