name: qd-readvip-v200
# v201: 纯 mitmproxy 取证(无 frida) —— run6 证明 App 自杀与 frida 无关; mitm 不注入进程
on:
  workflow_dispatch:
    inputs:
      book:
        description: bookId
        default: '1049120379'
        required: false

permissions:
  contents: write

jobs:
  readvip:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: redroid boot + install 464 + consent
        run: |
          set +e
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq linux-modules-extra-$(uname -r) adb curl xz-utils unzip python3-pip || echo APT_PARTIAL
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>&1 || echo MODPROBE_MAYBE
          sudo docker rm -f redroid 2>/dev/null || true
          VOLS=""
          for d in binder hwbinder vndbinder; do [ -e /dev/$d ] && VOLS="$VOLS -v /dev/$d:/dev/$d"; done
          sudo docker run -d --privileged --name redroid $VOLS -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.redroid_width=1080 androidboot.redroid_height=2340 androidboot.redroid_dpi=420 \
            androidboot.redroid_gpu_mode=guest 2>&1 | tail -1
          B=localhost:5555
          adb start-server >/dev/null 2>&1; sleep 5
          for i in $(seq 1 30); do adb connect $B >/dev/null 2>&1; S=$(timeout 8 adb -s $B shell getprop sys.boot_completed 2>/dev/null | tr -d '\r'); [ "$S" = "1" ] && break; sleep 6; done
          echo "boot=$(timeout 8 adb -s $B shell getprop sys.boot_completed | tr -d '\r')"
          for i in 1 2 3; do curl -sSL --max-time 1200 -o q464.apk "https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/qidian_7.9.464.apk" && [ $(stat -c%s q464.apk) -gt 100000000 ] && break; sleep 10; done
          timeout 300 adb -s $B push q464.apk /data/local/tmp/q464.apk >/dev/null 2>&1
          timeout 300 adb -s $B shell "pm install -r -d -t --user 0 /data/local/tmp/q464.apk" 2>&1 | tail -1
          timeout 30 adb -s $B root >/dev/null 2>&1; sleep 5
          OK=0
          for i in $(seq 1 12); do
            adb disconnect $B >/dev/null 2>&1; sleep 1
            adb connect $B >/dev/null 2>&1; sleep 3
            IDOUT=$(timeout 6 adb -s $B shell id 2>/dev/null | tr -d "\r")
            echo "root轮$i: $IDOUT"
            if echo "$IDOUT" | grep -q "uid=0"; then OK=1; break; fi
            sleep 4
          done
          if [ $OK = 0 ]; then echo "KILL_SERVER_RETRY"; adb kill-server; sleep 3; adb start-server; adb connect $B; sleep 5; timeout 60 adb -s $B wait-for-device; adb -s $B shell id; fi
          timeout 20 adb -s $B shell "setenforce 0" 2>/dev/null
          timeout 20 adb -s $B shell "pm disable-user --user 0 com.android.bluetooth" >/dev/null 2>&1
          bash write_consent.sh 2>&1 | tail -2
          timeout 20 adb -s $B shell "am start -n com.qidian.QDReader/.ui.activity.SplashActivity" >/dev/null 2>&1
          sleep 30
          for i in $(seq 1 12); do
            timeout 15 adb -s $B shell "uiautomator dump /sdcard/u.xml >/dev/null 2>&1"
            timeout 20 adb -s $B shell "cat /sdcard/u.xml" 2>/dev/null | tr -d '\r' > /tmp/u2.xml
            for ID in btnAgree upgrade_dialog_close_btn btn_negative tvSkip; do
              XY=$(python3 tap_id.py /tmp/u2.xml $ID 2>/dev/null | head -1)
              [ -n "$XY" ] && { echo "轮$i 点 $ID"; timeout 10 adb -s $B shell "input tap $XY"; sleep 4; }
            done
            SZ=$(timeout 8 adb -s $B shell "stat -c%s /data/data/com.qidian.QDReader/files/mmkv/pref_utils 2>/dev/null" | tr -d '\r')
            echo "轮$i MMKV=${SZ:-0}B"
            [ -n "$SZ" ] && [ "$SZ" -gt 500 ] && break
            sleep 8
          done
          timeout 8 adb -s $B shell "am force-stop com.qidian.QDReader" >/dev/null 2>&1
          echo STEP1_DONE

      - name: mitm 接线(CA + iptables + mitmdump)
        run: |
          set +e
          B=localhost:5555
          adb connect $B >/dev/null 2>&1
          # ★ run=v201 失败根因: 宿主内核 nat 表模块没加载 → 容器 iptables "Table does not exist"
          sudo modprobe nf_conntrack nf_nat iptable_nat nf_nat_ipv4 xt_TCPMSS xt_comment 2>&1 | head -2
          lsmod | grep -E "nat|conntrack" | head -6
          sudo iptables -t nat -L -n >/dev/null 2>&1 && echo HOST_NAT_OK || echo HOST_NAT_FAIL
          pip install -q mitmproxy 2>&1 | tail -1
          (timeout 8 mitmdump -p 8899 --set quiet=true >/dev/null 2>&1 &); sleep 10
          ls ~/.mitmproxy/ | head -4
          CA=$HOME/.mitmproxy/mitmproxy-ca-cert.pem
          HASH=$(openssl x509 -inform PEM -subject_hash_old -in $CA | head -1)
          echo CAHASH=$HASH
          timeout 30 adb -s $B push $CA /data/local/tmp/cacert.pem >/dev/null 2>&1
          timeout 30 adb -s $B shell "mount -o rw,remount / 2>/dev/null; mount -o rw,remount /system 2>/dev/null; cp /data/local/tmp/cacert.pem /system/etc/security/cacerts/$HASH.0; chmod 644 /system/etc/security/cacerts/$HASH.0"
          timeout 20 adb -s $B shell "ls /system/etc/security/cacerts/$HASH.0"
          timeout 20 adb -s $B shell "cp /data/local/tmp/cacert.pem /apex/com.android.conscrypt/cacerts/$HASH.0 2>/dev/null && chmod 644 /apex/com.android.conscrypt/cacerts/$HASH.0 && echo APEX_OK || echo APEX_FAIL"
          GW=$(timeout 8 adb -s $B shell "ip route | awk '/^172\./{print \$9; exit}'" | tr -d '\r')
          echo GW=$GW
          # v205 实证: 流量过了宿主 PREROUTING(策略计数253包) 但 -i veth+ 规则 0 匹配 → 改用源网段
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null 2>&1
          ip -br link | head -12
          sudo iptables -t nat -A PREROUTING -s 172.17.0.0/16 -p tcp --dport 80  -j DNAT --to-destination 172.17.0.1:8899
          sudo iptables -t nat -A PREROUTING -s 172.17.0.0/16 -p tcp --dport 443 -j DNAT --to-destination 172.17.0.1:8899
          sudo iptables -t nat -L PREROUTING -n -v | head -8
          sudo apt-get install -y -qq tcpdump >/dev/null 2>&1
          ( sudo nohup tcpdump -ni docker0 -w /tmp/d0.pcap >/tmp/tcpdump.log 2>&1 & )
          sudo iptables -A FORWARD -s 172.17.0.0/16 -p udp --dport 443 -j DROP
          timeout 10 adb -s $B shell "ping -c 2 -W 2 bravev6.if.qidian.com" | head -3
          nohup mitmdump -p 8899 --set block_global=false -w /tmp/qd.flow --quiet >/tmp/mitm.log 2>&1 &
          sleep 3
          pgrep -a mitmdump | head -2
          # v206 管路探针: 容器手发一条 TCP, 看 DNAT 计数是否动(把"规则没匹配"和"App没发请求"分开)
          timeout 8 adb -s $B shell "toybox nc -w 4 bravev6.if.qidian.com 443 </dev/null >/dev/null; echo NC_DONE"
          sleep 2
          echo ----探针后计数----
          sudo iptables -t nat -L PREROUTING -n -v | head -6
          echo STEP2_DONE

      - name: QQ扫码登录 + 读章驱动
        run: |
          set +e
          B=localhost:5555
          git config user.email ci@local; git config user.name ci
          mkdir -p qr_snap && touch qr_snap/latest.png
          timeout 8 adb -s $B shell logcat -c >/dev/null 2>&1
          ( timeout 300 adb -s $B logcat -v brief > /tmp/lc.txt 2>&1 ) &
          LCAT=$!
          alive(){ timeout 8 adb -s $B shell pidof com.qidian.QDReader | tr -d '\r'; }
          dump(){ timeout 15 adb -s $B shell "uiautomator dump /sdcard/q.xml >/dev/null 2>&1"; timeout 20 adb -s $B shell "cat /sdcard/q.xml" 2>/dev/null | tr -d '\r' > /tmp/q.xml; wc -c < /tmp/q.xml; }
          tapx(){ timeout 10 adb -s $B shell "input tap $1 $2"; }
          timeout 10 adb -s $B shell "am start -n com.qidian.QDReader/.ui.activity.SplashActivity" >/dev/null 2>&1
          # v205: 判据放宽 —— sz>3000 即算有页面(登录页也行, App 无 frida 不会自杀)
          for k in $(seq 1 10); do
            sleep 6
            SZ=$(dump)
            XY=$(grep -oE 'text="GOT IT"[^>]*bounds="\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]"' /tmp/q.xml | head -1 | grep -oE '\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]' | tr -d '[]' | awk -F, '{print int(($1+$3)/2), int(($2+$4)/2)}')
            [ -n "$XY" ] && { echo "k$k 点GOTIT"; tapx $XY; }
            XY2=$(grep -oE 'text="(跳过|以后再说|暂不|我知道了|开始使用|同意并继续)"[^>]*bounds="\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]"' /tmp/q.xml | head -1 | grep -oE '\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]' | tr -d '[]' | awk -F, '{print int(($1+$3)/2), int(($2+$4)/2)}')
            [ -n "$XY2" ] && { echo "k$k 点引导"; tapx $XY2; }
            grep -q "QQ登录" /tmp/q.xml && { echo "k$k 在登录页→BACK退主界面"; timeout 8 adb -s $B shell "input keyevent KEYCODE_BACK"; sleep 5; }
            if [ "$SZ" -gt 3000 ] && ! grep -q splash_layout /tmp/q.xml; then echo "PAGE_OK k$k sz=$SZ"; break; fi
            A=$(alive); [ -z "$A" ] && { echo "k$k APP死"; break; }
          done
          echo "驱动前 alive=$(alive)"
          # ★ 登录: 若停在登录页, 勾协议 → 点QQ登录 → 抓授权页二维码 → push 给手机 QQ 扫
          timeout 20 adb -s $B shell "cat /sdcard/q.xml" 2>/dev/null | tr -d '\r' > /tmp/q.xml; grep -q "QQ登录" /tmp/q.xml && {
            echo "登录页: 勾选协议"
            XY=$(grep -oE 'content-desc="[^"]*同意[^"]*"|(我已阅读并同意)[^>]*bounds="\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]"' /tmp/q.xml | grep -oE '\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]' | head -1 | tr -d '[]' | awk -F, '{print int(($1+$3)/2), int(($2+$4)/2)}')
            [ -n "$XY" ] && { echo "点协议 $XY"; tapx $XY; sleep 3; }
            XY=$(grep -oE 'text="QQ登录"[^>]*bounds="\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]"' /tmp/q.xml | head -1 | grep -oE '\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]' | tr -d '[]' | awk -F, '{print int(($1+$3)/2), int(($2+$4)/2)}')
            [ -n "$XY" ] && { echo "点QQ登录 $XY"; tapx $XY; sleep 12; }
            # 等 QQ 授权页(二维码); 每秒截屏推仓库, 循环 120s, 直到检测到非登录页(授权确认按钮/回到App)
            for i in $(seq 1 60); do
              timeout 20 adb -s $B shell "screencap -p /sdcard/qr.png" >/dev/null 2>&1
              timeout 20 adb -s $B pull /sdcard/qr.png qr_snap/latest.png >/dev/null 2>&1
              git add -f qr_snap/latest.png 2>/dev/null
              git commit -q -m "qr $i" 2>/dev/null
              git push -q origin HEAD 2>/dev/null
              timeout 15 adb -s $B shell "uiautomator dump /sdcard/g.xml >/dev/null 2>&1"
              timeout 20 adb -s $B shell "cat /sdcard/g.xml" 2>/dev/null | tr -d '\r' > /tmp/g.xml
              grep -q "确认授权\|授权提示\|同意并登录" /tmp/g.xml && { echo "到授权页, 点确认"; XY=$(grep -oE 'text="[^"]*(确认|同意)[^"]*"[^>]*bounds="\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]"' /tmp/g.xml | head -1 | grep -oE '\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]' | tr -d '[]' | awk -F, '{print int(($1+$3)/2), int(($2+$4)/2)}'); [ -n "$XY" ] && tapx $XY; break; }
              alive | grep -q . || break
              sleep 2
            done
            sleep 15
            echo "登录后 alive=$(alive)"
          }
          # A) 主界面上下滑书城 → 触发 getsquarepagepiece/getconf 等(头最全)
          for s in 1 2 3; do
            timeout 10 adb -s $B shell "input swipe 540 1600 540 600" >/dev/null 2>&1; sleep 6
          done
          # B) 点一个书城书籍封面进详情(点得到就赚, 点不到也无妨)
          SZ=$(dump); echo "B sz=$SZ"
          XY=$(grep -oE 'content-desc="[^"]{2,30}"[^>]*clickable="true"[^>]*bounds="\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]"' /tmp/q.xml | grep -vE "书城|发现|书架|我的|签到|登录|搜索" | head -1 | grep -oE '\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]' | tr -d '[]' | awk -F, '{print int(($1+$3)/2), int(($2+$4)/2)}')
          [ -n "$XY" ] && { echo "点书 $XY"; tapx $XY; sleep 12; }
          # C) 详情页点阅读(进阅读页→getkey+safegetcontent)
          SZ=$(dump); echo "C sz=$SZ"
          for i in 1 2 3 4; do
            XY=$(grep -oE 'text="[^"]{0,20}(开始阅读|立即阅读|免费阅读|继续阅读|阅读本书|免费)[^"]{0,20}"[^>]*bounds="\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]"' /tmp/q.xml | head -1 | grep -oE '\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]' | tr -d '[]' | awk -F, '{print int(($1+$3)/2), int(($2+$4)/2)}')
            [ -n "$XY" ] && { echo "点阅读 $XY"; tapx $XY; break; }
            echo "轮$i 无阅读按钮"; sleep 5
          done
          sleep 10
          for sw in 1 2 3; do
            timeout 10 adb -s $B shell "input swipe 900 1170 200 1170" >/dev/null 2>&1
            sleep 8
          done
          echo "末尾 alive=$(alive)"
          sleep 8
          timeout 30 adb -s $B shell "screencap -p /sdcard/fin.png" >/dev/null 2>&1
          timeout 30 adb -s $B pull /sdcard/fin.png /tmp/fin.png >/dev/null 2>&1
          sudo iptables -t nat -L PREROUTING -n -v > /tmp/pkts.txt 2>&1; head -8 /tmp/pkts.txt
          timeout 10 adb -s $B shell "iptables -t nat -L -n -v" >> /tmp/pkts.txt 2>&1
          sudo pkill -f "tcpdump -ni docker0" 2>/dev/null; sleep 2
          sudo tcpdump -nr /tmp/d0.pcap 2>/dev/null | head -400 > /tmp/d0.txt
          wc -l /tmp/d0.txt; grep -c "Syn" /tmp/d0.txt; head -25 /tmp/d0.txt
          kill $LCAT 2>/dev/null
          pkill -f "mitmdump -p 8899" 2>/dev/null; sleep 3
          echo STEP3_DONE

      - name: 导出 qidian 域全部请求
        run: |
          set +e
          ls -la /tmp/qd.flow 2>/dev/null
          python3 /dev/stdin <<'PY'
          import io, sys
          from mitmproxy.io import FlowReader
          from mitmproxy.http import HTTPFlow
          out = open('/tmp/flows_dump.txt','w')
          try:
              data = open('/tmp/qd.flow','rb').read()
              rd = FlowReader(io.BytesIO(data))
              n=0
              for f in rd.stream():
                  if not isinstance(f, HTTPFlow): continue
                  u = f.request.url if f.request else ''
                  if 'qidian.com' not in u and 'yuewen.com' not in u: continue
                  n+=1
                  out.write('='*24+'\n')
                  out.write('URL: %s\nMETHOD: %s\n' % (u, f.request.method))
                  for k,v in f.request.headers.items():
                      out.write('  H %s: %s\n' % (k, v[:400]))
                  try:
                      b = f.request.get_content()
                      out.write('BODY: %s\n' % (b[:1200].decode('utf-8','replace') if b else '(empty)'))
                  except Exception as e:
                      out.write('BODY_ERR %s\n' % e)
                  if f.response:
                      out.write('RESP %s\n' % f.response.status_code)
                      try:
                          rb=f.response.get_content()
                          if rb and rb[:1]==b'{':
                              out.write('RTEXT: %s\n' % rb[:800].decode('utf-8','replace'))
                          elif rb:
                              out.write('RBIN: len=%d head=%s\n' % (len(rb), rb[:24].hex()))
                      except Exception: pass
              out.write('TOTAL_QIDIAN_FLOWS=%d\n' % n)
          except Exception as e:
              out.write('FATAL %s\n' % e)
          out.close()
          print('dump done')
          PY
          echo ----IPTCOUNTERS----; cat /tmp/pkts.txt 2>/dev/null
          echo ----MITMLOG----; tail -5 /tmp/mitm.log 2>/dev/null
          grep -c "^URL:" /tmp/flows_dump.txt 2>/dev/null
          echo "===== 关键端点 ====="
          grep -E "safegetcontent|getkey|bookcontent|chapterlist|getvipcontent" /tmp/flows_dump.txt 2>/dev/null | head -20

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readvip200
          path: |
            /tmp/flows_dump.txt
            /tmp/mitm.log
            /tmp/pkts.txt
            /tmp/lc.txt
            /tmp/fin.png
          if-no-files-found: warn
