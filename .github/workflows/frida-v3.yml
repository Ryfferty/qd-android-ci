name: frida-v2

on:
  workflow_dispatch:

jobs:
  f:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm

      - name: Prepare
        run: |
          mkdir -p apks out
          wget -q "https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/qidian_7.9.200.apk" -O apks/qidian.apk
          wget -q "https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/hook.js" -O hook_v1.js
          wget -q "https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/hook2.js" -O hook.js
          wc -c hook.js
          pip install -q frida-tools 2>&1 | tail -1
          FV=$(frida --version)
          echo "FV=$FV" >> $GITHUB_ENV
          wget -q "https://github.com/frida/frida/releases/download/${FV}/frida-server-${FV}-android-x86_64.xz" -O fs.xz
          unxz -f fs.xz
          chmod +x fs

      - name: Run
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 4096 -cores 4
          disable-animations: true
          script: |
            adb root 2>&1 | head -1 || true
            sleep 5
            adb push fs /data/local/tmp/fs || true
            adb shell chmod 755 /data/local/tmp/fs || true
            adb install -r -t apks/qidian.apk 2>&1 | tail -1 || true
            adb shell "setsid /data/local/tmp/fs -D >/dev/null 2>&1 &" || true
            sleep 10
            adb shell "ps -A | grep fs" || true
            echo "===== 前台跑 frida (150s)，全程打印输出 ====="
            timeout 150 frida -U -f com.qidian.QDReader -l hook.js -q > out/frida_v2.txt 2>&1 &
            sleep 40
            echo "--- 40s 时 frida 输出 ---"
            cat out/frida_v2.txt || true
            echo "--- ps ---"
            adb shell ps -A | grep -i qidian || echo "(no qidian proc)"
            echo "--- activity ---"
            adb shell dumpsys activity activities 2>/dev/null | grep mResumedActivity || true
            adb shell screencap -p /sdcard/h1.png && adb pull /sdcard/h1.png out/h1.png || true
            sleep 35
            echo "--- 75s 时 frida 输出 ---"
            cat out/frida_v2.txt || true
            adb shell ps -A | grep -i qidian || echo "(no qidian proc)"
            adb shell screencap -p /sdcard/h2.png && adb pull /sdcard/h2.png out/h2.png || true
            adb shell uiautomator dump /sdcard/h2.xml >/dev/null 2>&1 || true
            adb pull /sdcard/h2.xml out/h2.xml || true
            adb shell dumpsys activity activities 2>/dev/null | grep mResumedActivity > out/act.txt || true
            echo "===== 最终 ====="
            cat out/frida_v2.txt || true
            ls -la out/ || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frida-v3-out
          path: out/
          retention-days: 3
