name: qd-app-screen

# 截图 + UI dump：App 到底停在什么界面
on:
  workflow_dispatch: {}

jobs:
  screen:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup deps
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq linux-modules-extra-$(uname -r) android-tools-adb curl xz-utils unzip || echo APT_PARTIAL
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>&1 || echo MODPROBE_MAYBE

      - name: Setup redroid
        run: |
          sudo docker rm -f redroid 2>/dev/null || true
          VOLS=""
          for d in binder hwbinder vndbinder; do [ -e /dev/$d ] && VOLS="$VOLS -v /dev/$d:/dev/$d"; done
          sudo docker run -d --privileged --name redroid $VOLS -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.redroid_gpu_mode=guest androidboot.redroid_width=1080 \
            androidboot.redroid_height=2340 androidboot.redroid_dpi=420 \
            androidboot.redroid_adb=5555
          sleep 15
          adb start-server >/dev/null 2>&1 || true
          timeout 30 adb connect localhost:5555 || true
          for i in $(seq 1 45); do
            B=$(timeout 15 adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$B" = "1" ] && { echo "BOOT_OK try $i"; break; }
            sleep 8
          done
          adb -s localhost:5555 root 2>&1 | tail -1
          sleep 8

      - name: Install + launch + screenshot
        run: |
          set +e
          B=localhost:5555
          curl -sSL --max-time 900 -o qd.apk "https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/qidian_7.9.200.apk"
          adb -s $B install -r -d --no-streaming qd.apk 2>&1 | tail -2
          adb -s $B logcat -c
          adb -s $B shell "am start -n com.qidian.QDReader/.ui.activity.SplashActivity" 2>&1 | tail -1
          for t in 20 40 60 90 120 180; do
            sleep 20
            echo "=== T+${t}s ==="
            adb -s $B shell "dumpsys activity activities 2>/dev/null | grep mResumedActivity | head -1"
            adb -s $B shell "pidof com.qidian.QDReader"
            adb -s $B shell "dumpsys window 2>/dev/null | grep -E 'mCurrentFocus' | head -1"
          done
          echo
          echo "########## UI dump（看屏幕上有什么）##########"
          adb -s $B shell "uiautomator dump /sdcard/ui.xml >/dev/null 2>&1; cat /sdcard/ui.xml 2>/dev/null" | head -c 4000
          echo
          echo "########## 截图 ##########"
          adb -s $B shell "screencap -p /sdcard/s.png"
          adb -s $B pull /sdcard/s.png /tmp/s.png 2>&1 | tail -1
          ls -la /tmp/s.png
          mkdir -p results && cp /tmp/s.png results/ 2>/dev/null
          cp /sdcard/ui.xml results/ 2>/dev/null || adb -s $B pull /sdcard/ui.xml results/ui.xml 2>/dev/null
          echo
          echo "########## App 全部日志（非系统标签）##########"
          adb -s $B logcat -d -v brief 2>/dev/null | grep -iE 'qidian|QDReader|ConfigLoader|Net|http|WafCaptcha|login|token' | tail -60
          echo
          echo "########## 网络尝试（App 发起的连接）##########"
          adb -s $B logcat -d -v brief 2>/dev/null | grep -iE 'okhttp|retrofit|Http|Socket|connect|timeout|UnknownHost|SSL' | tail -30
          exit 0

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screen
          path: results/
          if-no-files-found: warn
