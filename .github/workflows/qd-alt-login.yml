name: qd-alt-login
on:
  workflow_dispatch:
    inputs:
      qd_url:
        description: qidian apk url
        default: https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/qidian_7.9.200.apk
        required: false

jobs:
  alt:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - name: Setup binder and adb
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq linux-modules-extra-$(uname -r) adb curl xz-utils || echo APT_FAILED
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>&1 || echo MODPROBE_FAILED
          lsmod | grep -i binder || true

      - name: Start redroid
        run: |
          sudo docker rm -f redroid 2>/dev/null || true
          VOLS=""
          for d in binder hwbinder vndbinder; do if [ -e /dev/$d ]; then VOLS="$VOLS -v /dev/$d:/dev/$d"; fi; done
          sudo docker run -d --privileged --name redroid $VOLS -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.redroid_gpu_mode=guest androidboot.redroid_width=1080 \
            androidboot.redroid_height=2340 androidboot.redroid_dpi=420 \
            androidboot.redroid_adb=5555 || echo DOCKER_FAILED
          sleep 15
          sudo docker ps --format '{{.Names}} {{.Status}}'

      - name: Boot
        run: |
          adb start-server >/dev/null 2>&1 || true
          timeout 30 adb connect localhost:5555 2>&1 || true
          for i in $(seq 1 30); do
            B=$(timeout 15 adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "$B" = "1" ]; then echo "booted try $i"; break; fi
            sleep 8
          done

      - name: Install qidian and reach login page
        run: |
          curl -sSL --max-time 300 -o /tmp/qd.apk "${{ inputs.qd_url }}" || echo DL_FAILED
          timeout 180 adb -s localhost:5555 install -r -t /tmp/qd.apk 2>&1 | tail -2
          timeout 20 adb -s localhost:5555 shell "logcat -c" || true
          timeout 40 adb -s localhost:5555 shell "am start -W -n com.qidian.QDReader/com.qidian.QDReader.ui.activity.SplashActivity" 2>&1 | tail -2
          sleep 20
          timeout 20 adb -s localhost:5555 shell "input tap 539 1605" || true
          sleep 20
          timeout 20 adb -s localhost:5555 shell "input tap 84 2003" || true
          sleep 4
          timeout 30 adb -s localhost:5555 shell uiautomator dump /sdcard/l.xml >/dev/null 2>&1 || true
          timeout 30 adb -s localhost:5555 pull /sdcard/l.xml /tmp/l.xml >/dev/null 2>&1 || true
          echo "--- login page buttons present? ---"
          grep -c -E 'tvWechat|tvQQ|tvLogin' /tmp/l.xml || true

      - name: Test WECHAT login (232,1840)
        run: |
          echo "=== TAP 微信登录 (232,1840) ==="
          timeout 20 adb -s localhost:5555 shell "input tap 232 1840" || true
          for t in 20 45 80; do
            sleep 20
            echo "----- WECHAT T+${t}s -----"
            timeout 20 adb -s localhost:5555 shell "ps -A | grep -i qidian" 2>&1 || echo NO_QIDIAN
            timeout 20 adb -s localhost:5555 shell "dumpsys window 2>/dev/null | grep mCurrentFocus" 2>&1 || true
            timeout 30 adb -s localhost:5555 exec-out screencap -p > /tmp/wechat_${t}s.png 2>/dev/null || true
            timeout 30 adb -s localhost:5555 shell uiautomator dump /sdcard/w${t}.xml >/dev/null 2>&1 || true
            timeout 30 adb -s localhost:5555 pull /sdcard/w${t}.xml /tmp/w${t}.xml >/dev/null 2>&1 || true
          done
          echo "=== wechat related log ==="
          timeout 40 adb -s localhost:5555 shell "logcat -d -v time" 2>/dev/null | grep -i -E "weixin|wechat|mm|wxapi|qrconnect|open.weixin" | tail -40 || true

      - name: Back, then test ACCOUNT login (845,1840)
        run: |
          timeout 20 adb -s localhost:5555 shell "input keyevent 4" || true
          sleep 5
          timeout 20 adb -s localhost:5555 shell "input keyevent 4" || true
          sleep 5
          timeout 20 adb -s localhost:5555 shell "logcat -c" || true
          timeout 40 adb -s localhost:5555 shell "am start -W -n com.qidian.QDReader/com.qidian.QDReader.ui.activity.GuidanceActivity" 2>&1 | tail -2 || true
          sleep 20
          echo "=== TAP 账号密码登录 (845,1840) ==="
          timeout 20 adb -s localhost:5555 shell "input tap 845 1840" || true
          sleep 25
          timeout 20 adb -s localhost:5555 shell "dumpsys window 2>/dev/null | grep mCurrentFocus" 2>&1 || true
          timeout 30 adb -s localhost:5555 exec-out screencap -p > /tmp/acct.png 2>/dev/null || true
          timeout 30 adb -s localhost:5555 shell uiautomator dump /sdcard/acct.xml >/dev/null 2>&1 || true
          timeout 30 adb -s localhost:5555 pull /sdcard/acct.xml /tmp/acct.xml >/dev/null 2>&1 || true
          echo "=== focus/activity ==="
          timeout 20 adb -s localhost:5555 shell "dumpsys activity activities 2>/dev/null | grep -E 'ResumedActivity'" 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alt-login-evidence
          path: |
            /tmp/wechat_*.png
            /tmp/acct.png
            /tmp/w*.xml
            /tmp/acct.xml
            /tmp/l.xml
          if-no-files-found: warn
