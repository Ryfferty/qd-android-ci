name: qd-collect-pairs
on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup + collect I/O pairs
        run: |
          set +e
          sudo -S -p '' apt-get update -qq || true
          sudo -S -p '' apt-get install -y -qq linux-modules-extra-$(uname -r) android-tools-adb curl xz-utils unzip python3-pip || echo APT
          sudo -S -p '' modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>&1 || echo MODPROBE
          pip install -q "frida==16.7.19" "frida-tools" 2>&1 | tail -1
          
          sudo -S -p '' docker rm -f redroid 2>/dev/null || true
          VOLS=""
          for d in binder hwbinder vndbinder; do [ -e /dev/$d ] && VOLS="$VOLS -v /dev/$d:/dev/$d"; done
          sudo -S -p '' docker run -d --privileged --name redroid $VOLS -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.redroid_width=720 androidboot.redroid_height=1184 \
            androidboot.redroid_dpi=240 androidboot.redroid_gpu_mode=guest
          
          adb start-server >/dev/null 2>&1; sleep 5
          for i in $(seq 1 30); do
            adb connect localhost:5555 >/dev/null 2>&1
            S=$(timeout 8 adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$S" = "1" ] && break
            sleep 6
          done
          echo "BOOT_OK"
          
          FR=16.7.19
          curl -sSL --max-time 180 -o fs.xz "https://github.com/frida/frida/releases/download/${FR}/frida-server-${FR}-android-arm64.xz"
          unxz -f fs.xz; mv -f fs fs-server; chmod +x fs-server
          timeout 30 adb -s localhost:5555 root 2>&1 | head -1
          sleep 6
          adb -s localhost:5555 shell "setenforce 0" 2>&1 | head -1
          adb -s localhost:5555 push fs-server /data/local/tmp/fs-srv >/dev/null 2>&1
          adb -s localhost:5555 shell "chmod 755 /data/local/tmp/fs-srv"
          
          curl -sSL --max-time 300 -o q464.apk "https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/qidian_7.9.464.apk"
          timeout 120 adb -s localhost:5555 push q464.apk /data/local/tmp/q464.apk >/dev/null 2>&1
          timeout 120 adb -s localhost:5555 shell "pm install -r -d -t --user 0 /data/local/tmp/q464.apk" 2>&1 | tail -1
          timeout 30 adb -s localhost:5555 shell "am start -n com.qidian.QDReader/.ui.activity.SplashActivity" >/dev/null 2>&1
          
          STABLE_PID=""
          for i in $(seq 1 15); do
            sleep 3
            P=$(timeout 10 adb -s localhost:5555 shell pidof com.qidian.QDReader | tr -d '\r')
            if [ -n "$P" ]; then
              sleep 5
              P2=$(timeout 10 adb -s localhost:5555 shell pidof com.qidian.QDReader | tr -d '\r')
              if [ "$P" = "$P2" ] && [ -n "$P2" ]; then
                STABLE_PID=$P
                echo "App PID=$STABLE_PID"
                break
              fi
            fi
          done
          [ -z "$STABLE_PID" ] && { echo "NO_APP"; exit 0; }
          
          timeout 10 adb -s localhost:5555 shell "setsid /data/local/tmp/fs-srv -D >/dev/null 2>&1 &"
          sleep 8
          timeout 10 adb -s localhost:5555 forward tcp:27042 tcp:27042
          
          # ★ 大量收集I/O对!
          cat > collect_pairs.js << 'JSEOF'
          Java.perform(function() {
              setTimeout(function() {
                  try {
                      var FockUtil = Java.use("com.qidian.QDReader.component.util.FockUtil");
                      var instance = FockUtil.INSTANCE.value;
                      var RequestBody = Java.use("okhttp3.RequestBody");
                      var MediaType = Java.use("okhttp3.MediaType");
                      var mediaType = MediaType.parse("application/x-www-form-urlencoded");
                      
                      // 测试1: 同一URL多次调用(看时间依赖)!
                      var url1 = "https://bravev6.if.qidian.com/argus/api/v1/client/getconf";
                      console.log("=== 同URL多次调用 ===");
                      for (var i = 0; i < 5; i++) {
                          var body = RequestBody.create(mediaType, "localLabels=&gender=0");
                          var result = instance.getH(url1, "POST", body);
                          var rm = Java.cast(result, Java.use("java.util.Map"));
                          var iter = rm.entrySet().iterator();
                          var ts = "", borgus = "", qdinfo = "";
                          while (iter.hasNext()) {
                              var en = Java.cast(iter.next(), Java.use("java.util.Map$Entry"));
                              var k = String(en.getKey());
                              var v = String(en.getValue());
                              if (k === "tstamp") ts = v;
                              if (k === "borgus") borgus = v;
                              if (k === "QDInfo" && v.length > 20) qdinfo = v;
                          }
                          console.log("[PAIR] url=" + url1 + " ts=" + ts + " borgus=" + borgus);
                          
                      }
                      
                      // 测试2: 不同URL(看URL依赖)!
                      console.log("=== 不同URL ===");
                      var urls = [
                          "https://bravev6.if.qidian.com/argus/api/v1/client/getconf",
                          "https://bravev6.if.qidian.com/argus/api/v1/freshman/limitfreepopup",
                          "https://bravev6.if.qidian.com/argus/api/v3/freshman/autoreceive",
                          "https://bravev6.if.qidian.com/argus/api/v2/bookcontent/safegetcontent",
                          "https://bravev6.if.qidian.com/argus/api/v1/user/getuserinfo",
                          "https://fockrt.yuewen.com/files",
                          "https://ptlogin.yuewen.com/sdk/qrcode",
                          "https://bravev6.if.qidian.com/argus/api/v1/bookchapterlist/chapterlist",
                          "https://bravev6.if.qidian.com/argus/api/v1/client/getconf?localLabels=&gender=0",
                          "https://a.b.c.d/test1",
                          "https://a.b.c.d/test2",
                          "https://a.b.c.d/test3"
                      ];
                      var methods = ["POST","GET","POST","GET","GET","GET","POST","GET","POST","GET","GET","GET"];
                      for (var i = 0; i < urls.length; i++) {
                          var body = RequestBody.create(mediaType, "");
                          var result = instance.getH(urls[i], methods[i], body);
                          var rm = Java.cast(result, Java.use("java.util.Map"));
                          var iter = rm.entrySet().iterator();
                          var ts = "", borgus = "", qdinfo = "";
                          while (iter.hasNext()) {
                              var en = Java.cast(iter.next(), Java.use("java.util.Map$Entry"));
                              var k = String(en.getKey());
                              var v = String(en.getValue());
                              if (k === "tstamp") ts = v;
                              if (k === "borgus") borgus = v;
                              if (k === "QDInfo" && v.length > 20) qdinfo = v;
                          }
                          console.log("[PAIR] url=" + urls[i] + " method=" + methods[i] + " ts=" + ts + " borgus=" + borgus);
                      }
                      
                      // 测试3: 同URL同时间连续调用(看确定性)!
                      console.log("=== 连续快速调用(确定性测试) ===");
                      var url3 = "https://test.example.com/same";
                      for (var i = 0; i < 3; i++) {
                          var body = RequestBody.create(mediaType, "");
                          var result = instance.getH(url3, "GET", body);
                          var rm = Java.cast(result, Java.use("java.util.Map"));
                          var iter = rm.entrySet().iterator();
                          var ts = "", borgus = "";
                          while (iter.hasNext()) {
                              var en = Java.cast(iter.next(), Java.use("java.util.Map$Entry"));
                              var k = String(en.getKey());
                              var v = String(en.getValue());
                              if (k === "tstamp") ts = v;
                              if (k === "borgus") borgus = v;
                          }
                          console.log("[PAIR] rapid#" + i + " ts=" + ts + " borgus=" + borgus);
                      }
                      
                      // 测试4: 输出完整QDInfo(一次)!
                      console.log("=== 完整头(一次) ===");
                      var body = RequestBody.create(mediaType, "localLabels=&gender=0");
                      var result = instance.getH(url1, "POST", body);
                      var rm = Java.cast(result, Java.use("java.util.Map"));
                      var iter = rm.entrySet().iterator();
                      while (iter.hasNext()) {
                          var en = Java.cast(iter.next(), Java.use("java.util.Map$Entry"));
                          console.log("[FULL] " + en.getKey() + " = " + String(en.getValue()));
                      }
                      
                      // ★ Dump模块地址(供bash dump)!
                      var modules = Process.enumerateModules();
                      for (var mi = 0; mi < modules.length; mi++) {
                          var mod = modules[mi];
                          if (mod.name.indexOf("fock") !== -1 || mod.name.indexOf("jiagu") !== -1 || mod.name.indexOf("knobs") !== -1) {
                              console.log("[MOD] " + mod.name + " " + mod.base + " " + mod.size);
                          }
                      }
                      
                  } catch(e) {
                      console.log("[ERROR] " + e);
                  }
              }, 3000);
          });
          JSEOF
          
          # ★ Simpleperf trace (VMP挡不住的原生工具)!
          timeout 10 adb -s localhost:5555 shell "which simpleperf || ls /system/bin/simpleperf" 2>&1
          
          timeout 60 frida -H 127.0.0.1:27042 -p $STABLE_PID -l collect_pairs.js 2>&1 | tee /tmp/pairs_output.log
          
          echo "=== Stalker Trace ==="
          cat > trace_geth.js << 'TRACEEOF'
          Java.perform(function() {
              setTimeout(function() {
                  try {
                      var FockUtil = Java.use("com.qidian.QDReader.component.util.FockUtil");
                      var instance = FockUtil.INSTANCE.value;
                      var RequestBody = Java.use("okhttp3.RequestBody");
                      var MediaType = Java.use("okhttp3.MediaType");
                      var mediaType = MediaType.parse("application/x-www-form-urlencoded");
                      
                      // 找libfock的范围!
                      var fockModule = Process.findModuleByName("libjiagu_vip.so") || Process.findModuleByName("libjiagu.so");
                      if (fockModule) {
                          console.log("[FOCK] base=" + fockModule.base + " size=" + fockModule.size);
                          
                          // ★ Stalker: 追踪fock模块内的执行!
                          var tid = Process.getCurrentThreadId();
                          Stalker.follow(tid, {
                              events: {
                                  call: false,
                                  ret: false,
                                  exec: true,
                                  block: false
                              },
                              transform: function(iterator) {
                                  var instruction = iterator.next();
                                  while (instruction !== null) {
                                      // 只记录fock模块内的指令!
                                      if (instruction.address >= fockModule.base && 
                                          instruction.address < fockModule.base.add(fockModule.size)) {
                                          iterator.keep();
                                      } else {
                                          // 跳过非fock代码!
                                          // 但还是keep让它执行!
                                          iterator.keep();
                                      }
                                      instruction = iterator.next();
                                  }
                              },
                              onReceive: function(events) {
                                  // 处理事件!
                              }
                          });
                          
                          // 调用getH!
                          console.log("[*] Calling getH with Stalker active...");
                          var url = "https://bravev6.if.qidian.com/argus/api/v1/client/getconf";
                          var body = RequestBody.create(mediaType, "localLabels=&gender=0");
                                                                                                                                        // ★ 内存扫描找borgus + MemoryAccessMonitor!
                      // 第一次调用getH获取borgus!
                      var url = "https://bravev6.if.qidian.com/argus/api/v1/client/getconf";
                      var body = RequestBody.create(mediaType, "localLabels=&gender=0");
                      var result1 = instance.getH(url, "POST", body);
                      var rm1 = Java.cast(result1, Java.use("java.util.Map"));
                      var iter1 = rm1.entrySet().iterator();
                      var borgus1 = "";
                      while (iter1.hasNext()) {
                          var en1 = Java.cast(iter1.next(), Java.use("java.util.Map$Entry"));
                          if (String(en1.getKey()) === "borgus") {
                              borgus1 = String(en1.getValue());
                          }
                      }
                      console.log("[BOROUS1] " + borgus1);
                      
                      // ★ 在内存中搜索borgus值!
                      var foundAddrs = [];
                      
                      // 搜索模式1: 二进制字节 (da 01 77 0e...)
                      var binPattern = borgus1;
                      
                      // 搜索模式2: UTF-16LE (Java String)
                      var utf16 = "";
                      for (var ci = 0; ci < borgus1.length; ci++) {
                          utf16 += borgus1.charCodeAt(ci).toString(16).padStart(2, '0') + "00";
                      }
                      
                      // 搜索模式3: 前半段 (只有前16个hex字符)
                      var halfPattern = borgus1.substring(0, 16);
                      
                      var patterns = [
                          {name: "binary", pattern: binPattern},
                          {name: "utf16", pattern: utf16},
                          {name: "half", pattern: halfPattern}
                      ];
                      
                      var ranges = Process.enumerateRanges('r--');
                      console.log("[SCAN] " + ranges.length + " readable ranges, searching 3 patterns...");
                      
                      for (var pi = 0; pi < patterns.length; pi++) {
                          var pat = patterns[pi];
                          console.log("[SCAN] pattern: " + pat.name + " = " + pat.pattern.substring(0, 30));
                          for (var ri = 0; ri < ranges.length; ri++) {
                              var r = ranges[ri];
                              if (r.size > 100 * 1024 * 1024) continue;
                              try {
                                  var results = Memory.scanSync(r.base, r.size, pat.pattern);
                                  for (var rj = 0; rj < results.length; rj++) {
                                      var mod = null;
                                      try { mod = Process.getModuleByAddress(results[rj].address); } catch(e) {}
                                      foundAddrs.push({
                                          addr: results[rj].address,
                                          module: mod ? mod.name : 'anon',
                                          pattern: pat.name
                                      });
                                  }
                              } catch(e) {}
                          }
                      }
                      console.log("[FOUND] " + foundAddrs.length + " locations");
                      for (var fi = 0; fi < Math.min(foundAddrs.length, 20); fi++) {
                          console.log("[LOC] " + foundAddrs[fi].addr + " in " + foundAddrs[fi].module + " (" + foundAddrs[fi].pattern + ")");
                      }
                      
                                                                                        // ★ Hook HashMap.put — 抓borgus入Map的调用栈!
                      var HashMap = Java.use("java.util.HashMap");
                      HashMap.put.implementation = function(key, value) {
                          var k = key ? key.toString() : "";
                          if (k === "borgus") {
                              console.log("[★★★PUT] borgus = " + value);
                              // Java栈!
                              try {
                                  var stack = Java.use("java.lang.Thread").currentThread().getStackTrace();
                                  for (var si = 0; si < Math.min(stack.length, 30); si++) {
                                      console.log("[★S] " + stack[si].toString());
                                  }
                              } catch(e) {}
                              // ★ Native栈!
                              try {
                                  var nbt = Thread.backtrace(this.context, Backtracer.FUZZY);
                                  // 过滤掉Frida agent地址!
                                  var fridaBase = Module.findBaseAddress("frida-agent-64.so");
                                  var filtered = [];
                                  for (var fbi = 0; fbi < nbt.length; fbi++) {
                                      var fa = nbt[fbi];
                                      var isFrida = false;
                                      if (fridaBase) {
                                          var fridaEnd = fridaBase.add(Module.findModuleByName("frida-agent-64.so").size);
                                          if (fa >= fridaBase && fa < fridaEnd) isFrida = true;
                                      }
                                      if (!isFrida) filtered.push(fa);
                                  }
                                  nbt = filtered;
                                  console.log("[★NBT] " + nbt.length + " frames (after filtering Frida)");
                                  for (var ni = 0; ni < Math.min(nbt.length, 30); ni++) {
                                      var nmod = null;
                                      try { nmod = Process.getModuleByAddress(nbt[ni]); } catch(e) {}
                                      if (nmod) {
                                          console.log("[★N] " + ni + ": " + nmod.name + "+" + nbt[ni].sub(nmod.base).toString(16));
                                      } else {
                                          console.log("[★N] " + ni + ": " + nbt[ni] + " (anon)");
                                      }
                                  }
                              } catch(e) {
                                  console.log("[NBT_ERR] " + e);
                              }
                              // ★ Dump匿名内存区域!
                              try {
                                  // 找backtrace第一个地址所在的内存范围!
                                  var targetAddr = nbt[0];
                                  var ranges = Process.enumerateRanges('r-x');
                                  var targetRange = null;
                                  for (var tri = 0; tri < ranges.length; tri++) {
                                      var tr = ranges[tri];
                                      if (targetAddr >= tr.base && targetAddr < tr.base.add(tr.size)) {
                                          targetRange = tr;
                                          console.log("[RANGE] Found: " + tr.base + " size=" + tr.size + " prot=" + (tr.protection || 'r-x'));
                                          break;
                                      }
                                  }
                                  if (!targetRange) {
                                      // 也试r--和rw-!
                                      var allRanges = Process.enumerateRanges('r--');
                                      for (var ari = 0; ari < allRanges.length; ari++) {
                                          var ar = allRanges[ari];
                                          if (targetAddr >= ar.base && targetAddr < ar.base.add(ar.size)) {
                                              targetRange = ar;
                                              console.log("[RANGE] Found r--: " + ar.base + " size=" + ar.size);
                                              break;
                                          }
                                      }
                                  }
                                  if (targetRange) {
                                      // Dump这个区域(最大10MB)!
                                      var dumpSize = Math.min(targetRange.size, 10 * 1024 * 1024);
                                      console.log("[DUMP] Reading " + dumpSize + " bytes from " + targetRange.base);
                                      try {
                                          var dumpData = Memory.readByteArray(targetRange.base, dumpSize);
                                          var dumpFile = new File("/data/local/tmp/vmp_code.bin", "wb");
                                          dumpFile.write(dumpData);
                                          dumpFile.close();
                                          console.log("[DUMP] Saved to /data/local/tmp/vmp_code.bin");
                                      } catch(de) {
                                          console.log("[DUMP_ERR] " + de);
                                          // 试小块!
                                          try {
                                              var smallDump = Memory.readByteArray(targetAddr, 4096);
                                              var sf = new File("/data/local/tmp/vmp_small.bin", "wb");
                                              sf.write(smallDump);
                                              sf.close();
                                              console.log("[DUMP] Small dump saved (4KB at " + targetAddr + ")");
                                          } catch(se) {
                                              console.log("[DUMP_ERR2] " + se);
                                          }
                                      }
                                  } else {
                                      console.log("[RANGE] Not found in any range!");
                                  }
                              } catch(e) {
                                  console.log("[RANGE_ERR] " + e);
                              }
                          }
                          return this.put(key, value);
                      };
                      console.log("[+] HashMap.put hooked!");
                      
                      // 调用getH!
                      var body2 = RequestBody.create(mediaType, "localLabels=&gender=0");
                      var result2 = instance.getH(url, "POST", body2);
                      console.log("[*] getH done");
                      var rm = Java.cast(result, Java.use("java.util.Map"));
                          var iter = rm.entrySet().iterator();
                          while (iter.hasNext()) {
                              var en = Java.cast(iter.next(), Java.use("java.util.Map$Entry"));
                              console.log("[RESULT] " + en.getKey() + " = " + String(en.getValue()).substring(0, 80));
                          }
                      } else {
                          console.log("[ERR] libfock not found!");
                      }
                  } catch(e) {
                      console.log("[ERROR] " + e);
                  }
              }, 3000);
          });
          TRACEEOF
          
          timeout 120 frida -H 127.0.0.1:27042 -p $STABLE_PID -l trace_geth.js 2>&1 | tee -a /tmp/pairs_output.log
          
          mkdir -p /tmp/vmp_dumps
          ls -la /tmp/vmp_dumps/
          echo "=== DONE ==="

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: io-pairs-data
          path: |
            /tmp/pairs_output.log
            /tmp/vmp_dumps/
            /tmp/vmp_code.bin
            /tmp/vmp_small.bin
          if-no-files-found: warn
