name: android-boot

on:
  workflow_dispatch:

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          ls -la /dev/kvm

      - name: Setup Android SDK
        run: |
          set -e
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O ct.zip
          unzip -q ct.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "$HOME/android-sdk/emulator" >> $GITHUB_PATH

      - name: Install packages
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "emulator" \
            "system-images;android-30;google_apis;x86_64" 2>&1 | tail -3
          echo "=== emulator/lib64 里找 ARM 翻译库 ==="
          ls $ANDROID_SDK_ROOT/emulator/lib64/ | grep -iE 'ndk|houdini|nb\.so' || echo "(emulator lib64 里没有 ndk/houdini)"
          find $ANDROID_SDK_ROOT -maxdepth 4 -iname '*ndk*' -o -maxdepth 4 -iname '*houdini*' 2>/dev/null | head -10 || true

      - name: Create AVD and boot
        run: |
          set +e
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator
          echo no | avdmanager create avd -n a30 -k "system-images;android-30;google_apis;x86_64" --force
          echo "=== AVD list ==="; emulator -list-avds
          adb start-server
          nohup emulator -avd a30 -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -accel on -memory 4096 -cores 4 \
            > /tmp/emu.log 2>&1 &
          echo "launched pid=$!"
          echo "--- waiting for device (max 240s) ---"
          timeout 240 adb wait-for-device && echo "DEVICE_CONNECTED" || echo "WAIT_DEVICE_TIMEOUT"
          echo "--- waiting boot_completed (max 420s) ---"
          for i in $(seq 1 42); do
            B=$(timeout 15 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "  [${i}] boot_completed=$B"
            if [ "$B" = "1" ]; then echo "BOOT_OK"; break; fi
            sleep 10
          done
          echo "=== INFO ==="
          adb devices -l
          adb shell getprop ro.build.version.release
          adb shell getprop ro.build.version.sdk
          adb shell getprop ro.product.cpu.abilist
          adb shell getprop ro.dalvik.vm.native.bridge
          echo "=== emulator log (tail) ==="
          tail -25 /tmp/emu.log

      - name: Collect artifacts
        if: always()
        run: |
          export PATH=$PATH:$HOME/android-sdk/platform-tools
          mkdir -p out
          adb devices -l > out/devices.txt 2>&1
          adb shell getprop > out/props.txt 2>&1 || true
          adb shell pm list packages > out/packages.txt 2>&1 || true
          adb shell screencap -p /sdcard/s.png 2>/dev/null && adb pull /sdcard/s.png out/screen.png 2>/dev/null
          cp /tmp/emu.log out/emu.log 2>/dev/null || true
          ls -la out/

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-out
          path: out/
          retention-days: 3
