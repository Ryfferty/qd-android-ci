name: qd-ghidra
on:
  workflow_dispatch:
    inputs:
      addrs:
        description: '要反编译的函数地址（逗号分隔）'
        default: ''
      names:
        description: '要反编译的函数符号名（逗号分隔）'
        default: 'fock_sn'

jobs:
  t:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK + 下载 Ghidra
        run: |
          set +e
          sudo -S -p '' apt-get update -qq || true
          sudo -S -p '' apt-get install -y -qq openjdk-17-jre-headless unzip curl python3-pip || echo APT_PARTIAL
          java -version 2>&1 | head -2
          GH_URL=$(curl -sL "https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest" | python3 gh_url.py)
          echo "Ghidra: $GH_URL"
          curl -sSL --max-time 900 -o ghidra.zip "$GH_URL"
          ls -la ghidra.zip
          unzip -q ghidra.zip -d /opt/ 2>&1 | tail -2
          ls -d /opt/ghidra_* | head -2
          exit 0

      - name: 从 464 APK 抽 libfock.so
        run: |
          set +e
          curl -sSL --max-time 900 -o q464.apk "https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/qidian_7.9.464.apk"
          ls -la q464.apk
          python3 extract_fock.py
          ls -la libfock.so
          exit 0

      - name: Ghidra headless 反编译
        run: |
          set +e
          GH=$(ls -d /opt/ghidra_* | head -1)
          echo "GH=$GH"
          export TARGET_ADDRS="${{ inputs.addrs }}"
          export TARGET_NAMES="${{ inputs.names }}"
          echo "TARGET_ADDRS=$TARGET_ADDRS NAMES=$TARGET_NAMES"
          timeout 2400 "$GH/support/analyzeHeadless" /tmp ghidraproj \
            -import libfock.so -scriptPath "$PWD/ghidra_scripts" -postScript DecompFock.java \
            -deleteProject > /tmp/decomp_out.txt 2>&1
          echo "=== 行数: $(wc -l < /tmp/decomp_out.txt) ==="
          grep -nE '^###|^=====|undefined|void |int |char |long |memcpy|malloc' /tmp/decomp_out.txt | head -60
          exit 0

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decomp
          path: |
            /tmp/decomp_out.txt
            libfock.so
          if-no-files-found: warn
