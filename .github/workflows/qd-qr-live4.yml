name: qd-qr-live

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: qidian apk
        default: https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/qidian_7.9.200.apk
        required: false
      hook_url:
        description: frida hook（★ 用 hook_ssl.js：纯原生透明旁听，不替换 Java 实现）
        default: https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/hook_ssl2.js
        required: false

jobs:
  cap:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Setup binder + adb + frida-tools
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq linux-modules-extra-$(uname -r) adb curl xz-utils unzip || echo APT_FAILED
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>&1 || echo MODPROBE_FAILED
          # ★ frida 17 移除了内置 Java bridge（脚本里 Java 会 ReferenceError），必须锁 16.x
          pip install -q "frida==16.7.19" "frida-tools<14" 2>&1 | tail -2
          FV=$(frida --version)
          echo "FV=$FV" >> $GITHUB_ENV
          echo "frida version = $FV"

      - name: Start redroid (arm64 Android 11)
        run: |
          sudo docker rm -f redroid 2>/dev/null || true
          VOLS=""
          for d in binder hwbinder vndbinder; do if [ -e /dev/$d ]; then VOLS="$VOLS -v /dev/$d:/dev/$d"; fi; done
          sudo docker run -d --privileged --name redroid $VOLS -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.redroid_gpu_mode=guest androidboot.redroid_width=1080 \
            androidboot.redroid_height=2340 androidboot.redroid_dpi=420 \
            androidboot.redroid_adb=5555 || echo DOCKER_FAILED
          sleep 15

      - name: Boot + verify arm64
        run: |
          set +e
          adb start-server >/dev/null 2>&1
          timeout 30 adb connect localhost:5555
          for i in $(seq 1 30); do
            B=$(timeout 15 adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$B" = "1" ]; then echo "BOOT_OK try $i"; break; fi
            sleep 8
          done
          adb -s localhost:5555 shell getprop ro.product.cpu.abi
          adb -s localhost:5555 shell getprop ro.build.version.release

      - name: ★ Guest 网络连通性检查（App 发不出请求的最可能原因）
        run: |
          set +e
          echo "=== 宿主侧 ==="
          curl -sS -o /dev/null -m 12 -w "host->qidian %{http_code} %{time_total}s\n" https://bravev6.if.qidian.com/ || echo HOST_FAIL
          echo "=== guest DNS 配置 ==="
          adb -s localhost:5555 shell "getprop | grep -i dns" | tr -d '\r'
          echo "=== guest ping 网关/公网 ==="
          adb -s localhost:5555 shell "ping -c 2 -W 3 8.8.8.8 2>&1 | tail -3" | tr -d '\r'
          echo "=== guest 解析域名 ==="
          adb -s localhost:5555 shell "ping -c 2 -W 3 bravev6.if.qidian.com 2>&1 | tail -3" | tr -d '\r'
          echo "=== guest TCP 连 443 ==="
          for hp in "bravev6.if.qidian.com 443" "ptlogin.yuewen.com 443" "openmobile.qq.com 443"; do
            set -- $hp
            adb -s localhost:5555 shell "toybox nc -w 5 $1 $2 < /dev/null; echo rc=\$? for $1:$2" 2>&1 | tr -d '\r'
          done
          echo "=== guest 代理设置 ==="
          adb -s localhost:5555 shell "settings get global http_proxy" | tr -d '\r'

      - name: Download APK + hook + frida-server(arm64)
        run: |
          # ★ 带重试 + 校验，避免偶发下载失败把整轮跑废
          for i in 1 2 3 4; do
            curl -sSL --max-time 900 -o /tmp/qd.apk "${{ inputs.apk_url }}" || true
            SZ=$(stat -c%s /tmp/qd.apk 2>/dev/null || echo 0)
            echo "apk try $i size=$SZ"
            [ "$SZ" -gt 10000000 ] && break
            sleep 15
          done
          ls -l /tmp/qd.apk
          for i in 1 2 3 4; do
            curl -sSL --max-time 120 -o /tmp/hook_net.js "${{ inputs.hook_url }}" || true
            curl -sSL --max-time 60 -o /tmp/frida_drive.py "https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/frida_drive.py" || true
            echo "frida_drive.py: $(stat -c%s /tmp/frida_drive.py 2>/dev/null) 字节"
            SZ=$(stat -c%s /tmp/hook_net.js 2>/dev/null || echo 0)
            echo "hook try $i size=$SZ"
            [ "$SZ" -gt 2000 ] && break
            sleep 10
          done
          for i in 1 2 3 4; do
            curl -sSL --max-time 600 -o /tmp/fs.xz \
              "https://github.com/frida/frida/releases/download/${FV}/frida-server-${FV}-android-arm64.xz" || true
            if xz -t /tmp/fs.xz 2>/dev/null; then echo "frida-server xz ok (try $i)"; break; fi
            echo "frida-server try $i 无效，重试"
            sleep 15
          done
          unxz -f /tmp/fs.xz && chmod +x /tmp/fs && ls -l /tmp/fs
          echo "=== 全部下载校验 ==="
          ls -l /tmp/qd.apk /tmp/hook_net.js /tmp/fs

      - name: Install Qidian + start frida-server
        run: |
          set +e
          timeout 600 adb -s localhost:5555 install -r -t /tmp/qd.apk 2>&1 | tail -3
          adb -s localhost:5555 shell pm list packages | grep qidian
          # ★ 关键：frida-server 必须以 root 跑，否则无法 attach app 进程（shell uid 2000 无权限）
          echo "===== adb root ====="
          adb -s localhost:5555 root 2>&1 | tail -2
          sleep 6
          adb -s localhost:5555 wait-for-device 2>/dev/null || true
          timeout 20 adb -s localhost:5555 shell id 2>&1 | head -2
          adb -s localhost:5555 push /tmp/fs /data/local/tmp/fs
          adb -s localhost:5555 push /tmp/hook_net.js /data/local/tmp/hook_net.js
          adb -s localhost:5555 shell chmod 755 /data/local/tmp/fs
          adb -s localhost:5555 shell "setsid /data/local/tmp/fs -D >/dev/null 2>&1 &"
          sleep 12
          adb -s localhost:5555 shell "ps -A -o USER,UID,PID,NAME | grep -w fs" || echo NO_FS_PROC
          # ★ 必须做端口转发，直接用 localhost:5555 连会 connection closed
          adb -s localhost:5555 forward tcp:27042 tcp:27042 || true
          adb -s localhost:5555 forward --list || true
          for i in 1 2 3; do
            echo "--- frida-ps try $i ---"
            frida-ps -H 127.0.0.1:27042 2>&1 | head -8 && break
            sleep 5
          done

      - name: Launch Qidian + attach frida + capture
        run: |
          set +e
          mkdir -p out
          adb -s localhost:5555 shell "pm clear com.qidian.QDReader" 2>&1 | tail -1
          adb -s localhost:5555 shell "logcat -c"
          # ★ 不用 frida spawn（在 redroid 上会 InvocationTargetException 并把 App 强停），
          #   改成 am start 显式拉起 + attach（这是之前跑通的拉起方式）
          # ★ 先起后台轮询：进程一出现立刻 attach（抢在 App 发启动请求之前/之中）
          ( for i in $(seq 1 60); do
              P=$(adb -s localhost:5555 shell "pidof com.qidian.QDReader" 2>/dev/null | tr -d '\r')
              if [ -n "$P" ]; then
                echo "RACE: pid=$P at try $i, attaching NOW" >> out/race.log
                echo "=== 用 Python frida API 驱动（避免 CLI stdin=EOF 秒退）===" >> out/capture.txt
                timeout 4700 python3 /tmp/frida_drive.py "$P" /tmp/hook_net.js 4500 \
                  > out/capture.txt 2>&1
                break
              fi
              sleep 0.4
            done ) &
          echo "===== am start ====="
          # ★ 动态解析启动 Activity（不硬编码，加固包也能拉到）
          APK_PKG=com.qidian.QDReader
          echo "--- 已安装的 qidian 包 ---"
          adb -s localhost:5555 shell "pm list packages | grep -i qidian" | tr -d '\r'
          echo "--- 解析 LAUNCHER activity ---"
          LA=$(adb -s localhost:5555 shell "cmd package resolve-activity --brief -c android.intent.category.LAUNCHER $APK_PKG" 2>/dev/null | tail -1 | tr -d '\r')
          echo "LAUNCHER=$LA"
          echo "--- manifest 里的 MAIN 入口 ---"
          adb -s localhost:5555 shell "dumpsys package $APK_PKG | grep -A3 android.intent.action.MAIN" 2>/dev/null | head -12 | tr -d '\r'
          if [ -n "$LA" ] && [ "$LA" != "No activity found" ]; then
            echo ">>> 用解析到的 Activity 启动: $LA"
            adb -s localhost:5555 shell "am start -W -n $LA" 2>&1 | tail -5
          else
            echo ">>> 解析失败，退回 monkey 全类别"
            adb -s localhost:5555 shell "monkey -p $APK_PKG 1" 2>&1 | tail -5
          fi
          sleep 25
          cat out/race.log 2>/dev/null || echo "(race 未触发)" 
          adb -s localhost:5555 shell "dumpsys activity activities | grep ResumedActivity"
          echo "===== 等 attach 生效 ====="
          for i in $(seq 1 30); do
            if grep -qF "script loaded OK" out/capture.txt 2>/dev/null; then echo "hook ready (try $i)"; break; fi
            sleep 2
          done
          echo "===== attach 后 capture 前 20 行 ====="
          head -20 out/capture.txt
          echo "===== T+45s capture ====="
          wc -l out/capture.txt; head -70 out/capture.txt
          adb -s localhost:5555 shell "dumpsys activity activities | grep ResumedActivity"


      - name: ★ 拉起登录页 + 立刻截图
          # ★★★ 关键：先点掉【系统全屏提示弹窗】（它抢焦点，不点掉所有操作都无效）
          for k in 1 2 3 4 5; do
            adb -s localhost:5555 shell "uiautomator dump /sdcard/d.xml >/dev/null 2>&1"
            adb -s localhost:5555 shell "cat /sdcard/d.xml" 2>/dev/null | tr -d '\r' > d.xml
            GOT=$(cat d.xml 2>/dev/null | sed 's/></>\n</g' | grep -E 'text="GOT IT"' | grep -oE 'bounds="\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]"' | head -1)
            echo "  [dismiss $k] GOT IT bounds: ${GOT:-无}"
            if [ -n "$GOT" ]; then
              N=$(echo "$GOT" | sed -E 's/^bounds="\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]"$/\1 \2 \3 \4/')
              set -- $N
              adb -s localhost:5555 shell "input tap $(( ($1+$3)/2 )) $(( ($2+$4)/2 ))"
              echo "  已点掉 GOT IT"
              sleep 4
            else
              break
            fi
          done
          adb -s localhost:5555 shell "dumpsys activity activities | grep ResumedActivity" | tr -d '\r'

        run: |
          set +e
          adb -s localhost:5555 shell "am start -a android.intent.action.VIEW -d 'QDReader://login'" 2>&1 | tail -3
          sleep 30
          adb -s localhost:5555 shell "dumpsys activity activities | grep ResumedActivity"
          mkdir -p qr
          for i in 1 2 3 4 5; do
            adb -s localhost:5555 exec-out screencap -p > qr/qr_$i.png 2>/dev/null
            echo "qr_$i size=$(stat -c%s qr/qr_$i.png 2>/dev/null || echo 0)"
            sleep 12
          done
          ls -la qr/

      - name: ★★ 立刻上传二维码（这一条先传，好让你马上扫）
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qr
          path: qr/
          if-no-files-found: warn

      - name: ★ 保持会话等你扫码（25 分钟）
        run: |
          set +e
          for i in $(seq 1 120); do
            sleep 30
            R=$(adb -s localhost:5555 shell "dumpsys activity activities | grep ResumedActivity" 2>/dev/null | tr -d '\r')
            echo "[$i] $R"
            # 登录成功后通常不再是登录页
            case "$R" in *Login*|*login*) ;; *) echo "★ 活动已变化，可能登录成功"; break;; esac
          done
          adb -s localhost:5555 exec-out screencap -p > out_after_login.png 2>/dev/null
          echo "===== 登录后挂钩输出 ====="
          grep -E "★★|QIMEI|ibex|OLA|NIB|additionalKey|status=|明文|找不到类" out/capture.txt 2>/dev/null | head -50

      - name: ★ 深链打开一章（触发解密）
        run: |
          set +e
          adb -s localhost:5555 shell "am start -a android.intent.action.VIEW -d 'QDReader://OpenBook/1049120379/903350205'" 2>&1 | tail -3
          sleep 40
          adb -s localhost:5555 exec-out screencap -p > out/after_chapter.png 2>/dev/null
          echo "===== 解密挂钩输出 ★★★ ====="
          grep -E "★★★|additionalKey|status=|明文|cipher 全量" out/capture.txt 2>/dev/null | head -60


      - name: Keep capturing then dump
        run: |
          set +e
          sleep 120
          echo "===== FULL CAPTURE ====="
          cat out/capture.txt
          echo "===== ★ 内核级：app uid 有没有 TCP 连接 ====="
          adb -s localhost:5555 shell "cat /proc/net/tcp /proc/net/tcp6 2>/dev/null | wc -l" | tr -d '\r'
          echo "--- 非 00000000/0000000000000000 的对端连接（有外部连接就会出现在这）---"
          adb -s localhost:5555 shell "cat /proc/net/tcp /proc/net/tcp6 2>/dev/null" | tr -d '\r' | awk 'NR>1' | head -20
          echo "--- app 进程的 socket 统计 ---"
          PIDX=$(adb -s localhost:5555 shell "pidof com.qidian.QDReader" 2>/dev/null | tr -d '\r')
          echo "app pid=$PIDX"
          adb -s localhost:5555 shell "ls -l /proc/$PIDX/fd 2>/dev/null | grep -c socket" | tr -d '\r'
          echo "--- tcpdump 抓 15 秒（若容器里有）---"
          adb -s localhost:5555 shell "which tcpdump" | tr -d '\r'
          echo "===== logcat 全量过滤（放宽 tag）====="
          adb -s localhost:5555 shell "logcat -d -v brief" 2>/dev/null | grep -iE "qidian|argus|sora|cmfu|QDInfo|okhttp|retrofit|http|network|Exception" | tail -80

      - name: Upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture
          path: out/
          if-no-files-found: warn
