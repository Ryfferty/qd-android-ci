name: qd-crash2

on:
  workflow_dispatch:

jobs:
  c2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm

      - name: Prepare
        run: |
          mkdir -p apks out
          wget -q "https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/qidian_7.9.200.apk" -O apks/qidian.apk
          wget -q "https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/hook2.js" -O hook.js
          pip install -q frida-tools 2>&1 | tail -1
          FV=$(frida --version)
          wget -q "https://github.com/frida/frida/releases/download/${FV}/frida-server-${FV}-android-x86_64.xz" -O fs.xz
          unxz -f fs.xz && chmod +x fs

      - name: Run
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 4096 -cores 4
          disable-animations: true
          script: |
            adb root 2>&1 | head -1 || true
            sleep 5
            adb push fs /data/local/tmp/fs || true
            adb shell chmod 755 /data/local/tmp/fs || true
            adb install -r -t apks/qidian.apk 2>&1 | tail -1 || true
            adb shell "setsid /data/local/tmp/fs -D >/dev/null 2>&1 &" || true
            sleep 10
            adb logcat -c || true
            timeout 300 frida -U -f com.qidian.QDReader -l hook.js -q > out/frida.txt 2>&1 &
            sleep 45
            echo "===== 点同意并继续 ====="
            adb shell input tap 540 1621 || true
            sleep 30
            adb shell ps -A | grep -i qidian > out/ps_after.txt || true
            cat out/ps_after.txt || true
            adb shell dumpsys activity activities 2>/dev/null | grep mResumedActivity || true
            echo "===== 抓 logcat（崩溃） ====="
            adb logcat -d -v threadtime > out/logcat.txt || true
            adb logcat -d -b crash -v threadtime > out/crash.txt || true
            echo "--- crash buffer ---"
            tail -50 out/crash.txt || true
            echo "--- FATAL/UnsatisfiedLink/dlopen ---"
            grep -iE "FATAL|UnsatisfiedLink|dlopen failed|SIGSEGV|beginning of crash|ClassNotFound" out/logcat.txt | tail -40 || true
            echo "--- qidian 相关错误 ---"
            grep -iE "qidian.*(error|fail|exception)|EM_AARCH64" out/logcat.txt | tail -20 || true
            wc -l out/logcat.txt || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash2-out
          path: out/
          retention-days: 3
