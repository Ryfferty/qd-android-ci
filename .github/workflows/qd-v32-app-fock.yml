name: qd-v32-app-fock

# 路径 D：App 当「加密容器」——数据仍走 argus（零网页），算法由 App 内已初始化的 libfock.so 提供
on:
  workflow_dispatch:
    inputs:
      per_hook_sec:
        default: '240'
      hook:
        default: 'hook_v42_matrix.js'
      acct:
        default: '900069660351'
      use_web:
        default: '0'

permissions:
  contents: write

jobs:
  app:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup deps
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq linux-modules-extra-$(uname -r) android-tools-adb python3-pip curl xz-utils unzip || echo APT_PARTIAL
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>&1 || echo MODPROBE_MAYBE
          pip install -q "frida==16.7.19" "frida-tools<14" pycryptodome 2>&1 | tail -1
          python3 -c "from Crypto.Cipher import DES3; print('pycryptodome OK')"

      - name: Setup redroid
        run: |
          sudo docker rm -f redroid 2>/dev/null || true
          VOLS=""
          for d in binder hwbinder vndbinder; do [ -e /dev/$d ] && VOLS="$VOLS -v /dev/$d:/dev/$d"; done
          sudo docker run -d --privileged --name redroid $VOLS -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.redroid_gpu_mode=guest androidboot.redroid_width=1080 \
            androidboot.redroid_height=2340 androidboot.redroid_dpi=420 \
            androidboot.redroid_adb=5555
          sleep 15
          adb start-server >/dev/null 2>&1 || true
          timeout 30 adb connect localhost:5555 || true
          for i in $(seq 1 45); do
            B=$(timeout 15 adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$B" = "1" ] && { echo "BOOT_OK try $i"; break; }
            sleep 8
          done
          adb -s localhost:5555 root 2>&1 | tail -1
          sleep 8

      - name: Install APK and frida-server
        run: |
          set +e
          B=localhost:5555
          REL=https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1
          OK=0
          for A in qidian_7.9.200.apk qidian_7.9.464_slim.apk q464_slim_signed.apk; do
            echo "--- try $A ---"
            curl -sSL --max-time 900 -o qd.apk "$REL/$A"
            echo "  downloaded $(stat -c%s qd.apk 2>/dev/null)B"
            if adb -s $B install -r -d --no-streaming qd.apk 2>&1 | tail -2 | grep -q Success; then
              echo "  INSTALLED $A"; OK=1; break
            fi
          done
          echo "install_ok=$OK"
          adb -s $B shell pm list packages | grep -i qidian
          FR=16.7.19
          curl -sSL --max-time 300 -o fs.xz "https://github.com/frida/frida/releases/download/${FR}/frida-server-${FR}-android-arm64.xz"
          unxz -f fs.xz && mv fs fs-server && chmod +x fs-server
          adb -s $B push fs-server /data/local/tmp/frida-server
          adb -s $B shell chmod 755 /data/local/tmp/frida-server
          adb -s $B shell "nohup /data/local/tmp/frida-server >/dev/null 2>&1 &"
          sleep 6
          adb -s $B forward tcp:27042 tcp:27042
          frida-ps -H 127.0.0.1:27042 2>&1 | head -6

      - name: argus keys and cipher
        env:
          S_A: ${{ secrets.QD_SESS_3264757074 }}
          S_B: ${{ secrets.QD_SESS_2719559418 }}
          S_C: ${{ secrets.QD_SESS_900069660351 }}
          ACCT: ${{ inputs.acct }}
        run: |
          set +e
          case "$ACCT" in
            3264757074) printf '%s' "$S_A" > /tmp/sess.json ;;
            2719559418) printf '%s' "$S_B" > /tmp/sess.json ;;
            *) printf '%s' "$S_C" > /tmp/sess.json ;;
          esac
          echo argus-acct=$ACCT

          BOOK=1049120379 CID=903350205 python3 argus_fetch.py
          python3 merge_params.py 1049120379 903350205
          if [ "${{ inputs.use_web }}" = "1" ] && [ -f params_web.json ]; then
            echo "--- 用网页密钥池参数集覆盖（argus 之后）---"
            cp params_web.json /tmp/params.json
            head -c 150 /tmp/params.json
            echo
          fi
          adb -s localhost:5555 push /tmp/params.json /data/local/tmp/params.json
          adb -s localhost:5555 shell chmod 644 /data/local/tmp/params.json

      - name: Dump MMKV ground truth
        if: always()
        run: |
          set +e
          B=localhost:5555
          echo "=== MMKV 目录 ==="
          adb -s $B shell "ls -la /data/data/com.qidian.QDReader/files/mmkv/ 2>/dev/null"
          adb -s $B shell "cat /data/data/com.qidian.QDReader/files/mmkv/pref_utils 2>/dev/null" > /tmp/pref_utils.bin
          ls -la /tmp/pref_utils.bin
          python3 mmkv_dump.py /tmp/pref_utils.bin

      - name: Two-stage run (App stays alive)
        env:
          S_A: ${{ secrets.QD_SESS_3264757074 }}
          S_B: ${{ secrets.QD_SESS_2719559418 }}
          S_C: ${{ secrets.QD_SESS_900069660351 }}
          ACCT: ${{ inputs.acct }}
        run: |
          set +e
          B=localhost:5555
          case "$ACCT" in
            3264757074) printf '%s' "$S_A" > /tmp/sess.json ;;
            2719559418) printf '%s' "$S_B" > /tmp/sess.json ;;
            *) printf '%s' "$S_C" > /tmp/sess.json ;;
          esac
          echo run-acct=$ACCT sess=$(stat -c%s /tmp/sess.json)B
          adb -s $B push /tmp/sess.json /data/local/tmp/sess.json
          adb -s $B shell chmod 644 /data/local/tmp/sess.json
          echo "--- 启动 App（只启动一次，之后不再重启）---"
          PID=""
          for i in 1 2 3 4 5 6; do
            adb -s $B shell "monkey -p com.qidian.QDReader -c android.intent.category.LAUNCHER 1" >/dev/null 2>&1
            sleep 10
            PID=$(adb -s $B shell pidof com.qidian.QDReader | tr -d '\r')
            [ -n "$PID" ] && break
            adb -s $B shell "am start -a android.intent.action.VIEW -d QDReader://OpenBook/1049120379/903350205" >/dev/null 2>&1
            sleep 10
            PID=$(adb -s $B shell pidof com.qidian.QDReader | tr -d '\r')
            [ -n "$PID" ] && break
          done
          echo "PID=[$PID]"
          [ -z "$PID" ] && { echo APP_NOT_RUNNING; exit 0; }
          echo "--- 段1: 注入 cookie + init + requestKey ---"
          timeout 100 frida -H 127.0.0.1:27042 -p "$PID" -l hook_v41a.js -q > /tmp/a.txt 2>&1 || echo "a exit $?"
          cat /tmp/a.txt | head -30
          echo "--- 等 30 秒让 App 完成密钥池请求 ---"
          sleep 30
          PID2=$(adb -s $B shell pidof com.qidian.QDReader | tr -d '\r')
          echo "段2 PID=[$PID2]"
          [ -z "$PID2" ] && { echo APP_DIED_AFTER_A; exit 0; }
          echo "--- 段2: add + unlock ---"
          timeout 150 frida -H 127.0.0.1:27042 -p "$PID2" -l "${{ inputs.hook }}" -q > /tmp/b.txt 2>&1 || echo "b exit $?"
          cat /tmp/b.txt | head -60
          echo
          echo "########## v41b 结果文件 ##########"
          adb -s $B shell "cp /data/data/com.qidian.QDReader/files/v42_result.txt /data/local/tmp/ 2>/dev/null" || true
          adb -s $B pull /data/local/tmp/v42_result.txt /tmp/v42_result.txt 2>&1 | tail -1
          cat /tmp/v42_result.txt 2>/dev/null | head -60
          echo
          echo "########## 明文 ##########"
          adb -s $B shell "cp /data/data/com.qidian.QDReader/files/v42_plaintext.txt /data/local/tmp/ 2>/dev/null" || true
          adb -s $B pull /data/local/tmp/v42_plaintext.txt /tmp/v42_plaintext.txt 2>&1 | tail -1
          wc -c /tmp/v42_plaintext.txt 2>/dev/null
          head -c 2500 /tmp/v42_plaintext.txt 2>/dev/null
          exit 0

      - name: Re-dump MMKV after hook
        if: always()
        run: |
          set +e
          B=localhost:5555
          adb -s $B shell "ls -la /data/data/com.qidian.QDReader/files/mmkv/ 2>/dev/null"
          adb -s $B shell "cat /data/data/com.qidian.QDReader/files/mmkv/pref_utils 2>/dev/null" > /tmp/pref_utils2.bin
          ls -la /tmp/pref_utils2.bin
          python3 mmkv_dump.py /tmp/pref_utils2.bin

      - name: Collect logs
        if: always()
        run: |
          set +e
          adb -s localhost:5555 logcat -d -v brief 2>/dev/null | grep -iE 'fock|unlock|keypool|abort' | head -30
          mkdir -p results
          cp /tmp/frida_out.txt results/ 2>/dev/null || true
          cp /tmp/v37_result.txt results/ 2>/dev/null || true
          cp /tmp/pref_utils.bin results/ 2>/dev/null || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v41b-app-out
          path: results/
          if-no-files-found: warn
