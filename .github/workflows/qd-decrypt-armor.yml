name: qd-decrypt-armor
on:
  workflow_dispatch:

jobs:
  decrypt:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        run: |
          set +e
          sudo -S -p '' apt-get update -qq || true
          sudo -S -p '' apt-get install -y -qq linux-modules-extra-$(uname -r) android-tools-adb curl xz-utils unzip python3-pip || echo APT
          sudo -S -p '' modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>&1 || echo MODPROBE
          pip install -q "frida==16.7.19" "frida-tools<14" "pycryptodome" 2>&1 | tail -1
          sudo -S -p '' docker rm -f redroid 2>/dev/null || true
          VOLS=""
          for d in binder hwbinder vndbinder; do [ -e /dev/$d ] && VOLS="$VOLS -v /dev/$d:/dev/$d"; done
          sudo -S -p '' docker run -d --privileged --name redroid $VOLS -p 5555:5555 redroid/redroid:11.0.0-latest androidboot.redroid_width=720 androidboot.redroid_height=1184 androidboot.redroid_dpi=240 androidboot.redroid_gpu_mode=guest
          adb start-server >/dev/null 2>&1; sleep 5
          for i in $(seq 1 30); do
            adb connect localhost:5555 >/dev/null 2>&1
            S=$(timeout 8 adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$S" = "1" ] && break
            sleep 6
          done
          echo "BOOT_OK"
          FR=16.7.19
          curl -sSL --max-time 180 -o fs.xz "https://github.com/frida/frida/releases/download/${FR}/frida-server-${FR}-android-arm64.xz"
          unxz -f fs.xz; mv -f fs fs-server; chmod +x fs-server
          timeout 30 adb -s localhost:5555 root 2>&1 | head -1
          sleep 6
          adb -s localhost:5555 shell "setenforce 0" 2>&1 | head -1
          adb -s localhost:5555 push fs-server /data/local/tmp/fs-srv >/dev/null 2>&1
          adb -s localhost:5555 shell "chmod 755 /data/local/tmp/fs-srv"

      - name: Decrypt
        run: |
          set +e
          B=localhost:5555
          curl -sSL --max-time 300 -o q464.apk "https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/qidian_7.9.464.apk"
          timeout 120 adb -s $B push q464.apk /data/local/tmp/q464.apk >/dev/null 2>&1
          timeout 120 adb -s $B shell "pm install -r -d -t --user 0 /data/local/tmp/q464.apk" 2>&1 | tail -1
          timeout 30 adb -s $B shell "am start -n com.qidian.QDReader/.ui.activity.SplashActivity" >/dev/null 2>&1
          PID=""
          for i in $(seq 1 15); do
            sleep 3
            P=$(timeout 10 adb -s $B shell pidof com.qidian.QDReader | tr -d '\r')
            if [ -n "$P" ]; then
              sleep 5
              P2=$(timeout 10 adb -s $B shell pidof com.qidian.QDReader | tr -d '\r')
              if [ "$P" = "$P2" ] && [ -n "$P2" ]; then
                PID=$P
                break
              fi
            fi
          done
          [ -z "$PID" ] && { echo "NO_APP"; exit 0; }
          echo "PID=$PID"
          timeout 10 adb -s $B shell "setsid /data/local/tmp/fs-srv -D >/dev/null 2>&1 &"
          sleep 8
          adb -s $B forward tcp:27042 tcp:27042
          
          cat > trace_v3.js << 'JSEOF'
Java.perform(function() {
    // ★ 等待libnib.so加载!
    function waitForLib(name, cb, maxWait) {
        var start = Date.now();
        var check = function() {
            var base = Module.findBaseAddress(name);
            if (base) {
                console.log("[V3] " + name + " loaded at " + base);
                cb(base);
            } else if (Date.now() - start < (maxWait || 60000)) {
                setTimeout(check, 2000);
            } else {
                console.log("[V3] TIMEOUT waiting for " + name);
            }
        };
        check();
    }
    
    waitForLib("libnib.so", function(BASE) {
        console.log("[V3] Setting up hooks...");
        
        var MD4U_ADDR = BASE.add(0x21454);
        var C8_ADDR = BASE.add(0x7c30);
        var C16_ADDR = BASE.add(0x7b84);
        var MD4C_ADDR = BASE.add(0x20f40);
        
        // Hook MD4 update!
        try {
            Interceptor.attach(MD4U_ADDR, {
                onEnter: function(args) {
                    var len = args[2].toInt32();
                    if (len > 0 && len < 200) {
                        var data = "";
                        for (var i = 0; i < Math.min(len, 32); i++) {
                            data += ("0" + args[1].add(i).readU8().toString(16)).slice(-2);
                        }
                        console.log("[MD4U] len=" + len + " data=" + data);
                    }
                }
            });
            console.log("[V3] MD4U hooked!");
        } catch(e) { console.log("[V3] MD4U FAIL: " + e); }
        
        // Hook cipher8!
        try {
            Interceptor.attach(C8_ADDR, {
                onEnter: function(args) {
                    this.inp = args[0]; this.len = args[1].toInt32();
                    this.key = args[2]; this.outp = args[3];
                    if (this.len > 0 && this.len < 100) {
                        var d = "";
                        for (var i = 0; i < this.len; i++) {
                            d += ("0" + this.inp.add(i).readU8().toString(16)).slice(-2);
                        }
                        console.log("[C8_IN] len=" + this.len + " data=" + d);
                    }
                    if (this.key && !this.key.isNull()) {
                        var k = "";
                        for (var i = 0; i < 16; i++) {
                            try { k += ("0" + this.key.add(i).readU8().toString(16)).slice(-2); } catch(e) { break; }
                        }
                        console.log("[C8_KEY] " + k);
                    }
                },
                onLeave: function(retval) {
                    if (retval && !retval.isNull()) {
                        var o = "";
                        for (var i = 0; i < 20; i++) {
                            try { o += ("0" + retval.add(i).readU8().toString(16)).slice(-2); } catch(e) { break; }
                        }
                        console.log("[C8_RET] " + o);
                    }
                    if (this.outp && !this.outp.isNull()) {
                        var b = "";
                        for (var i = 0; i < 16; i++) {
                            try { b += ("0" + this.outp.add(i).readU8().toString(16)).slice(-2); } catch(e) { break; }
                        }
                        console.log("[C8_BUF] " + b);
                    }
                }
            });
            console.log("[V3] C8 hooked!");
        } catch(e) { console.log("[V3] C8 FAIL: " + e); }
        
        // Hook cipher16!
        try {
            Interceptor.attach(C16_ADDR, {
                onEnter: function(args) {
                    this.inp = args[0]; this.len = args[1].toInt32();
                    this.key = args[2];
                    if (this.len > 0 && this.len < 100) {
                        var d = "";
                        for (var i = 0; i < this.len; i++) {
                            d += ("0" + this.inp.add(i).readU8().toString(16)).slice(-2);
                        }
                        console.log("[C16_IN] len=" + this.len + " data=" + d);
                    }
                    if (this.key && !this.key.isNull()) {
                        var k = "";
                        for (var i = 0; i < 16; i++) {
                            try { k += ("0" + this.key.add(i).readU8().toString(16)).slice(-2); } catch(e) { break; }
                        }
                        console.log("[C16_KEY] " + k);
                    }
                },
                onLeave: function(retval) {
                    if (retval && !retval.isNull()) {
                        var o = "";
                        for (var i = 0; i < 20; i++) {
                            try { o += ("0" + retval.add(i).readU8().toString(16)).slice(-2); } catch(e) { break; }
                        }
                        console.log("[C16_RET] " + o);
                    }
                }
            });
            console.log("[V3] C16 hooked!");
        } catch(e) { console.log("[V3] C16 FAIL: " + e); }
        
        // Hook MD4 compress!
        try {
            Interceptor.attach(MD4C_ADDR, {
                onEnter: function(args) {
                    this.ctx = args[0];
                    var s = [];
                    for (var i = 0; i < 4; i++) {
                        s.push(args[0].add(8 + i*4).readU32().toString(16));
                    }
                    console.log("[MD4C_IN] " + s.join(","));
                },
                onLeave: function(retval) {
                    var s = [];
                    for (var i = 0; i < 4; i++) {
                        s.push(this.ctx.add(8 + i*4).readU32().toString(16));
                    }
                    console.log("[MD4C_OUT] " + s.join(","));
                }
            });
            console.log("[V3] MD4C hooked!");
        } catch(e) { console.log("[V3] MD4C FAIL: " + e); }
        
        // 测试!
        setTimeout(function() {
            var NW = Java.use("com.yuewen.nib.NativeWrapper");
            var tests = ["AB", "AA", "test", "hello"];
            for (var ti = 0; ti < tests.length; ti++) {
                console.log("\n===== lk('" + tests[ti] + "') =====");
                try {
                    var result = NW.a(tests[ti]);
                    console.log("[RESULT] " + result);
                } catch(e) {
                    console.log("[ERR] " + e);
                }
            }
            console.log("[V3_DONE]");
        }, 3000);
    }, 60000);
});
JSEOF
          
          timeout 60 frida -H 127.0.0.1:27042 -p $PID -l trace_v3.js 2>&1 | tee /tmp/decrypt_output.log
          echo "=== Done ==="

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: armor-plaintext
          path: /tmp/decrypt_output.log
          if-no-files-found: warn
