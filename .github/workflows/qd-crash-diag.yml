name: qd-crash-diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm

      - name: Download APK
        run: |
          mkdir -p apks
          wget -q "https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/qidian_7.9.200.apk" -O apks/qidian.apk

      - name: Run
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 4096 -cores 4
          disable-animations: true
          script: |
            mkdir -p out
            adb logcat -c
            adb install -r -t apks/qidian.apk 2>&1 | tail -1
            adb shell am start -n com.qidian.QDReader/.ui.activity.SplashActivity 2>&1 | tail -1
            sleep 30
            adb shell ps -A | grep -i qidian > out/ps1.txt
            adb shell input tap 540 1621
            sleep 6
            adb shell ps -A | grep -i qidian > out/ps2.txt
            sleep 25
            adb shell ps -A | grep -i qidian > out/ps3.txt
            adb shell dumpsys activity activities 2>/dev/null | grep mResumedActivity > out/act.txt
            adb shell screencap -p /sdcard/d1.png && adb pull /sdcard/d1.png out/d1.png
            adb logcat -d -v threadtime > out/full_logcat.txt
            adb logcat -d -b crash -v threadtime > out/crash_log.txt
            echo "=== crash buffer ==="
            tail -40 out/crash_log.txt
            echo "=== qidian/FATAL lines ==="
            grep -iE "qidian|FATAL|AndroidRuntime|SIGSEGV|native crash|DEBUG" out/full_logcat.txt | tail -60
            echo "=== ps snapshots ==="
            cat out/ps1.txt out/ps2.txt out/ps3.txt
            wc -l out/full_logcat.txt

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-diag
          path: out/
          retention-days: 3
