name: qd-qq-login
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: qidian apk url
        default: https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/qidian_7.9.200.apk
        required: false

jobs:
  qq:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Setup binder and adb
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq linux-modules-extra-$(uname -r) adb curl xz-utils || echo APT_FAILED
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>&1 || echo MODPROBE_FAILED
          lsmod | grep -i binder || true

      - name: Start redroid
        run: |
          sudo docker rm -f redroid 2>/dev/null || true
          VOLS=""
          for d in binder hwbinder vndbinder; do if [ -e /dev/$d ]; then VOLS="$VOLS -v /dev/$d:/dev/$d"; fi; done
          sudo docker run -d --privileged --name redroid $VOLS -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.redroid_gpu_mode=guest androidboot.redroid_width=1080 \
            androidboot.redroid_height=2340 androidboot.redroid_dpi=420 \
            androidboot.redroid_adb=5555 || echo DOCKER_FAILED
          sleep 15
          sudo docker ps --format '{{.Names}} {{.Status}}'

      - name: Boot
        run: |
          adb start-server >/dev/null 2>&1 || true
          timeout 30 adb connect localhost:5555 2>&1 || true
          for i in $(seq 1 30); do
            B=$(timeout 15 adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "$B" = "1" ]; then echo "booted try $i"; break; fi
            sleep 8
          done
          echo "ABI=$(timeout 15 adb -s localhost:5555 shell getprop ro.product.cpu.abi | tr -d '\r')"
          echo "QQUID=$(timeout 15 adb -s localhost:5555 shell getprop ro.build.fingerprint | tr -d '\r')"

      - name: Install qidian
        run: |
          curl -sSL --max-time 300 -o /tmp/qd.apk "${{ inputs.apk_url }}" || echo DL_FAILED
          timeout 180 adb -s localhost:5555 install -r -t /tmp/qd.apk 2>&1 | tail -2

      - name: Agree then check privacy box then tap QQ
        run: |
          timeout 20 adb -s localhost:5555 shell "logcat -c" || true
          timeout 40 adb -s localhost:5555 shell "am start -W -n com.qidian.QDReader/com.qidian.QDReader.ui.activity.SplashActivity" 2>&1 | tail -3
          sleep 20
          echo "=== tap 同意并继续 (539,1605) ==="
          timeout 20 adb -s localhost:5555 shell "input tap 539 1605" || true
          sleep 20
          timeout 30 adb -s localhost:5555 shell uiautomator dump /sdcard/login.xml >/dev/null 2>&1 || true
          timeout 30 adb -s localhost:5555 pull /sdcard/login.xml /tmp/login.xml >/dev/null 2>&1 || true
          timeout 30 adb -s localhost:5555 exec-out screencap -p > /tmp/login.png 2>/dev/null || true
          echo "=== tap privacy checkbox (84,2003) ==="
          timeout 20 adb -s localhost:5555 shell "input tap 84 2003" || true
          sleep 4
          timeout 30 adb -s localhost:5555 shell uiautomator dump /sdcard/checked.xml >/dev/null 2>&1 || true
          timeout 30 adb -s localhost:5555 pull /sdcard/checked.xml /tmp/checked.xml >/dev/null 2>&1 || true
          timeout 30 adb -s localhost:5555 exec-out screencap -p > /tmp/checked.png 2>/dev/null || true
          echo "=== TAP QQ LOGIN (539,1840) ==="
          timeout 20 adb -s localhost:5555 shell "input tap 539 1840" || true
          for t in 20 45 80; do
            sleep 20
            echo "----- T+${t}s -----"
            timeout 20 adb -s localhost:5555 shell "ps -A | grep -i qidian" 2>&1 || echo NO_QIDIAN
            timeout 20 adb -s localhost:5555 shell "dumpsys window 2>/dev/null | grep mCurrentFocus" 2>&1 || true
            timeout 30 adb -s localhost:5555 exec-out screencap -p > /tmp/qq_${t}s.png 2>/dev/null || true
            timeout 30 adb -s localhost:5555 shell uiautomator dump /sdcard/q${t}.xml >/dev/null 2>&1 || true
            timeout 30 adb -s localhost:5555 pull /sdcard/q${t}.xml /tmp/q${t}.xml >/dev/null 2>&1 || true
          done

      - name: What happened
        if: always()
        run: |
          echo "=== crash buffer ==="
          timeout 30 adb -s localhost:5555 shell "logcat -d -b crash -v time" 2>&1 | tail -40 || true
          echo "=== qq/login related log ==="
          timeout 40 adb -s localhost:5555 shell "logcat -d -v time" 2>/dev/null | grep -i -E "qq|tencent|mqq|openapp|scheme|no activity|ActivityNotFound|webview|turing|qr" | tail -100 || true
          echo "=== installed pkgs (qq?) ==="
          timeout 20 adb -s localhost:5555 shell "pm list packages | grep -i -E 'qq|tencent'" 2>&1 || true
          echo "=== focused activity full ==="
          timeout 20 adb -s localhost:5555 shell "dumpsys activity activities 2>/dev/null | grep -E 'mResumedActivity|topResumedActivity|ResumedActivity'" 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qq-login-evidence
          path: |
            /tmp/login.png
            /tmp/checked.png
            /tmp/qq_*.png
            /tmp/login.xml
            /tmp/checked.xml
            /tmp/q*.xml
          if-no-files-found: warn
