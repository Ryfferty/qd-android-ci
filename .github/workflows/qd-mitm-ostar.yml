name: qd-mitm-ostar
on:
  workflow_dispatch:

jobs:
  mitm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup + MITM
        run: |
          set +e
          sudo -S -p '' apt-get update -qq || true
          sudo -S -p '' apt-get install -y -qq linux-modules-extra-$(uname -r) android-tools-adb curl xz-utils unzip python3-pip || echo APT
          sudo -S -p '' modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>&1 || echo MODPROBE
          pip install -q mitmproxy 2>&1 | tail -1
          
          sudo -S -p '' docker rm -f redroid 2>/dev/null || true
          VOLS=""
          for d in binder hwbinder vndbinder; do [ -e /dev/$d ] && VOLS="$VOLS -v /dev/$d:/dev/$d"; done
          sudo -S -p '' docker run -d --privileged --name redroid $VOLS -p 5555:5555 \
            -e HTTP_PROXY=http://10.0.2.2:8080 \
            -e HTTPS_PROXY=http://10.0.2.2:8080 \
            redroid/redroid:11.0.0-latest \
            androidboot.redroid_width=720 androidboot.redroid_height=1184 \
            androidboot.redroid_dpi=240 androidboot.redroid_gpu_mode=guest
          
          adb start-server >/dev/null 2>&1; sleep 5
          for i in $(seq 1 30); do
            adb connect localhost:5555 >/dev/null 2>&1
            S=$(timeout 8 adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$S" = "1" ] && break
            sleep 6
          done
          echo "BOOT_OK"
          
          # ★ 启动mitmproxy!
          mitmdump --mode regular --listen-port 8080 --set flow_detail=0 -w /tmp/flows.mitm &
          MITM_PID=$!
          echo "mitmproxy PID: $MITM_PID"
          sleep 3
          
          # 获取runner的IP(redroid的网关)!
          HOST_IP=$(hostname -I | awk '{print $1}')
          echo "Host IP: $HOST_IP"
          
          # 在Android上设置全局代理!
          adb -s localhost:5555 shell "settings put global http_proxy $HOST_IP:8080"
          echo "Proxy set: $HOST_IP:8080"
          
          # 安装MITM CA证书!
          # 获取mitmproxy CA!
          CA_CERT=$(ls ~/.mitmproxy/mitmproxy-ca-cert.cer 2>/dev/null || echo "")
          if [ -z "$CA_CERT" ]; then
              # 生成CA!
              mitmdump --listen-port 8081 --set flow_detail=0 &
              sleep 2
              kill %1 2>/dev/null
              CA_CERT=~/.mitmproxy/mitmproxy-ca-cert.cer
          fi
          
          if [ -f "$CA_CERT" ]; then
              # 计算证书hash用于Android系统证书!
              CERT_HASH=$(openssl x509 -inform PEM -subject_hash_old -in "$CA_CERT" | head -1)
              CERT_FILE="/data/local/tmp/${CERT_HASH}.0"
              adb -s localhost:5555 push "$CA_CERT" "$CERT_FILE"
              # 挂载系统分区为可写并安装证书!
              adb -s localhost:5555 root
              sleep 2
              adb -s localhost:5555 shell "mount -o rw,remount /system" 2>/dev/null
              adb -s localhost:5555 shell "cp $CERT_FILE /system/etc/security/cacerts/" 2>/dev/null
              adb -s localhost:5555 shell "chmod 644 /system/etc/security/cacerts/${CERT_HASH}.0" 2>/dev/null
              echo "CA cert installed: $CERT_HASH"
          else
              echo "CA cert not found!"
          fi

      - name: App + Capture
        run: |
          set +e
          which adb || sudo -S -p '' apt-get install -y -qq android-tools-adb
          B=localhost:5555
          
          curl -sSL --max-time 300 -o q464.apk "https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/qidian_7.9.464.apk"
          timeout 120 adb -s $B push q464.apk /data/local/tmp/q464.apk >/dev/null 2>&1
          timeout 120 adb -s $B shell "pm install -r -d -t --user 0 /data/local/tmp/q464.apk" 2>&1 | tail -1
          
          # ★ 在容器内启动tcpdump!
          docker exec redroid sh -c "which tcpdump || echo NO_TCPDUMP" 2>/dev/null
          # 尝试安装tcpdump到redroid!
          docker exec redroid sh -c "tcpdump -i any -w /tmp/capture.pcap host druidv6.if.qidian.com or port 443 2>/dev/null &" 2>/dev/null
          echo "tcpdump started (if available)"
          
          # 启动App!
          timeout 30 adb -s $B shell "am start -n com.qidian.QDReader/.ui.activity.SplashActivity" >/dev/null 2>&1
          
          # 等App运行2分钟(让Beacon发ostar请求)!
          echo "Waiting 120s for ostar requests..."
          sleep 180
          
          # 停止App!
          adb -s $B shell "am force-stop com.qidian.QDReader" 2>/dev/null
          
          # 分析捕获的流量!
          echo "=== Analyzing captured flows ==="
          # 查tcpdump文件!
          docker exec redroid sh -c "ls -la /tmp/capture.pcap 2>/dev/null" || echo "no tcpdump"
          # 复制出来!
          docker cp redroid:/tmp/capture.pcap /tmp/capture.pcap 2>/dev/null || echo "copy failed"
          ls -la /tmp/capture.pcap 2>/dev/null
          python3 << 'PYEOF'
          try:
              from mitmproxy import io as mio
              with open('/tmp/flows.mitm', 'rb') as f:
                  reader = mio.FlowReader(f)
                  for flow in reader.stream():
                      if hasattr(flow, 'request'):
                          url = flow.request.url
                          if 'ostar' in url or 'beacon' in url or 'druid' in url:
                              print(f"★OSTAR: {url}")
                              for k, v in flow.request.headers.items():
                                  print(f"  {k}: {v[:80]}")
                              if flow.request.body:
                                  print(f"  BODY: {flow.request.body[:200]}")
                              print()
          except Exception as e:
              print(f"Error: {e}")
          PYEOF

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mitm-ostar-flows
          path: |
            /tmp/flows.mitm
            /tmp/capture.pcap
          if-no-files-found: warn
