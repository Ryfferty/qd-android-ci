name: qd-mitm-ostar
on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup + tcpdump
        run: |
          set +e
          sudo -S -p '' apt-get update -qq || true
          sudo -S -p '' apt-get install -y -qq linux-modules-extra-$(uname -r) android-tools-adb curl xz-utils unzip tcpdump || echo APT
          sudo -S -p '' modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>&1 || echo MODPROBE
          
          sudo -S -p '' docker rm -f redroid 2>/dev/null || true
          VOLS=""
          for d in binder hwbinder vndbinder; do [ -e /dev/$d ] && VOLS="$VOLS -v /dev/$d:/dev/$d"; done
          sudo -S -p '' docker run -d --privileged --name redroid $VOLS -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.redroid_width=720 androidboot.redroid_height=1184 \
            androidboot.redroid_dpi=240 androidboot.redroid_gpu_mode=guest
          
          adb start-server >/dev/null 2>&1; sleep 5
          for i in $(seq 1 30); do
            adb connect localhost:5555 >/dev/null 2>&1
            S=$(timeout 8 adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$S" = "1" ] && break
            sleep 6
          done
          echo "BOOT_OK"

      - name: Capture
        run: |
          set +e
          which adb || sudo -S -p '' apt-get install -y -qq android-tools-adb
          B=localhost:5555
          
          curl -sSL --max-time 300 -o q464.apk "https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/qidian_7.9.464.apk"
          timeout 120 adb -s $B push q464.apk /data/local/tmp/q464.apk >/dev/null 2>&1
          timeout 120 adb -s $B shell "pm install -r -d -t --user 0 /data/local/tmp/q464.apk" 2>&1 | tail -1
          
          # ★ HOST级tcpdump — 抓所有Docker网络流量!
          echo "Starting tcpdump on host..."
          sudo -S -p '' tcpdump -i any -w /tmp/capture.pcap "port 443 or port 80" 2>&1 &
          TCPDUMP_PID=$!
          echo "tcpdump PID: $TCPDUMP_PID"
          sleep 2
          
          # 启动App!
          timeout 30 adb -s $B shell "am start -n com.qidian.QDReader/.ui.activity.SplashActivity" >/dev/null 2>&1
          
          # 等3分钟!
          echo "Waiting 180s for App to make ostar requests..."
          sleep 180
          
          # 停止tcpdump!
          sudo -S -p '' kill $TCPDUMP_PID 2>/dev/null
          sleep 2
          
          # 检查结果!
          ls -la /tmp/capture.pcap
          echo "=== Packet count ==="
          sudo -S -p '' tcpdump -r /tmp/capture.pcap 2>/dev/null | wc -l
          
          # 查DNS查询!
          echo "=== DNS queries ==="
          sudo -S -p '' tcpdump -r /tmp/capture.pcap "port 53" 2>/dev/null | head -10
          
          # 查HTTPS连接!
          echo "=== HTTPS connections ==="
          sudo -S -p '' tcpdump -r /tmp/capture.pcap "port 443" 2>/dev/null | head -20

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-capture
          path: /tmp/capture.pcap
          if-no-files-found: warn
