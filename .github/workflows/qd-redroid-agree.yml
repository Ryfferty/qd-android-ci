name: qd-redroid-agree
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: APK url
        default: https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/qidian_7.9.200.apk
        required: false
      activity:
        description: launcher activity
        default: com.qidian.QDReader/com.qidian.QDReader.ui.activity.SplashActivity
        required: false
      redroid_tag:
        description: redroid tag
        default: 11.0.0-latest
        required: false

jobs:
  agree:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Setup binder and adb
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq linux-modules-extra-$(uname -r) adb curl xz-utils || echo APT_FAILED
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>&1 || echo MODPROBE_FAILED
          lsmod | grep -i binder || true

      - name: Start redroid
        run: |
          sudo docker pull redroid/redroid:${{ inputs.redroid_tag }} 2>&1 | tail -2 || true
          sudo docker rm -f redroid 2>/dev/null || true
          VOLS=""
          for d in binder hwbinder vndbinder; do if [ -e /dev/$d ]; then VOLS="$VOLS -v /dev/$d:/dev/$d"; fi; done
          sudo docker run -d --privileged --name redroid $VOLS -p 5555:5555 \
            redroid/redroid:${{ inputs.redroid_tag }} \
            androidboot.redroid_gpu_mode=guest androidboot.redroid_width=1080 \
            androidboot.redroid_height=2340 androidboot.redroid_dpi=420 \
            androidboot.redroid_adb=5555 || echo DOCKER_FAILED
          sleep 15
          sudo docker ps --format '{{.Names}} {{.Status}}'

      - name: Boot wait
        run: |
          adb start-server >/dev/null 2>&1 || true
          timeout 30 adb connect localhost:5555 2>&1 || true
          for i in $(seq 1 30); do
            B=$(timeout 15 adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            echo "boot try $i = [$B]"
            if [ "$B" = "1" ]; then break; fi
            sleep 8
          done
          echo "ABI          = $(timeout 15 adb -s localhost:5555 shell getprop ro.product.cpu.abi | tr -d '\r')"
          echo "NATIVEBRIDGE = $(timeout 15 adb -s localhost:5555 shell getprop ro.dalvik.vm.native.bridge | tr -d '\r')"

      - name: Network probe (all bounded by timeout)
        run: |
          echo "=== host outbound ==="
          curl -sS -o /dev/null -w "host->baidu http:%{http_code}\n" --max-time 15 https://www.baidu.com || echo "host net FAIL"
          echo "=== guest ip route ==="
          timeout 20 adb -s localhost:5555 shell "ip route" 2>&1 || echo "ip route FAILED"
          echo "=== guest dns ==="
          timeout 20 adb -s localhost:5555 shell "getprop | grep -i dns" 2>&1 || echo "dns prop FAILED"
          echo "=== guest tcp connect test (bounded) ==="
          timeout 25 adb -s localhost:5555 shell "toybox nc -w 3 223.5.5.5 443 < /dev/null; echo rc=\$?" 2>&1 || echo "nc FAILED/unsupported"
          echo "=== guest http test via toybox wget (bounded) ==="
          timeout 30 adb -s localhost:5555 shell "toybox wget -O /dev/null http://connect.rom.miui.com/generate_204; echo rc=\$?" 2>&1 || echo "wget FAILED/unsupported"
          echo "=== guest established sockets ==="
          timeout 20 adb -s localhost:5555 shell "cat /proc/net/tcp | head -12" 2>&1 || true

      - name: Install apk
        run: |
          curl -sSL --max-time 300 -o /tmp/qd.apk "${{ inputs.apk_url }}" || echo DL_FAILED
          timeout 180 adb -s localhost:5555 install -r -t /tmp/qd.apk 2>&1 | tail -2

      - name: Launch and tap agree
        run: |
          timeout 20 adb -s localhost:5555 shell "logcat -c" || true
          timeout 40 adb -s localhost:5555 shell "am start -W -n ${{ inputs.activity }}" 2>&1 | tail -4
          sleep 20
          timeout 30 adb -s localhost:5555 shell uiautomator dump /sdcard/pre.xml >/dev/null 2>&1 || true
          timeout 30 adb -s localhost:5555 pull /sdcard/pre.xml /tmp/pre.xml >/dev/null 2>&1 || true
          echo "--- btnAgree present in pre-tap dump? ---"
          grep -c 'btnAgree' /tmp/pre.xml || echo "0 (grep found none)"
          echo "=== TAP agree @ (539,1605) ==="
          timeout 20 adb -s localhost:5555 shell "input tap 539 1605" || true
          for t in 20 50 90 140; do
            sleep 20
            echo "----- T+${t}s -----"
            timeout 20 adb -s localhost:5555 shell "ps -A | grep -i qidian" 2>&1 || echo "NO_QIDIAN_PROCESS"
            timeout 20 adb -s localhost:5555 shell "dumpsys window 2>/dev/null | grep mCurrentFocus" 2>&1 || true
            timeout 30 adb -s localhost:5555 exec-out screencap -p > /tmp/agree_${t}s.png 2>/dev/null || true
            timeout 30 adb -s localhost:5555 shell uiautomator dump /sdcard/u${t}.xml >/dev/null 2>&1 || true
            timeout 30 adb -s localhost:5555 pull /sdcard/u${t}.xml /tmp/u${t}.xml >/dev/null 2>&1 || true
          done

      - name: Logs and data dir
        if: always()
        run: |
          echo "=== crash buffer ==="
          timeout 30 adb -s localhost:5555 shell "logcat -d -b crash -v time" 2>&1 | tail -60 || true
          echo "=== targeted log ==="
          timeout 40 adb -s localhost:5555 shell "logcat -d -v time" 2>/dev/null | grep -i -E "UnsatisfiedLink|dlopen|miitmdid|pangle|tobEmbed|bytedance|FATAL|AndroidRuntime|QDReader|oaid|OAID" | tail -120 || true
          echo "=== adb root ==="
          timeout 30 adb -s localhost:5555 root 2>&1 || true
          sleep 5
          timeout 30 adb -s localhost:5555 wait-for-device 2>&1 || true
          timeout 20 adb -s localhost:5555 shell "id" 2>&1 || true
          timeout 20 adb -s localhost:5555 shell "ls -la /data/data/com.qidian.QDReader/ 2>&1" || true
          echo "=== files dir ==="
          timeout 20 adb -s localhost:5555 shell "ls -la /data/data/com.qidian.QDReader/files/ 2>&1" || true
          echo "=== native libs present ==="
          timeout 30 adb -s localhost:5555 shell "find /data/data/com.qidian.QDReader -name '*.so' 2>/dev/null | head -40" || true
          echo "=== pangle dir ==="
          timeout 30 adb -s localhost:5555 shell "ls -laR /data/data/com.qidian.QDReader/files/pangle_p 2>&1 | head -30" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redroid-agree-evidence
          path: |
            /tmp/agree_*.png
            /tmp/u*.xml
            /tmp/pre.xml
          if-no-files-found: warn
