name: qd-redroid-agree
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: APK url
        default: https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/qidian_7.9.200.apk
        required: false
      activity:
        description: launcher activity
        default: com.qidian.QDReader/com.qidian.QDReader.ui.activity.SplashActivity
        required: false
      redroid_tag:
        description: redroid tag
        default: 11.0.0-latest
        required: false

jobs:
  agree:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    steps:
      - name: Setup binder and adb
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq linux-modules-extra-$(uname -r) adb curl xz-utils || echo APT_FAILED
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>&1 || echo MODPROBE_FAILED
          lsmod | grep -i binder || true

      - name: Start redroid
        run: |
          sudo docker pull redroid/redroid:${{ inputs.redroid_tag }} 2>&1 | tail -2 || true
          sudo docker rm -f redroid 2>/dev/null || true
          VOLS=""
          for d in binder hwbinder vndbinder; do if [ -e /dev/$d ]; then VOLS="$VOLS -v /dev/$d:/dev/$d"; fi; done
          sudo docker run -d --privileged --name redroid $VOLS -p 5555:5555 \
            redroid/redroid:${{ inputs.redroid_tag }} \
            androidboot.redroid_gpu_mode=guest androidboot.redroid_width=1080 \
            androidboot.redroid_height=2340 androidboot.redroid_dpi=420 \
            androidboot.redroid_adb=5555 || echo DOCKER_FAILED
          sleep 15
          sudo docker ps --format '{{.Names}} {{.Status}}'

      - name: Boot + network probe
        run: |
          adb start-server >/dev/null 2>&1 || true
          adb connect localhost:5555 >/dev/null 2>&1 || true
          for i in $(seq 1 40); do
            B=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "$B" = "1" ]; then echo "booted on try $i"; break; fi
            sleep 8
          done
          echo "=== HOST net ==="
          curl -sS -o /dev/null -w "host->baidu http:%{http_code}\n" --max-time 15 https://www.baidu.com || echo host_net_fail
          echo "=== container routes ==="
          adb -s localhost:5555 shell "cat /proc/net/route" 2>&1 || true
          echo "=== container dns props ==="
          adb -s localhost:5555 shell "getprop | grep -i -E 'dns|net.eth0'" 2>&1 || true
          echo "=== container tcp test ==="
          adb -s localhost:5555 shell "toybox nc -w 5 223.5.5.5 443 < /dev/null && echo TCP_OK_223 || echo TCP_FAIL_223" 2>&1 || true
          adb -s localhost:5555 shell "toybox nc -w 5 www.baidu.com 443 < /dev/null && echo TCP_OK_DNS || echo TCP_FAIL_DNS" 2>&1 || true

      - name: Install apk
        run: |
          curl -sSL --max-time 300 -o /tmp/qd.apk "${{ inputs.apk_url }}" || echo DL_FAILED
          adb -s localhost:5555 install -r -t /tmp/qd.apk 2>&1 | tail -2

      - name: Launch and tap agree
        run: |
          adb -s localhost:5555 shell "logcat -c" || true
          adb -s localhost:5555 shell "am start -W -n ${{ inputs.activity }}" 2>&1 | tail -4
          sleep 20
          echo "=== pre-tap ui (btnAgree expected) ==="
          adb -s localhost:5555 shell uiautomator dump /sdcard/pre.xml >/dev/null 2>&1
          adb -s localhost:5555 pull /sdcard/pre.xml /tmp/pre.xml >/dev/null 2>&1 || true
          grep -o 'resource-id="com.qidian.QDReader:id/btnAgree"[^/]*' /tmp/pre.xml || echo "btnAgree not in pre dump"
          echo "=== TAP 同意并继续 @ (539,1605) ==="
          adb -s localhost:5555 shell "input tap 539 1605" || true
          for t in 15 45 90 150; do
            sleep 15
            echo "----- T+${t}s -----"
            adb -s localhost:5555 shell "ps -A | grep -i qidian" 2>&1 || echo "NO_QIDIAN_PROCESS"
            adb -s localhost:5555 shell "dumpsys window 2>/dev/null | grep mCurrentFocus" 2>&1 || true
            adb -s localhost:5555 exec-out screencap -p > /tmp/agree_${t}s.png 2>/dev/null || true
            adb -s localhost:5555 shell uiautomator dump /sdcard/u${t}.xml >/dev/null 2>&1 || true
            adb -s localhost:5555 pull /sdcard/u${t}.xml /tmp/u${t}.xml >/dev/null 2>&1 || true
          done

      - name: Crash + native + app logs
        if: always()
        run: |
          echo "=== crash buffer ==="
          adb -s localhost:5555 shell "logcat -d -b crash -v time" 2>&1 | tail -80 || true
          echo "=== targeted log ==="
          adb -s localhost:5555 shell "logcat -d -v time" 2>/dev/null | grep -i -E "UnsatisfiedLink|dlopen|miitmdid|pangle|tobEmbed|bytedance|FATAL|AndroidRuntime|QDReader|oaid" | tail -150 || true
          echo "=== root data dir ==="
          adb -s localhost:5555 root >/dev/null 2>&1 || true
          sleep 3
          adb -s localhost:5555 wait-for-device >/dev/null 2>&1 || true
          adb -s localhost:5555 shell "id" 2>&1 || true
          adb -s localhost:5555 shell "ls -la /data/data/com.qidian.QDReader/ 2>&1" || true
          echo "=== files ==="
          adb -s localhost:5555 shell "ls -la /data/data/com.qidian.QDReader/files/ 2>&1" || true
          echo "=== downloaded pangle libs? ==="
          adb -s localhost:5555 shell "find /data/data/com.qidian.QDReader -name '*.so' 2>/dev/null | head -40" || true
          adb -s localhost:5555 shell "ls -laR /data/data/com.qidian.QDReader/files/pangle_p 2>&1 | head -40" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redroid-agree-evidence
          path: |
            /tmp/agree_*.png
            /tmp/u*.xml
            /tmp/pre.xml
          if-no-files-found: warn
