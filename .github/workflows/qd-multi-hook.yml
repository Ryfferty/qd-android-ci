name: qd-multi-hook

# ★★ 一次启动，跑完所有 hook（消除 3 倍启动成本）
#   docker pull → boot → 装 APK → adb root → frida-server → 启动App
#   → 依次挂 3 套 hook（nib / fock / 合并），每套跑 3 分钟
on:
  workflow_dispatch:
    inputs:
      apk_url:
        default: 'https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/qidian_7.9.200.apk'
      per_hook_sec:
        description: 每套 hook 观察秒数
        default: '180'
      image_mode:
        description: 'pull=在线拉 / cache=用 artifact 缓存'
        default: 'pull'

permissions:
  contents: write

jobs:
  multihook:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup binder + adb + frida
        run: |
          sudo apt-get update -qq || true
          # ★★★ 必须装 binder 内核模块并 modprobe，否则 redroid 起不来（boot_completed 永远空）
          sudo apt-get install -y -qq linux-modules-extra-$(uname -r) android-tools-adb python3-pip curl xz-utils unzip || echo APT_PARTIAL
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>&1 || echo MODPROBE_MAYBE_LOADED
          ls -la /dev/binder* 2>/dev/null || echo "no binder dev"
          # frida 17 移除了内置 Java bridge（脚本里 Java 会 ReferenceError），必须锁 16.x
          pip install -q "frida==16.7.19" "frida-tools<14"
          frida --version

      - name: 准备 redroid 镜像（缓存优先）
        run: |
          set +e
          if [ "${{ inputs.image_mode }}" = "cache" ]; then
            echo "=== 尝试从 artifact 恢复镜像 ==="
            AID=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
                  --jq '[.artifacts[] | select(.name=="redroid-image")][0].id' 2>/dev/null)
            echo "artifact id=$AID"
            if [ -n "$AID" ] && [ "$AID" != "null" ]; then
              gh api "repos/${{ github.repository }}/actions/artifacts/$AID/zip" > /tmp/img.zip 2>/dev/null
              unzip -o -q /tmp/img.zip -d /tmp/img 2>/dev/null
              ls -lh /tmp/img/
              sudo docker load -i /tmp/img/*.tar.gz </dev/null 2>&1 | tail -2 || sudo docker load -i /tmp/img/*.tar </dev/null 2>&1 | tail -2
            fi
          fi
          if ! sudo docker images | grep -q redroid; then
            echo "=== 在线拉取 ==="
            time sudo docker pull redroid/redroid:11.0.0-latest 2>&1 | tail -3
          fi
          sudo docker images | grep redroid
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 启动 redroid + 等 boot
        run: |
          sudo docker rm -f redroid 2>/dev/null || true
          VOLS=""
          for d in binder hwbinder vndbinder; do [ -e /dev/$d ] && VOLS="$VOLS -v /dev/$d:/dev/$d"; done
          sudo docker run -d --privileged --name redroid $VOLS -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.redroid_gpu_mode=guest androidboot.redroid_width=1080 \
            androidboot.redroid_height=2340 androidboot.redroid_dpi=420 \
            androidboot.redroid_adb=5555
          sleep 15
          adb start-server >/dev/null 2>&1 || true
          timeout 30 adb connect localhost:5555 || true
          for i in $(seq 1 45); do
            B=$(timeout 15 adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "[$i] boot=$B"
            [ "$B" = "1" ] && { echo BOOT_OK try $i; break; }
            sleep 8
          done
          adb -s localhost:5555 shell getprop ro.product.cpu.abi | tr -d '\r'

      - name: 装 APK + adb root + frida-server + 端口转发
        env:
          QD_SESSION_COOKIES: ${{ secrets.QD_SESSION_COOKIES }}
        run: |
          set +e
          adb devices
          timeout 30 adb connect localhost:5555 || true
          adb -s localhost:5555 shell getprop sys.boot_completed | tr -d '\r'
          mkdir -p dl && cd dl
          for i in 1 2 3 4; do
            curl -sSL --max-time 300 -o qidian.apk "${{ inputs.apk_url }}" || true
            SZ=$(stat -c%s qidian.apk 2>/dev/null || echo 0)
            echo "apk try $i size=$SZ"; [ "$SZ" -gt 10000000 ] && break; sleep 10
          done
          echo "apk=$(stat -c%s qidian.apk)"
          curl -sSL --max-time 600 -o fs.xz https://github.com/frida/frida/releases/download/16.7.19/frida-server-16.7.19-android-arm64.xz
          unxz -f fs.xz && chmod +x fs && ls -lh fs
          echo "=== 装 APK（给足 15 分钟）==="
          timeout 900 adb -s localhost:5555 install -r -t qidian.apk 2>&1 | tail -3
          adb -s localhost:5555 shell pm list packages | grep qidian || echo NOT_INSTALLED
          echo "=== adb root ==="
          adb -s localhost:5555 root 2>&1 | tail -2
          sleep 8
          adb -s localhost:5555 wait-for-device 2>/dev/null || true
          timeout 20 adb -s localhost:5555 shell id | head -2
          echo "=== 推 frida-server ==="
          adb -s localhost:5555 push fs /data/local/tmp/fs
          adb -s localhost:5555 shell chmod 755 /data/local/tmp/fs
          adb -s localhost:5555 shell "setsid /data/local/tmp/fs -D >/dev/null 2>&1 &"
          sleep 12
          adb -s localhost:5555 shell "ps -A -o USER,UID,PID,NAME | grep -w fs" || echo NO_FS_PROC
          echo "=== ★ 写入登录态 sess.json 并 push 进设备（从 Secret，不进仓库）==="
          python3 -c "import os,io; p='/tmp/sess.json'; io.open(p,'w').write(os.environ.get('QD_SESSION_COOKIES','{}'))" 2>/dev/null || printf '%s' "$QD_SESSION_COOKIES" > /tmp/sess.json
          echo "sess.json 大小: $(stat -c%s /tmp/sess.json 2>/dev/null || echo 0)B"
          adb -s localhost:5555 push /tmp/sess.json /data/local/tmp/sess.json || echo PUSH_SESS_FAILED
          adb -s localhost:5555 shell "ls -l /data/local/tmp/sess.json"
          adb -s localhost:5555 shell "chmod 644 /data/local/tmp/sess.json"

          echo "=== push 密文样本（供 hook 主动调 unlock）==="
          curl -sSL --max-time 120 -o blob.bin "https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/blob_903350205.bin" || true
          ls -l blob.bin || true
          adb -s localhost:5555 push blob.bin /data/local/tmp/blob.bin || echo PUSH_BLOB_FAILED
          adb -s localhost:5555 shell "ls -l /data/local/tmp/blob.bin"

          echo "=== 端口转发 ==="
          adb -s localhost:5555 forward tcp:27042 tcp:27042 || true
          adb -s localhost:5555 forward --list
          for i in 1 2 3; do
            frida-ps -H 127.0.0.1:27042 2>&1 | head -5 && break
            sleep 5
          done

      - name: ★ 启动 App（一次）
        run: |
          set +e
          # 清系统全屏弹窗
          adb -s localhost:5555 shell "settings put global policy_control null*" 2>/dev/null
          # 尝试多种拉起方式
          for i in 1 2 3 4 5; do
            adb -s localhost:5555 shell "uiautomator dump /sdcard/d.xml >/dev/null 2>&1"
            adb -s localhost:5555 shell "cat /sdcard/d.xml" 2>/dev/null | tr -d '\r' > /tmp/d.xml
            GOT=$(cat /tmp/d.xml 2>/dev/null | sed 's/></>\n</g' | grep -E 'text="GOT IT"' | grep -oE 'bounds="\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]"' | head -1)
            if [ -n "$GOT" ]; then
              N=$(echo "$GOT" | sed -E 's/bounds="\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]"/\1 \2 \3 \4/')
              set -- $N; adb -s localhost:5555 shell "input tap $(( ($1+$3)/2 )) $(( ($2+$4)/2 ))" && echo "清了 GOT IT"
            else break; fi
            sleep 3
          done
          echo "=== 动态解析主 Activity ==="
          A=$(adb -s localhost:5555 shell "cmd package resolve-activity --brief -c android.intent.category.LAUNCHER com.qidian.QDReader" 2>/dev/null | tr -d '\r' | tail -1)
          echo "主 Activity: $A"
          if [ -n "$A" ] && [ "$A" != "No activity found" ]; then
            adb -s localhost:5555 shell "am start -W -n $A" 2>&1 | tail -3
          else
            echo ">>> resolve 失败，改用 monkey 兜底"
            adb -s localhost:5555 shell "monkey -p com.qidian.QDReader -c android.intent.category.LAUNCHER 1" 2>&1 | tail -3
          fi
          sleep 20
          echo "=== 点掉可能的系统弹窗/隐私弹窗 ==="
          for k in 1 2 3 4 5 6; do
            adb -s localhost:5555 shell "uiautomator dump /sdcard/w.xml >/dev/null 2>&1"
            adb -s localhost:5555 shell "cat /sdcard/w.xml" 2>/dev/null | tr -d '\r' > /tmp/w.xml
            GOT=$(cat /tmp/w.xml | sed 's/></>\n</g' | grep -oE 'text="(GOT IT|同意并继续|同意|允许|我知道了)"[^>]*bounds="\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]"' | head -1)
            if [ -n "$GOT" ]; then
              N=$(echo "$GOT" | grep -oE 'bounds="\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]"' | sed -E 's/bounds="\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]"/\1 \2 \3 \4/')
              set -- $N
              echo "  点击: $(echo $GOT | grep -oE 'text="[^"]*"') 中心 $(( ($1+$3)/2 )),$(( ($2+$4)/2 ))"
              adb -s localhost:5555 shell "input tap $(( ($1+$3)/2 )) $(( ($2+$4)/2 ))"
              sleep 4
            else
              echo "  无弹窗（第 $k 轮）"; break
            fi
          done
          echo "=== ★ GuidanceActivity 引导页：dump 全部可点节点 ==="
          adb -s localhost:5555 shell "uiautomator dump /sdcard/g.xml >/dev/null 2>&1"
          adb -s localhost:5555 shell "cat /sdcard/g.xml" 2>/dev/null | tr -d '\r' > /tmp/g.xml
          echo "--- 可点节点 ---"
          cat /tmp/g.xml | sed 's/></>\n</g' | grep -oE '(text|content-desc)="[^"]+"[^>]*bounds="\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]"' 
          for W in 跳过 随便看看 暂不登录 以后再说 我知道了 暂不 关闭 取消; do
            L=$(cat /tmp/g.xml | sed 's/></>\n</g' | grep -E "text=\"$W\"|content-desc=\"$W\"" | grep -oE 'bounds="\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]"' | head -1)
            if [ -n "$L" ]; then
              N=$(echo "$L" | sed -E 's/bounds="\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]"/\1 \2 \3 \4/'); set -- $N
              echo "  点「$W」→ $(( ($1+$3)/2 )),$(( ($2+$4)/2 ))"
              adb -s localhost:5555 shell "input tap $(( ($1+$3)/2 )) $(( ($2+$4)/2 ))"; sleep 4
            fi
          done
          echo "=== 等 App 过启动页（轮询 splash_layout 消失）==="
          for k in $(seq 1 40); do
            adb -s localhost:5555 shell "uiautomator dump /sdcard/w.xml >/dev/null 2>&1"
            adb -s localhost:5555 shell "cat /sdcard/w.xml" 2>/dev/null | tr -d '\r' > /tmp/w.xml
            if grep -q "splash_layout" /tmp/w.xml; then echo "  [$k] 还在启动页"; sleep 6
            else echo "  [$k] ★ 已离开启动页"; break; fi
          done
          adb -s localhost:5555 shell "dumpsys activity activities | grep ResumedActivity" | tr -d '\r'
          echo "=== 当前进程 ==="
          adb -s localhost:5555 shell "ps -A -o PID,NAME | grep -i qidian" | tr -d '\r'
          echo "(深链不在这里发 —— 改到每套 hook 挂载后触发，否则 hook 还没挂上就解完密了)"

      - name: ★ prep-pool（发 VIP 深链 → 提 MMKV pool → push params.json）
        run: |
          set +e
          B=localhost:5555
          echo "=== ① 发 VIP 深链（逼 App 取 key pool 并写 MMKV）==="
          for DL in 'QDReader://OpenBook/1040025277/794290252' \
                    'QDReader://OpenBook/1040025277/794290414' \
                    'QDReader://OpenBook/1040025277/790923799'; do
            echo "  deeplink $DL"
            timeout 40 adb -s $B shell "am start -a android.intent.action.VIEW -d '$DL'" 2>&1 | tail -1
            sleep 12
          done
          echo "=== ② UI 驱动（逼 App 活动）==="
          for xy in "135 2225" "405 2225" "675 2225" "945 2225" "540 1200"; do
            set -- $xy
            timeout 20 adb -s $B shell "input tap $1 $2" 2>&1 | tail -0
            sleep 3
          done
          sleep 15
          echo "=== ③ 提取 MMKV pool + beacon qimei36 ==="
          MMKV=/data/data/com.qidian.QDReader/files/mmkv/pref_utils
          DB1=/data/data/com.qidian.QDReader/databases/beacon_db_com.qidian.QDReader
          timeout 30 adb -s $B shell "ls -l /data/data/com.qidian.QDReader/files/mmkv/" | head -8
          timeout 40 adb -s $B shell "su 0 cp $MMKV /sdcard/pref_utils 2>/dev/null || cp $MMKV /sdcard/pref_utils" || true
          timeout 60 adb -s $B pull /sdcard/pref_utils /tmp/pref_utils 2>&1 | tail -1
          timeout 40 adb -s $B shell "su 0 cp $DB1 /sdcard/beacon_db 2>/dev/null || cp $DB1 /sdcard/beacon_db" || true
          timeout 60 adb -s $B pull /sdcard/beacon_db /tmp/beacon_db 2>&1 | tail -1
          python3 - <<'PYEX' || true
          import re, json, os
          params = {}
          try:
              d = open('/tmp/pref_utils','rb').read()
              i = d.find(b'pref_fock_key')
              print('pref_utils=%dB  pref_fock_key idx=%d' % (len(d), i))
              if i >= 0:
                  m = re.search(rb'[A-Za-z0-9+/]{100,}={0,2}', d[i:])
                  if m:
                      params['pool_b64'] = m.group().decode('ascii','replace')
                      print('★ POOL len=%d head=%s' % (len(params['pool_b64']), params['pool_b64'][:60]))
          except Exception as e:
              print('mmkv err', e)
          try:
              b = open('/tmp/beacon_db','rb').read()
              for mm in re.finditer(b'qimei36', b):
                  if mm.end()+3 <= len(b) and b[mm.end()] == 0x74:
                      ln = (b[mm.end()+1] << 8) | b[mm.end()+2]
                      if ln == 36:
                          v = b[mm.end()+3:mm.end()+3+36].decode('ascii','replace')
                          if all(c in '0123456789abcdef' for c in v):
                              params['qimei36'] = v; print('★ QIMEI36=%s' % v); break
          except Exception as e:
              print('beacon err', e)
          open('/tmp/params.json','w').write(json.dumps(params))
          print('params keys=%s' % list(params.keys()))
          PYEX
          timeout 40 adb -s $B push /tmp/params.json /data/local/tmp/params.json 2>&1 | tail -1
          timeout 20 adb -s $B shell "ls -l /data/local/tmp/params.json"

      - name: ★★ 依次挂 3 套 hook
        run: |
          set +e
          mkdir -p out
          for H in hook_v24_webview hook_v23_pool hook_v16_inject_session; do
            echo "########## 挂载 $H ##########"
            curl -sSL -o "out/$H.js" "https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/$H.js"
            [ -s "out/$H.js" ] || { echo "下载失败 $H"; continue; }
            H="$H" SEC="${{ inputs.per_hook_sec }}" python3 - <<'PY'
          import frida, time, json, os, sys, subprocess

          def sh(cmd, t=30):
              try:
                  return subprocess.check_output(cmd, stderr=subprocess.DEVNULL, timeout=t).decode().strip()
              except Exception:
                  return ''

          def ensure_system():
              """system_server 偶发崩溃会带走所有 app；先确认系统服务在"""
              for _ in range(20):
                  r = sh(['adb','-s','localhost:5555','shell','service','check','activity'], 20)
                  if 'found' in r:
                      return True
                  time.sleep(4)
              return False

          def ensure_app():
              """确保 App 进程存在，不在就拉起（含点隐私弹窗）"""
              for attempt in range(6):
                  o = sh(['adb','-s','localhost:5555','shell','pidof','com.qidian.QDReader'], 20)
                  if o:
                      return int(o.split()[0])
                  print(f'  [ensure_app] 第{attempt+1}次拉起 App', flush=True)
                  A = sh(['adb','-s','localhost:5555','shell','cmd','package','resolve-activity',
                          '--brief','-c','android.intent.category.LAUNCHER','com.qidian.QDReader'], 25)
                  A = A.splitlines()[-1].strip() if A else ''
                  if A and 'No activity found' not in A:
                      sh(['adb','-s','localhost:5555','shell','am','start','-n',A], 40)
                  else:
                      sh(['adb','-s','localhost:5555','shell','monkey','-p','com.qidian.QDReader',
                          '-c','android.intent.category.LAUNCHER','1'], 40)
                  time.sleep(10)
                  # 点掉隐私/系统弹窗
                  for _k in range(4):
                      sh(['adb','-s','localhost:5555','shell','uiautomator','dump','/sdcard/w.xml'], 30)
                      x = sh(['adb','-s','localhost:5555','shell','cat','/sdcard/w.xml'], 30)
                      if '同意并继续' in x:
                          sh(['adb','-s','localhost:5555','shell','input','tap','538','1605'], 20)
                          time.sleep(5)
                      elif 'GOT IT' in x:
                          sh(['adb','-s','localhost:5555','shell','input','tap','859','527'], 20)
                          time.sleep(3)
                      else:
                          break
                  time.sleep(8)
              return None

          hname = os.environ['H']; secs = int(os.environ.get('SEC','180'))
          print(f'[{hname}] 检查系统服务…', flush=True)
          if not ensure_system():
              print(f'[{hname}] ✗ system_server 一直不在，跳过', flush=True)
              open(f'out/{hname}.txt','w').write('SYSTEM_SERVER_DOWN'); sys.exit(0)
          print(f'[{hname}] 确保 App 在跑…', flush=True)
          ensure_app()
          dev = frida.get_device_manager().add_remote_device('127.0.0.1:27042')
          # ★ 用 adb pidof 拿 pid（frida 的 p.name 是应用显示名如「起点读书」，不是包名，
          #   所以按包名过滤 enumerate_processes() 恒为 None）
          pid = None
          for attempt in range(20):
              if attempt in (5, 10, 15):
                  print(f'[{hname}] 第{attempt}轮仍无 pid → 重新拉起 App', flush=True)
                  ensure_app()
              try:
                  o = subprocess.check_output(['adb','-s','localhost:5555','shell','pidof','com.qidian.QDReader'],
                                              stderr=subprocess.DEVNULL, timeout=15).decode().strip()
                  if o:
                      pid = int(o.split()[0]); print(f'[{hname}] adb pidof -> {pid}', flush=True); break
              except Exception as e:
                  pass
              # 兜底：遍历 frida 进程表，按 应用名/包名 双向匹配
              try:
                  for p in dev.enumerate_processes():
                      nm = (p.name or '').lower()
                      if 'qidian' in nm or 'qdreader' in nm or '起点' in (p.name or ''):
                          pid = p.pid; print(f'[{hname}] frida enum -> {p.name} {pid}', flush=True); break
              except Exception as e:
                  print(f'[{hname}] enum err {e}', flush=True)
              if pid: break
              time.sleep(3)
          print(f'[{hname}] pid={pid}', flush=True)
          if not pid:
              # 打印设备进程表帮助诊断
              try:
                  print('--- 设备进程(前40) ---', flush=True)
                  print(subprocess.check_output(['adb','-s','localhost:5555','shell','ps -A -o PID,NAME'],
                        timeout=15).decode()[:2000], flush=True)
                  print('--- frida 进程表(前40) ---', flush=True)
                  print([str(p) for p in dev.enumerate_processes()][:40], flush=True)
              except Exception as e: print('diag err', e, flush=True)
              open(f'out/{hname}.txt','w').write('APP_NOT_RUNNING'); sys.exit(0)
          sess = dev.attach(pid); msgs = []
          def on_msg(m, d):
              if m['type'] == 'send':
                  line = json.dumps(m['payload'], ensure_ascii=False)
                  msgs.append(line); print('[JS]', line[:400], flush=True)
              else: print('[ERR]', str(m)[:150], flush=True)
          sc2 = None
          sc = sess.create_script(open(f'out/{hname}.js').read())
          sc.on('message', on_msg); sc.load()
          print(f'[{hname}] script loaded', flush=True)
          time.sleep(3)
          print(f'[{hname}] 当前消息数={len(msgs)}', flush=True)

          # ★★★ 关键：会话注入类脚本 → 注入完成后【重启 App】让它带登录态重新初始化
          if 'inject_session' in hname:
              print(f'[{hname}] cookie 已注入，等待 flush 到磁盘…', flush=True)
              time.sleep(25)
              print(f'[{hname}] >>> force-stop App（让 cookie 落盘并触发重新初始化）', flush=True)
              subprocess.call(['adb','-s','localhost:5555','shell','am','force-stop','com.qidian.QDReader'],
                              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=30)
              time.sleep(6)
              A = sh(['adb','-s','localhost:5555','shell','cmd','package','resolve-activity',
                      '--brief','-c','android.intent.category.LAUNCHER','com.qidian.QDReader'], 25)
              A = A.splitlines()[-1].strip() if A else ''
              print(f'[{hname}] 重启 App ({A})', flush=True)
              if A and 'No activity found' not in A:
                  sh(['adb','-s','localhost:5555','shell','am','start','-n',A], 40)
              else:
                  sh(['adb','-s','localhost:5555','shell','monkey','-p','com.qidian.QDReader',
                      '-c','android.intent.category.LAUNCHER','1'], 40)
              time.sleep(15)
              # 点掉隐私弹窗
              for _k in range(4):
                  sh(['adb','-s','localhost:5555','shell','uiautomator','dump','/sdcard/w.xml'], 30)
                  xx = sh(['adb','-s','localhost:5555','shell','cat','/sdcard/w.xml'], 30)
                  if '同意并继续' in xx:
                      sh(['adb','-s','localhost:5555','shell','input','tap','538','1605'], 20); time.sleep(5)
                  elif 'GOT IT' in xx:
                      sh(['adb','-s','localhost:5555','shell','input','tap','859','527'], 20); time.sleep(3)
                  else: break
              # ★ 用新 pid 再挂一遍同一个脚本（cookie 持久化 + okhttp hook 重新生效）
              np = sh(['adb','-s','localhost:5555','shell','pidof','com.qidian.QDReader'], 20)
              if np:
                  npid = int(np.split()[0])
                  print(f'[{hname}] 重新 attach pid={npid}（再注入一次）', flush=True)
                  try:
                      sess.detach()
                  except Exception:
                      pass
                  try:
                      sess2 = dev.attach(npid)
                      sc2 = sess2.create_script(open(f'out/{hname}.js').read())
                      sc2.on('message', on_msg); sc2.load()
                      sess = sess2
                      print(f'[{hname}] 第二次注入完成', flush=True)
                      time.sleep(10)
                  except Exception as e:
                      print(f'[{hname}] 二次 attach 失败 {e}', flush=True)

          # 清 logcat，便于定位崩溃
          sh(['adb','-s','localhost:5555','shell','logcat','-c'], 25)
          sh(['adb','-s','localhost:5555','shell','logcat','-b','crash','-c'], 25)

          # ★ 发深链（触发正文解密）—— 多格式，含 App Links 的 http 形式
          DLS = [
              'QDReader://OpenBook/1040025277/794290252',   # VIP 章（逼 App 取 key pool + 写 MMKV）
              'QDReader://OpenBook/1040025277/794290414',
              'QDReader://OpenBook/1040025277/790923799',
              'QDReader://OpenBook/1049120379/903350205',   # 免费章对照
          ]
          for dl in DLS:
              before = sh(['adb','-s','localhost:5555','shell','pidof','com.qidian.QDReader'], 20)
              print(f'[{hname}] >>> deeplink {dl}  (pid_before={before or "NONE"})', flush=True)
              out = subprocess.run(['adb','-s','localhost:5555','shell','am','start','-a',
                                    'android.intent.action.VIEW','-d',dl],
                                   capture_output=True, text=True, timeout=40)
              print(f'[{hname}]     am start -> {(out.stdout or out.stderr or "").strip()[:160]}', flush=True)
              time.sleep(10)
              after = sh(['adb','-s','localhost:5555','shell','pidof','com.qidian.QDReader'], 20)
              print(f'[{hname}]     pid_after={after or "NONE"}', flush=True)
              if before and after and before != after:
                  print(f'[{hname}] ★★★ App 崩溃重启了！({before} → {after}) 抓崩溃日志', flush=True)
                  cr = sh(['adb','-s','localhost:5555','shell','logcat','-d','-b','crash','-t','120'], 40)
                  for line in cr.splitlines():
                      if any(k in line for k in ['FATAL', 'AndroidRuntime', 'Caused by', 'com.qidian', 'frida', 'art::']):
                          print(f'[{hname}]   CRASH| {line.strip()[:180]}', flush=True)
                  # 也抓主日志里 App 的最后若干行
                  mn = sh(['adb','-s','localhost:5555','shell','logcat','-d','-t','200'], 40)
                  for line in mn.splitlines()[-60:]:
                      if 'qidian' in line.lower() or 'FATAL' in line or 'DEBUG' in line:
                          print(f'[{hname}]   LOG| {line.strip()[:170]}', flush=True)
              # ★ 触发 v15 类脚本的主动解密（recv 驱动）
              try:
                  _act = sc2 if sc2 is not None else sc
                  _act.post({'cmd': 'go'})
                  print(f'[{hname}] 已 post go 指令', flush=True)
              except Exception as e:
                  print(f'[{hname}] post go 失败 {e}', flush=True)
              act = sh(['adb','-s','localhost:5555','shell','dumpsys','activity','activities'], 30)
              for line in act.splitlines():
                  if 'ResumedActivity' in line:
                      print(f'[{hname}]     当前 {line.strip()[:120]}', flush=True)
                      break
              # 崩了就重拉，让下一个深链能继续试
              if not sh(['adb','-s','localhost:5555','shell','pidof','com.qidian.QDReader'], 20):
                  ensure_app()
          # ★ UI 驱动：点底部导航 + 滑动，逼 App 发请求 / 创建 FockUtil
          print(f'[{hname}] UI 驱动开始（点底部导航栏）', flush=True)
          for (x, y, tag) in [(135, 2225, '书城'), (405, 2225, '书架'), (675, 2225, '发现'),
                              (945, 2225, '我的'), (540, 1200, '中央'), (540, 800, '上部')]:
              try:
                  subprocess.call(['adb','-s','localhost:5555','shell','input','tap',str(x),str(y)],
                                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=20)
                  print(f'[{hname}]   tap {tag} ({x},{y})', flush=True)
                  time.sleep(3)
              except Exception: pass
          for k in range(3):
              try:
                  subprocess.call(['adb','-s','localhost:5555','shell','input','swipe','540','1800','540','900','300'],
                                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=20)
                  time.sleep(2)
              except Exception: pass
          # dump 当前页面看在哪
          try:
              sh(['adb','-s','localhost:5555','shell','uiautomator','dump','/sdcard/u.xml'], 30)
              ux = sh(['adb','-s','localhost:5555','shell','cat','/sdcard/u.xml'], 30)
              import re as _re
              txts = _re.findall(r'text="([^"]{2,20})"', ux)[:20]
              print(f'[{hname}] 页面文字: {txts}', flush=True)
              for line in ux.split('</'):
                  if 'ResumedActivity' in line: pass
          except Exception as e:
              print(f'[{hname}] dump 失败 {e}', flush=True)
          act2 = sh(['adb','-s','localhost:5555','shell','dumpsys','activity','activities'], 30)
          for line in act2.splitlines():
              if 'ResumedActivity' in line:
                  print(f'[{hname}] UI驱动后 {line.strip()[:120]}', flush=True)
                  break
          # ★★★ 抓取 UI dump 的全文（WebView 渲染的章节正文就在里面）
          try:
              import re as _re2, os as _os2
              full = []
              for _k in range(4):
                  sh(['adb','-s','localhost:5555','shell','uiautomator','dump','/sdcard/u.xml'], 40)
                  ux = sh(['adb','-s','localhost:5555','shell','cat','/sdcard/u.xml'], 40)
                  txts = _re2.findall(r'text="([^"]+)"', ux)
                  # 只要像正文的（长中文行）
                  body = [t for t in txts if len(t) > 12 and _re2.search(r'[\u4e00-\u9fff]', t)]
                  if len(body) > len(full):
                      full = body
                  if len(full) >= 12:
                      break
                  time.sleep(5)
              _os2.makedirs('out', exist_ok=True)
              with open('out/UI_TEXT_%s.txt' % hname, 'w') as f:
                  f.write('\n'.join(full))
              total_cn = sum(len(t) for t in full)
              print(f'[{hname}] ★★ UI dump 正文行数={len(full)} 中文字数={total_cn}', flush=True)
              for line in full[:12]:
                  print(f'[{hname}]   正文| {line[:90]}', flush=True)
          except Exception as e:
              print(f'[{hname}] UI 正文提取失败 {e}', flush=True)
          for i in range(max(1, secs // 5)):
              time.sleep(5)
              if i % 6 == 0: print(f'[{hname}] alive t+{i*5}s msgs={len(msgs)}', flush=True)
              # 每 60 秒确认 App 还在；不在就重拉并重发深链
              if i > 0 and i % 12 == 0:
                  o = sh(['adb','-s','localhost:5555','shell','pidof','com.qidian.QDReader'], 20)
                  if not o:
                      print(f'[{hname}] App 掉了 → 重拉', flush=True)
                      ensure_app()
                  p2 = o.split()[0] if o else ''
                  if not p2:
                      continue
                  print(f'[{hname}] 重发深链 (pid={p2})', flush=True)
                  sh(['adb','-s','localhost:5555','shell','am','start','-a','android.intent.action.VIEW',
                      '-d','QDReader://OpenBook/1049120379/903350205'], 30)
          open(f'out/{hname}.txt','w').write('\n'.join(msgs))
          print(f'[{hname}] 完成 {len(msgs)} 条', flush=True)
          try: sess.detach()
          except Exception: pass
          PY
            echo "########## $H 结束 ##########"
            sleep 5
          done
          echo "=== 汇总 ==="
          for f in out/*.txt; do echo "--- $f ($(wc -l < $f) 行) ---"; done

      - name: 上传全部结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multihook-out
          path: out/
          if-no-files-found: warn

      - name: ★ commit 进仓库
        if: always()
        run: |
          set +e
          mkdir -p results && TS=$(date -u +%Y%m%d_%H%M%S)
          for f in out/*.txt; do
            [ -s "$f" ] || continue
            B=$(basename "$f" .txt)
            {
              echo "# App hook 结果 $B @ $TS"; echo ""
              echo "## 关键行"; echo '```'
              grep -E "★★★|★ mmr|★ Fock|MEM |lk\\(\\)|hav\\(\\)|status=|明文|addedKeyVersions|FockUtil" "$f" | head -80
              echo '```'; echo ""
              echo "## 统计"; echo "- 总行数: $(wc -l < $f)"
              echo "- lk 调用: $(grep -c 'lk()' $f)"
              echo "- Fock.unlock: $(grep -c 'Fock.unlock' $f)"
              echo "- 内存命中: $(grep -c 'MEM ' $f)"
            } > "results/${B}_${TS}.md"
            cp "$f" "results/${B}_${TS}.txt"
          done
          git config user.email "ci@local"; git config user.name "ci"
          git add -f results/
          git commit -q -m "ci: multi-hook results $TS" && echo committed || echo "nothing to commit"
          git pull -q --rebase origin HEAD 2>/dev/null || true
          git push -q origin HEAD 2>&1 && echo pushed || { git push -q origin HEAD 2>&1 | tail -2; echo PUSH_FAILED; }
