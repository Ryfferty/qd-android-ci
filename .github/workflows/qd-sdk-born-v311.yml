name: qd-sdk-born-v311
# v300: redroid随机设备 + 起点App首启 + 扫码页截图(上传) + hook抓登录会话 → SDK通道出生
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sdkborn:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: redroid boot + random device + install 464
        run: |
          set +e
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq linux-modules-extra-$(uname -r) adb curl xz-utils unzip python3-pip || echo APT_PARTIAL
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>&1 || echo MODPROBE_MAYBE
          sudo docker rm -f redroid 2>/dev/null || true
          VOLS=""
          for d in binder hwbinder vndbinder; do [ -e /dev/$d ] && VOLS="$VOLS -v /dev/$d:/dev/$d"; done
          sudo docker run -d --privileged --name redroid $VOLS -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.redroid_width=1080 androidboot.redroid_height=2340 androidboot.redroid_dpi=420 \
            androidboot.redroid_gpu_mode=guest 2>&1 | tail -1
          B=localhost:5555
          adb start-server >/dev/null 2>&1; sleep 5
          for i in $(seq 1 30); do adb connect $B >/dev/null 2>&1; S=$(timeout 8 adb -s $B shell getprop sys.boot_completed 2>/dev/null | tr -d '\r'); [ "$S" = "1" ] && break; sleep 6; done
          echo "boot=$(timeout 8 adb -s $B shell getprop sys.boot_completed | tr -d '\r')"
          # ★随机设备指纹
          RANDSER=$(printf '%08x' $((RANDOM*RANDOM)))
          RANDIMEI=$(python3 -c "import random; print('%015d'%random.randint(10**14,10**15-1))")
          RANDAID=$(python3 -c "import random; print('%016x'%random.getrandbits(64))")
          RANDSER2=$(python3 -c "import random; print('QD%08x'%random.getrandbits(32))")
          timeout 20 adb -s $B root >/dev/null 2>&1; sleep 3
          for i in $(seq 1 8); do
            IDOUT=$(timeout 6 adb -s $B shell id 2>/dev/null | tr -d "\r")
            if echo "$IDOUT" | grep -q "uid=0"; then break; fi
            adb disconnect $B >/dev/null 2>&1; sleep 1; adb connect $B >/dev/null 2>&1; sleep 3
          done
          timeout 20 adb -s $B shell "setenforce 0" 2>/dev/null
          timeout 20 adb -s $B shell "settings put secure android_id $RANDAID" 2>/dev/null
          echo "device: imei=$RANDIMEI aid=$RANDAID ser=$RANDSER2"
          # ★写build.prop式设备随机(serial/imei靠root改不到的部分用oem hook跳过 — 首要靠android_id+serialno)
          echo "RANDINFO_IMEI=$RANDIMEI" >> $GITHUB_ENV
          echo "RANDINFO_AID=$RANDAID" >> $GITHUB_ENV
          # 装464
          for i in 1 2 3; do curl -sSL --max-time 1200 -o q464.apk "https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/qidian_7.9.464.apk" && [ $(stat -c%s q464.apk) -gt 100000000 ] && break; sleep 10; done
          timeout 300 adb -s $B push q464.apk /data/local/tmp/q464.apk >/dev/null 2>&1
          timeout 300 adb -s $B shell "pm install -r -d -t --user 0 /data/local/tmp/q464.apk" 2>&1 | tail -1
          bash write_consent.sh 2>&1 | tail -2

      - name: first launch + QQ login + scan mode
        run: |
          B=localhost:5555
          cat > /tmp/findbtn.py <<'PYX'
          import re,sys
          t=open('/tmp/u2.xml').read()
          kw=sys.argv[1]
          pat=r'(?:(?:text|resource-id)="[^"]*'+kw+r'[^"]*")[^>]*bounds="\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]"'
          m=re.search(pat,t)
          if m:
              x1,y1,x2,y2=map(int,m.groups())
              print('%d,%d'%((x1+x2)//2,(y1+y2)//2))
          PYX
          cat > /tmp/findicon.py <<'PYX3'
          import re
          try:
              t=open('/tmp/u2.xml').read()
              # privacyLayout里的ImageView(勾选图标)
              m=re.search(r'privacyLayout[^>]*bounds="\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]"',t)
              if m:
                  x1,y1,x2,y2=map(int,m.groups())
                  # icon在区域左侧: 相对位置约(84-0)/(1080-0)=7.8%宽, 高度中间
                  ix=x1+int((x2-x1)*0.078)
                  iy=(y1+y2)//2
                  # 更精确: 找privacyLayout附近的ImageView bounds
                  m2=re.search(r'ImageView[^>]*bounds="\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]"[^>]*(?:/?)>(?:<node[^>]*text="我已阅读)',t)
                  if m2:
                      a,b,c,d=map(int,m2.groups())
                      print('%d,%d'%((a+c)//2,(b+d)//2))
                  else:
                      # 找所有小ImageView(y在privacyLayout范围)
                      for mm in re.finditer(r'ImageView[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"',t):
                          a,b,c,d=map(int,mm.groups())
                          if y1-50<b<y2 and (c-a)<80 and (d-b)<80 and a<x1+200:
                              print('%d,%d'%((a+c)//2,(b+d)//2))
                              break
          except: pass
          PYX3
          cat > /tmp/findchk.py <<'PYX2'
          import re
          try:
              t=open('/tmp/u2.xml').read()
              for pat in (r'checkable="true"[^>]*bounds="\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]"',
                          r'com.qidian.QDReader:id/[a-zA-Z_]*(?:check|cb|agree|protocol)[a-zA-Z_]*[^>]*bounds="\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]"'):
                  m=re.search(pat,t)
                  if m:
                      g=m.groups()
                      if len(g)==4:
                          x1,y1,x2,y2=map(int,g)
                      else:
                          x1,y1,x2,y2=map(int,g[-4:])
                      print('%d,%d'%((x1+x2)//2,(y1+y2)//2))
                      break
          except: pass
          PYX2
          timeout 20 adb -s $B shell "am start -n com.qidian.QDReader/.ui.activity.SplashActivity" >/dev/null 2>&1
          sleep 25
          for i in $(seq 1 12); do
            timeout 15 adb -s $B shell "uiautomator dump /sdcard/u.xml >/dev/null 2>&1"
            timeout 20 adb -s $B shell "cat /sdcard/u.xml" 2>/dev/null | tr -d '\r' > /tmp/u2.xml
            for ID in btnAgree upgrade_dialog_close_btn btn_negative tvSkip; do
              C=$(python3 /tmp/findbtn.py "id/$ID" 2>/dev/null || true)
              if [ -n "$C" ]; then timeout 10 adb -s $B shell "input tap $C" >/dev/null 2>&1; sleep 2; fi
            done
            QQB=$(python3 /tmp/findbtn.py "QQ登录" 2>/dev/null || true)
            [ -n "$QQB" ] && echo "QQ_LOGIN_POS=$QQB" && break
            sleep 3
          done
          # ★存登录页布局(供离线分析)
          cp /tmp/u2.xml login_dump.xml 2>/dev/null || true
          # ★★★checkbox多点位测试(84-126范围)+验证图标切换
          for CBTRY in "105,1949" "95,1949" "115,1949" "90,1960" "120,1935" "105,1960"; do
            echo "try_checkbox=$CBTRY"
            timeout 10 adb -s $B shell "input tap $CBTRY" >/dev/null 2>&1; sleep 2
            # 验证: dump看checkImg(勾选后的资源名!)
            timeout 15 adb -s $B shell "uiautomator dump /sdcard/u.xml >/dev/null 2>&1"
            timeout 20 adb -s $B shell "cat /sdcard/u.xml" 2>/dev/null | tr -d '\r' > /tmp/u2.xml
            if grep -q 'checkImg' /tmp/u2.xml; then
              echo "★★★CHECKED! at $CBTRY"
              echo "CBOK=$CBTRY" >> /tmp/cb_ok.txt
              break
            fi
          done
          # 检查是否勾上(没勾则试long press)
          if ! grep -q 'checkImg' /tmp/u2.xml 2>/dev/null; then
            echo "点6点未勾 — 试long press和swipe"
            timeout 10 adb -s $B shell "input swipe 105 1949 105 1949 800" >/dev/null 2>&1; sleep 2
            timeout 15 adb -s $B shell "uiautomator dump /sdcard/u.xml >/dev/null 2>&1"
            timeout 20 adb -s $B shell "cat /sdcard/u.xml" 2>/dev/null | tr -d '\r' > /tmp/u2.xml
            grep -q 'checkImg' /tmp/u2.xml && echo "★longpress勾上!" || echo "longpress也没勾"
          fi
          # 最新页面状态存回login_dump(供后续)
          cp /tmp/u2.xml login_dump.xml 2>/dev/null || true
          # 验证(QQ登录按钮还在=没跳协议页)
          timeout 15 adb -s $B shell "uiautomator dump /sdcard/u.xml >/dev/null 2>&1"
          timeout 20 adb -s $B shell "cat /sdcard/u.xml" 2>/dev/null | tr -d '\r' > /tmp/u2.xml
          cp /tmp/u2.xml afterqq_dump.xml 2>/dev/null || true
          STILLQQ=$(grep -c 'QQ登录' /tmp/u2.xml 2>/dev/null || echo 0)
          echo "qq_still_visible=$STILLQQ"
          if [ "$STILLQQ" = "0" ]; then
            # 跳走了: back回来重试一次
            timeout 10 adb -s $B shell "input keyevent 4" >/dev/null 2>&1; sleep 3
            timeout 15 adb -s $B shell "uiautomator dump /sdcard/u.xml >/dev/null 2>&1"
            timeout 20 adb -s $B shell "cat /sdcard/u.xml" 2>/dev/null | tr -d '\r' > /tmp/u2.xml
            timeout 10 adb -s $B shell "input tap $CBPOS" >/dev/null 2>&1; sleep 2
          fi

          # ★★点QQ登录按钮
          QQB=$(python3 /tmp/findbtn.py "QQ登录" 2>/dev/null || true)
          if [ -n "$QQB" ]; then
            echo "tap_qq=$QQB"
            timeout 10 adb -s $B shell "input tap $QQB" >/dev/null 2>&1
            sleep 12
          else
            echo "NO_QQ_POS!"
          fi
          # ★处理新人礼包弹窗(关闭它: 点X或空白处)
          timeout 15 adb -s $B shell "uiautomator dump /sdcard/u.xml >/dev/null 2>&1"
          timeout 20 adb -s $B shell "cat /sdcard/u.xml" 2>/dev/null | tr -d '\r' > /tmp/u2.xml
          if grep -q "新人大礼包\|立即领取" /tmp/u2.xml; then
            echo "检测到新人礼包弹窗 — 关闭"
            # 关闭按钮(通常在弹窗下方中心或右上)
            XC=$(python3 /tmp/findbtn.py "关闭" 2>/dev/null || true)
            if [ -n "$XC" ]; then
              timeout 10 adb -s $B shell "input tap $XC" >/dev/null 2>&1
            else
              # 点弹窗外的遮罩区(下方)
              timeout 10 adb -s $B shell "input tap 540 2200" >/dev/null 2>&1
            fi
            sleep 3
          fi
          # ★QQ登录可能失败(无QQ客户端)→回到登录页→点ivMore(更多登录方式)
          timeout 15 adb -s $B shell "uiautomator dump /sdcard/u.xml >/dev/null 2>&1"
          timeout 20 adb -s $B shell "cat /sdcard/u.xml" 2>/dev/null | tr -d '\r' > /tmp/u2.xml
          cp /tmp/u2.xml afterqq_dump.xml 2>/dev/null || true
          HASQQ=$(grep -c 'QQ登录' /tmp/u2.xml)
          echo "login_page_visible=$HASQQ"
          if [ "$HASQQ" != "0" ]; then
            # 点ivMore(更多登录方式 中心713,1765)
            echo "tap_ivMore=713,1765"
            timeout 10 adb -s $B shell "input tap 713 1765" >/dev/null 2>&1
            sleep 8
            # dump看展开的登录方式
            timeout 15 adb -s $B shell "uiautomator dump /sdcard/u.xml >/dev/null 2>&1"
            timeout 20 adb -s $B shell "cat /sdcard/u.xml" 2>/dev/null | tr -d '\r' > /tmp/u2.xml
            grep -o 'text="[^"]*"' /tmp/u2.xml | grep -v 'text=""' | head -25 > /tmp/morelogin.txt
            echo "== 更多登录方式 =="
            cat /tmp/morelogin.txt
          fi
          # ★找"扫码登录"入口并点击
          SCANB=$(python3 /tmp/findbtn.py "扫码" 2>/dev/null || true)
          if [ -z "$SCANB" ]; then SCANB=$(python3 /tmp/findbtn.py "扫一扫" 2>/dev/null || true); fi
          if [ -n "$SCANB" ]; then
            echo "tap_scanlogin=$SCANB"
            timeout 10 adb -s $B shell "input tap $SCANB" >/dev/null 2>&1
            sleep 10
          else
            echo "NO_SCAN_POS — 再试其他"
            # 微信登录按钮旁边? 或者ivMore展开的列表
            timeout 10 adb -s $B shell "input keyevent 4" >/dev/null 2>&1; sleep 2
          fi
          # 截图(扫码页!)+多轮
          for i in 1 2 3 4 5; do
            sleep 3
            adb -s $B exec-out screencap -p > appscan_$i.png 2>/dev/null || true
            timeout 15 adb -s $B shell "uiautomator dump /sdcard/u.xml >/dev/null 2>&1"
            timeout 20 adb -s $B shell "cat /sdcard/u.xml" 2>/dev/null | tr -d '\r' > /tmp/u5.xml
            QRK=$(grep -c -E '扫码|扫一扫|二维码|使用QQ手机版' /tmp/u5.xml 2>/dev/null || echo 0)
            echo "round$i qr_hint=$QRK"
            if [ "$QRK" != "0" ]; then echo "★QR_PAGE!"; break; fi
          done
          adb -s $B exec-out screencap -p > qr_page.png 2>/dev/null || true
          cp /tmp/u5.xml last_dump.xml 2>/dev/null || true
          ls -la appscan_*.png qr_page.png 2>/dev/null || echo NO_PNG

      - name: upload QR screenshots + ui dumps
        uses: actions/upload-artifact@v4
        with:
          name: qr-screens
          path: |
            qr_page.png
            appscan_*.png
            login_dump.xml
            afterqq_dump.xml
            last_dump.xml
          if-no-files-found: ignore
