name: qd-vmp464
# 路线1: 464 VMP动态捕获 — spawn模式(壳初始化之前挂反反调试) + 隐身frida(改名qdsvc+非默认端口47821)
# 产出: ①真实464出站请求全头(borgus/cecelia/gorgon/sora真值) ②FockUtil.getH(VMP函数)in/out
#      ③kill/exit拦截backtrace → 定位壳内反调试判定点
on:
  workflow_dispatch:
    inputs:
      hook:
        description: 'hook 名 (release apks-v1 里的 js 文件名)'
        default: 'hook_fockgen11'
      secs:
        description: '采集秒数'
        default: '240'
      apk_url:
        default: 'https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/qidian_7.9.464.apk'

jobs:
  cap:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - name: Setup binder + adb + frida(锁定16.7.19)
        run: |
          set +e
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq linux-modules-extra-$(uname -r) adb curl xz-utils || echo APT_FAILED
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>&1 || echo MODPROBE_FAILED
          pip install -q "frida==16.7.19" "frida-tools<14" 2>&1 | tail -2
          frida --version

      - name: Start redroid
        run: |
          sudo docker rm -f redroid 2>/dev/null || true
          VOLS=""
          for d in binder hwbinder vndbinder; do if [ -e /dev/$d ]; then VOLS="$VOLS -v /dev/$d:/dev/$d"; fi; done
          sudo docker run -d --privileged --name redroid $VOLS -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.redroid_gpu_mode=guest androidboot.redroid_width=1080 \
            androidboot.redroid_height=2340 androidboot.redroid_dpi=420 \
            androidboot.redroid_adb=5555 || echo DOCKER_FAILED
          sleep 15
          adb start-server >/dev/null 2>&1 || true
          for i in $(seq 1 30); do
            timeout 15 adb connect localhost:5555 >/dev/null 2>&1 || true
            B=$(timeout 15 adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$B" = "1" ] && echo "BOOT_OK try $i" && break
            sleep 8
          done
          adb -s localhost:5555 shell getprop ro.product.cpu.abi | tr -d '\r'

      - name: 下载 APK + frida-server(改名qdsvc隐身)
        run: |
          set +e
          for i in 1 2 3 4; do
            curl -sSL --max-time 900 -o /tmp/qd.apk "${{ inputs.apk_url }}" || true
            SZ=$(stat -c%s /tmp/qd.apk 2>/dev/null || echo 0)
            echo "apk try $i size=$SZ"
            [ "$SZ" -gt 10000000 ] && break
            sleep 15
          done
          for i in 1 2 3 4; do
            curl -sSL --max-time 600 -o /tmp/fs.xz "https://github.com/frida/frida/releases/download/16.7.19/frida-server-16.7.19-android-arm64.xz" || true
            if xz -t /tmp/fs.xz 2>/dev/null; then echo "fs ok try $i"; break; fi
            sleep 15
          done
          unxz -f /tmp/fs.xz
          cp /tmp/fs /tmp/qdsvc && chmod +x /tmp/qdsvc   # ★改名避进程名扫描
          for i in 1 2 3; do
            curl -sSL --max-time 300 -o /tmp/gadget.xz "https://github.com/frida/frida/releases/download/16.7.19/frida-gadget-16.7.19-android-arm64.xz" || true
            if xz -t /tmp/gadget.xz 2>/dev/null; then echo "gadget ok try $i"; break; fi
            sleep 10
          done
          unxz -f /tmp/gadget.xz && chmod +x /tmp/frida-gadget-16.7.19-android-arm64
          curl -sSL --max-time 120 -o /tmp/hook.js "https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/${{ inputs.hook }}.js"
          ls -l /tmp/qd.apk /tmp/qdsvc /tmp/hook.js /tmp/frida-gadget-16.7.19-android-arm64

      - name: 装包 + 隐身frida-server(47821)
        run: |
          set +e
          A="adb -s localhost:5555"
          for i in 1 2 3; do
            timeout 300 $A install -r -t /tmp/qd.apk 2>&1 | tail -2
            if timeout 30 $A shell pm list packages 2>/dev/null | tr -d '\r' | grep -q qidian; then echo "INSTALL_OK try $i"; break; fi
            echo "install try $i 失败, 重连adb"
            sleep 8
            timeout 20 adb connect localhost:5555 >/dev/null 2>&1 || true
          done
          timeout 30 $A shell pm list packages | tr -d '\r' | grep qidian || echo NOT_INSTALLED
          timeout 30 $A root 2>&1 | tail -1
          # ★adb root会重启adbd, redroid上常掉线 — 顽固重连(6次×10s, 验证boot+root)
          ROOTOK=""
          for i in 1 2 3 4 5 6; do
            sleep 8
            timeout 20 adb connect localhost:5555 >/dev/null 2>&1 || true
            B=$(timeout 15 $A shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            U=$(timeout 15 $A shell id 2>/dev/null | tr -d '\r' | head -c 60)
            echo "root重连try$i boot=$B id=$U"
            if [ "$B" = "1" ] && echo "$U" | grep -q "uid=0"; then ROOTOK=1; break; fi
          done
          [ -n "$ROOTOK" ] || echo "!! root重连失败, 后续大概率失败"
          timeout 120 $A push /tmp/qdsvc /data/local/tmp/qdsvc
          timeout 30 $A shell chmod 755 /data/local/tmp/qdsvc
          timeout 30 $A shell "setsid /data/local/tmp/qdsvc -l 127.0.0.1:47821 >/dev/null 2>&1 &"
          sleep 10
          timeout 30 $A shell "ps -A -o PID,NAME | grep -i qdsvc" || echo NO_QDSVC_PROC
          timeout 30 $A forward tcp:47821 tcp:47821 || true
          for i in 1 2 3; do timeout 30 frida-ps -H 127.0.0.1:47821 2>&1 | head -4 && break; sleep 5; done
          # ★wrap+gadget注入材料
          timeout 120 $A push /tmp/frida-gadget-16.7.19-android-arm64 /data/local/tmp/frida-gadget.so
          timeout 30 $A shell chmod 644 /data/local/tmp/frida-gadget.so
          cat > /tmp/gadget.config.json <<'CFG'
          {
            "interaction": {
              "type": "listen",
              "address": "127.0.0.1",
              "port": 47822,
              "on_port_conflict": "pick-next",
              "on_load": "wait"
            }
          }
          CFG
          timeout 30 $A push /tmp/gadget.config.json /data/local/tmp/frida-gadget.so.config
          timeout 30 $A push /tmp/gadget.config.json /data/local/tmp/frida-gadget.config
          timeout 30 $A shell chmod 644 /data/local/tmp/frida-gadget.so.config /data/local/tmp/frida-gadget.config
          cat > /tmp/wrap.sh <<'WRAP'
          #!/system/bin/sh
          export LD_PRELOAD=/data/local/tmp/frida-gadget.so
          exec "$@"
          WRAP
          timeout 30 $A push /tmp/wrap.sh /data/local/tmp/wrap.sh
          timeout 30 $A shell chmod 755 /data/local/tmp/wrap.sh
          ls -l /data/local/tmp/ | grep -E "gadget|wrap" || true

      - name: wrap注入设置 + am start(走zygote官方注入点, 免frida spawn)
        run: |
          set +e
          mkdir -p out
          A="adb -s localhost:5555"
          $A shell "settings put global policy_control null*" 2>/dev/null
          # 清场: 杀掉崩溃循环实例
          timeout 30 $A shell am force-stop com.qidian.QDReader
          sleep 3
          timeout 30 $A shell "am force-stop com.qidian.QDReader" >/dev/null 2>&1
          sleep 2
          # ★wrap: 下一次启动走我们的wrapper → LD_PRELOAD gadget → on_load=wait挂起等连接
          timeout 30 $A shell setprop wrap.com.qidian.QDReader "/system/bin/sh /data/local/tmp/wrap.sh"
          echo "wrap属性: $(timeout 15 $A shell getprop wrap.com.qidian.QDReader | tr -d '\r')"
          # 转发gadget端口
          timeout 30 $A forward tcp:47822 tcp:47822 || true
          # 正常am start(不走frida spawn → 无forceStopPackage竞速)
          MAINACT=$(timeout 30 $A shell "cmd package resolve-activity --brief com.qidian.QDReader" 2>/dev/null | tr -d '\r' | tail -1)
          echo "主Activity: $MAINACT"
          [ -n "$MAINACT" ] && timeout 30 $A shell "am start -n $MAINACT" 2>&1 | tail -2
          echo "等gadget listen..."
          sleep 8
          timeout 20 $A shell "ps -A -o PID,NAME | grep qidian" || echo NO_PROC
      - name: spawn模式注入(spawn→attach→load→resume) + 采集
        run: |
          set +e
          HOOK='${{ inputs.hook }}' SECS='${{ inputs.secs }}' python3 - <<'PY'
          import frida, time, json, os, sys
          secs = int(os.environ.get('SECS', '240'))
          js = open('/tmp/hook.js').read()
          dev = frida.get_device_manager().add_remote_device('127.0.0.1:47822')   # gadget listen口
          msgs = []
          def on_msg(m, d):
              if m['type'] == 'send':
                  p = m['payload']
                  if isinstance(p, dict) and p.get('t') == 'vmpdump':
                      fn = f"out/vmp_{p['name']}_p{p['part']}.bin"
                      open(fn, 'wb').write(d)
                      print(f"[dump] {fn} {len(d)}B", flush=True)
                      return
                  line = json.dumps(p, ensure_ascii=False)
                  msgs.append(line); print('[JS]', line[:400], flush=True)
              else:
                  print('[ERR]', str(m)[:300], flush=True); msgs.append('ERR ' + str(m)[:300])

          import subprocess, re as _re
          # ★gadget连接: App已在on_load=wait挂起, 连上装载脚本即自动续跑(无frida spawn无force-stop)
          sess = None
          gpid = None
          for i in range(45):
              try:
                  procs = dev.enumerate_processes()
                  cand = [p_ for p_ in procs if 'qidian' in p_.name.lower() or 'QDReader' in p_.name] or procs
                  if cand:
                      gpid = cand[0].pid
                      sess = dev.attach(gpid)
                      print(f'gadget已连接 pid={gpid} ({cand[0].name})', flush=True)
                      break
              except Exception as e:
                  if i % 10 == 0: print(f'[gadget等待 {i}s] {str(e)[:80]}', flush=True)
              time.sleep(1)
          if sess is None:
              print('GADGET连接失败', flush=True)
              open('out/capture.txt', 'w').write('GADGET_CONNECT_FAILED')
              sys.exit(0)
          det = {'reason': None, 'at': None}
          def on_detached(reason, *a):
              det['reason'] = str(reason); det['at'] = time.time()
              print(f'[detach] {reason}', flush=True)
          sess.on('detached', on_detached)
          sc = sess.create_script(js)
          sc.on('message', on_msg)
          sc.load()
          print('反反调试已装载 → on_load=wait 自动续跑', flush=True)
          try: dev.resume(gpid)
          except Exception: pass
          pid = gpid
          def adbsh(cmd, tmo=25):
              try:
                  return subprocess.run(['adb', '-s', 'localhost:5555', 'shell'] + cmd,
                                      capture_output=True, text=True, timeout=tmo).stdout
              except Exception as e:
                  return f'(adb err {e})'
          def ui_drive(tag):
              d = adbsh(['uiautomator', 'dump', '/sdcard/ui2.xml'])
              xml = ''
              try:
                  xml = subprocess.run(['adb', '-s', 'localhost:5555', 'pull', '/sdcard/ui2.xml', '/tmp/ui2.xml'],
                                      capture_output=True, text=True, timeout=20)
                  xml = open('/tmp/ui2.xml', encoding='utf-8', errors='ignore').read()
              except Exception:
                  pass
              m = _re.search(r'text="([^"]*(?:同意|允许|我知道|进入|立即体验)[^"]*)"[^>]*?bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', xml)
              if m:
                  x = (int(m.group(2)) + int(m.group(4))) // 2; y = (int(m.group(3)) + int(m.group(5))) // 2
                  print(f'[ui {tag}] 点击 {m.group(1)} @{x},{y}', flush=True)
                  adbsh(['input', 'tap', str(x), str(y)])
              else:
                  print(f'[ui {tag}] 无可点 ({d.strip()[:60]})', flush=True)
          def dump_threads(tag):
              out = adbsh(['debuggerd', '-b', str(pid)], tmo=40)
              open(f'out/thr_{tag}.txt', 'w').write(out)
              heads = [l for l in out.splitlines() if 'pid:' in l or 'pc ' in l or 'backtrace' in l][:8]
              print(f'[thr {tag}] ' + ' | '.join(heads[:4]), flush=True)
          t0 = time.time()
          did = set()
          while time.time() - t0 < secs:
              time.sleep(5)
              el = int(time.time() - t0)
              alive = det['reason'] is None
              if el % 15 == 0 or not alive:
                  print(f'[t+{el}s] alive={alive} msgs={len(msgs)}', flush=True)
              if alive:
                  for mark, fn in [(30, 'u30'), (60, 't60'), (90, 'u90'), (150, 't150'), (210, 'u210')]:
                      if el >= mark and mark not in did:
                          did.add(mark)
                          try:
                              if fn.startswith('u'): ui_drive(fn)
                              else: dump_threads(fn)
                          except Exception as e:
                              print(f'[{fn} err] {e}', flush=True)
                  if el % 45 == 0 and el > 0:
                      try:
                          raw = subprocess.run(['adb', '-s', 'localhost:5555', 'exec-out', 'screencap', '-p'],
                                              capture_output=True, timeout=25).stdout
                          open(f'out/scr_{el}s.png', 'wb').write(raw)
                      except Exception:
                          pass
              if not alive:
                  time.sleep(3)   # 排干残余消息
                  break
          open('out/capture.txt', 'w').write('\n'.join(msgs))
          lived = f'>{secs}s' if det['reason'] is None else f"{int(det['at']-t0)}s"
          print(f'完成 {len(msgs)} 条, 进程存活={lived}, detach原因={det["reason"]}', flush=True)
          PY
          timeout 30 adb -s localhost:5555 shell setprop wrap.com.qidian.QDReader "" 2>/dev/null || true
          echo "===== 死因取证 ====="
          timeout 40 adb -s localhost:5555 shell "logcat -d -b crash -t 200" > out/logcat_crash.txt 2>/dev/null || true
          timeout 40 adb -s localhost:5555 shell "logcat -d -b events -t 800" > out/logcat_events.txt 2>/dev/null || true
          timeout 40 adb -s localhost:5555 shell "logcat -d -b events -t 800" 2>/dev/null | grep -iE "am_kill|am_proc_died|proc_kill|kill" > out/am_kill.txt || true
          timeout 40 adb -s localhost:5555 shell "logcat -d -t 2000" > out/logcat_full_tail.txt 2>/dev/null || true
          timeout 40 adb -s localhost:5555 shell "logcat -d -t 1200" 2>/dev/null | grep -iE "qidian|FATAL|SIGSEGV|SIGABRT|signal|tombstone|died|jiagu|Kill|lmkd" > out/logcat_grep.txt || true
          timeout 20 adb -s localhost:5555 exec-out screencap -p > out/after_capture.png 2>/dev/null || true
          timeout 30 adb -s localhost:5555 shell "ls -la /data/tombstones/ 2>/dev/null" > out/tombstones.txt 2>/dev/null || true
          echo "===== capture 行数 ====="
          wc -l out/capture.txt
          echo "--- REQ/GETH/KILL 命中数 ---"
          grep -c '"t":"REQ"' out/capture.txt || echo "REQ=0"
          grep -c '"t":"GETH"' out/capture.txt || echo "GETH=0"
          grep -c '"t":"RESP"' out/capture.txt || echo "RESP=0"
          grep -c 'KILL拦截\|阻断' out/capture.txt || echo "拦截=0"
          head -50 out/capture.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vmp464-capture
          path: out/
          if-no-files-found: warn
