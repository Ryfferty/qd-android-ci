name: qd-vmp464
# 路线1: 464 VMP动态捕获 — spawn模式(壳初始化之前挂反反调试) + 隐身frida(改名qdsvc+非默认端口47821)
# 产出: ①真实464出站请求全头(borgus/cecelia/gorgon/sora真值) ②FockUtil.getH(VMP函数)in/out
#      ③kill/exit拦截backtrace → 定位壳内反调试判定点
on:
  workflow_dispatch:
    inputs:
      hook:
        description: 'hook 名 (release apks-v1 里的 js 文件名)'
        default: 'hook_fockgen11'
      secs:
        description: '采集秒数'
        default: '240'
      baseline:
        description: '干净对照(不设wrap不注入, 看App裸跑redroid生死 — 分离反注入vs反虚拟化)'
        default: 'false'
      spoof:
        description: '属性伪装(小米Mi11/venus指纹+release-keys) — 反虚拟化对抗'
        default: 'false'
      apk_url:
        default: 'https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/qidian_7.9.464.apk'

jobs:
  cap:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - name: Setup binder + adb + frida(锁定16.7.19)
        run: |
          set +e
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq linux-modules-extra-$(uname -r) adb curl xz-utils || echo APT_FAILED
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>&1 || echo MODPROBE_FAILED
          pip install -q "frida==16.7.19" "frida-tools<14" 2>&1 | tail -2
          frida --version

      - name: Start redroid
        run: |
          sudo docker rm -f redroid 2>/dev/null || true
          VOLS=""
          for d in binder hwbinder vndbinder; do if [ -e /dev/$d ]; then VOLS="$VOLS -v /dev/$d:/dev/$d"; fi; done
          sudo docker run -d --privileged --name redroid $VOLS -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.hardware=qcom \
            androidboot.redroid_gpu_mode=guest androidboot.redroid_width=1080 \
            androidboot.redroid_height=2340 androidboot.redroid_dpi=420 \
            androidboot.redroid_adb=5555 || echo DOCKER_FAILED
          sleep 15
          adb start-server >/dev/null 2>&1 || true
          for i in $(seq 1 30); do
            timeout 15 adb connect localhost:5555 >/dev/null 2>&1 || true
            B=$(timeout 15 adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$B" = "1" ] && echo "BOOT_OK try $i" && break
            sleep 8
          done
          adb -s localhost:5555 shell getprop ro.product.cpu.abi | tr -d '\r'

      - name: 属性伪装(Mi11指纹sed进build.prop并重启redroid复验)
        if: ${{ inputs.spoof == 'true' }}
        run: |
          set +e
          echo "===== 注入Mi11(venus)身份到各分区build.prop ====="
          sudo docker exec redroid sh -c '
          for f in /system/build.prop /vendor/build.prop /odm/etc/build.prop /product/build.prop /system_ext/build.prop /default.prop /prop.default; do
            [ -f "$f" ] || continue
            sed -i \
              -e "s|^ro.product.model=.*|ro.product.model=M2011K2C|" \
              -e "s|^ro.product.brand=.*|ro.product.brand=xiaomi|" \
              -e "s|^ro.product.name=.*|ro.product.name=venus|" \
              -e "s|^ro.product.device=.*|ro.product.device=venus|" \
              -e "s|^ro.product.manufacturer=.*|ro.product.manufacturer=Xiaomi|" \
              -e "s|^ro.product.marketname=.*|ro.product.marketname=Mi 11|" \
              -e "s|^ro.build.fingerprint=.*|ro.build.fingerprint=xiaomi/venus/venus:11/RKQ1.200826.002/V12.5.6.0.RKBCNXM:user/release-keys|" \
              -e "s|^ro.bootimage.build.fingerprint=.*|ro.bootimage.build.fingerprint=xiaomi/venus/venus:11/RKQ1.200826.002/V12.5.6.0.RKBCNXM:user/release-keys|" \
              -e "s|^ro.build.tags=.*|ro.build.tags=release-keys|" \
              -e "s|^ro.build.type=.*|ro.build.type=user|" \
              -e "s|^ro.build.id=.*|ro.build.id=RKQ1.200826.002|" \
              -e "s|^ro.build.version.incremental=.*|ro.build.version.incremental=V12.5.6.0.RKBCNXM|" \
              -e "s|^ro.build.user=.*|ro.build.user=builder|" \
              -e "s|^ro.build.host=.*|ro.build.host=pangu-build-component-4189|" \
              -e "s|^ro.build.flavor=.*|ro.build.flavor=venus-user|" \
              -e "s|^ro.debuggable=.*|ro.debuggable=0|" \
              -e "s|^dalvik.vm.isa.arm64.variant=.*|dalvik.vm.isa.arm64.variant=cortex-x1|" \
              -e "s|^dalvik.vm.isa.arm.variant=.*|dalvik.vm.isa.arm.variant=cortex-a76|" \
              -e "s|^ro.bionic.cpu_variant=.*|ro.bionic.cpu_variant=cortex-x1|" \
              -e "s|^ro.bionic.2nd_cpu_variant=.*|ro.bionic.2nd_cpu_variant=cortex-a76|" \
              "$f" 2>&1 || echo "sed失败: $f"
            echo "=== $f 改后关键行:"
            grep -E "^ro.(product.model|build.fingerprint|build.type|debuggable)" "$f" 2>/dev/null || echo "(无匹配行)"
          done
          echo "=== 全根搜redroid指纹来源:"
          grep -rl "redroid_arm64" /system/build.prop /vendor/build.prop /product/build.prop /system_ext/build.prop /odm/etc/build.prop /default.prop 2>/dev/null
          '
          echo "===== 重启redroid使属性生效 ====="
          sudo docker restart redroid
          adb disconnect localhost:5555 >/dev/null 2>&1 || true
          sleep 20
          for i in $(seq 1 30); do
            timeout 15 adb connect localhost:5555 >/dev/null 2>&1 || true
            B=$(timeout 15 adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$B" = "1" ] && echo "REBOOT_OK try $i" && break
            sleep 8
          done
          echo "===== 复验伪装效果 ====="
          timeout 20 adb -s localhost:5555 shell "getprop ro.build.fingerprint; getprop ro.product.model; getprop ro.build.tags; getprop ro.build.type; getprop ro.debuggable; getprop ro.boot.hardware; getprop ro.hardware" 2>/dev/null

      - name: 下载 APK + frida-server(改名qdsvc隐身)
        run: |
          set +e
          for i in 1 2 3 4; do
            curl -sSL --max-time 900 -o /tmp/qd.apk "${{ inputs.apk_url }}" || true
            SZ=$(stat -c%s /tmp/qd.apk 2>/dev/null || echo 0)
            echo "apk try $i size=$SZ"
            [ "$SZ" -gt 10000000 ] && break
            sleep 15
          done
          for i in 1 2 3 4; do
            curl -sSL --max-time 600 -o /tmp/fs.xz "https://github.com/frida/frida/releases/download/16.7.19/frida-server-16.7.19-android-arm64.xz" || true
            if xz -t /tmp/fs.xz 2>/dev/null; then echo "fs ok try $i"; break; fi
            sleep 15
          done
          unxz -f /tmp/fs.xz
          cp /tmp/fs /tmp/qdsvc && chmod +x /tmp/qdsvc   # ★改名避进程名扫描
          for i in 1 2 3; do
            curl -sSL --max-time 300 -o /tmp/gadget.xz "https://github.com/frida/frida/releases/download/16.7.19/frida-gadget-16.7.19-android-arm64.so.xz" || true
            if xz -t /tmp/gadget.xz 2>/dev/null; then echo "gadget ok try $i"; break; fi
            sleep 10
          done
          unxz -f /tmp/gadget.xz && mv -f /tmp/gadget /tmp/frida-gadget.so && chmod +x /tmp/frida-gadget.so
          curl -sSL --max-time 120 -o /tmp/hook.js "https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/${{ inputs.hook }}.js"
          ls -l /tmp/qd.apk /tmp/qdsvc /tmp/hook.js /tmp/frida-gadget.so || true

      - name: 装包 + 隐身frida-server(47821)
        run: |
          set +e
          A="adb -s localhost:5555"
          for i in 1 2 3; do
            timeout 300 $A install -r -t /tmp/qd.apk 2>&1 | tail -2
            if timeout 30 $A shell pm list packages 2>/dev/null | tr -d '\r' | grep -q qidian; then echo "INSTALL_OK try $i"; break; fi
            echo "install try $i 失败, 重连adb"
            sleep 8
            timeout 20 adb connect localhost:5555 >/dev/null 2>&1 || true
          done
          timeout 30 $A shell pm list packages | tr -d '\r' | grep qidian || echo NOT_INSTALLED
          timeout 30 $A root 2>&1 | tail -1
          # ★adb root会重启adbd, redroid上常掉线 — 顽固重连(6次×10s, 验证boot+root)
          ROOTOK=""
          for i in 1 2 3 4 5 6; do
            sleep 8
            timeout 20 adb connect localhost:5555 >/dev/null 2>&1 || true
            B=$(timeout 15 $A shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            U=$(timeout 15 $A shell id 2>/dev/null | tr -d '\r' | head -c 60)
            echo "root重连try$i boot=$B id=$U"
            if [ "$B" = "1" ] && echo "$U" | grep -q "uid=0"; then ROOTOK=1; break; fi
          done
          [ -n "$ROOTOK" ] || echo "!! root重连失败, 后续大概率失败"
          timeout 120 $A push /tmp/qdsvc /data/local/tmp/qdsvc
          timeout 30 $A shell chmod 755 /data/local/tmp/qdsvc
          timeout 30 $A shell "setsid /data/local/tmp/qdsvc -l 127.0.0.1:47821 >/dev/null 2>&1 &"
          sleep 10
          timeout 30 $A shell "ps -A -o PID,NAME | grep -i qdsvc" || echo NO_QDSVC_PROC
          timeout 30 $A forward tcp:47821 tcp:47821 || true
          for i in 1 2 3; do timeout 30 frida-ps -H 127.0.0.1:47821 2>&1 | head -4 && break; sleep 5; done
          # ★wrap+gadget注入材料: 伪装成App自家库(数据目录+libqdinit.so), 失败回退/data/local/tmp
          timeout 180 $A push /tmp/frida-gadget.so /data/local/tmp/libqdinit.so
          GADGET_PATH=/data/local/tmp/libqdinit.so
          for i in 1 2 3 4; do
            timeout 30 $A shell "mkdir -p /data/data/com.qidian.QDReader/files" 2>/dev/null || true
            timeout 30 $A shell "cp /data/local/tmp/libqdinit.so /data/data/com.qidian.QDReader/files/libqdinit.so && chmod 644 /data/data/com.qidian.QDReader/files/libqdinit.so" 2>/dev/null || true
            if timeout 15 $A shell "test -r /data/data/com.qidian.QDReader/files/libqdinit.so"; then
              GADGET_PATH=/data/data/com.qidian.QDReader/files/libqdinit.so; break
            fi
            sleep 3
          done
          echo "gadget路径: $GADGET_PATH"
          echo -n "$GADGET_PATH" > /tmp/gadget_path
          cat > /tmp/gadget.config.json <<'CFG'
          {
            "interaction": {
              "type": "script",
              "path": "/data/data/com.qidian.QDReader/files/hook.js",
              "on_change": "reload"
            }
          }
          CFG
          timeout 30 $A push /tmp/hook.js /data/local/tmp/hook.js
          timeout 30 $A shell "cp /data/local/tmp/hook.js /data/data/com.qidian.QDReader/files/hook.js && chmod 644 /data/data/com.qidian.QDReader/files/hook.js" || true
          timeout 30 $A push /tmp/gadget.config.json /data/local/tmp/libqdinit.config
          if [ "$GADGET_PATH" != "/data/local/tmp/libqdinit.so" ]; then
            timeout 30 $A shell "cp /data/local/tmp/libqdinit.config /data/data/com.qidian.QDReader/files/libqdinit.so.config && cp /data/local/tmp/libqdinit.config /data/data/com.qidian.QDReader/files/libqdinit.config && chmod 644 /data/data/com.qidian.QDReader/files/libqdinit.so.config /data/data/com.qidian.QDReader/files/libqdinit.config" || true
          fi
          # /data/local/tmp也留一份config(所有命名变体)
          timeout 30 $A shell "cp /data/local/tmp/libqdinit.config /data/local/tmp/libqdinit.so.config 2>/dev/null" || true
          GADGET_PATH=$(cat /tmp/gadget_path 2>/dev/null || echo /data/local/tmp/libqdinit.so)
          cat > /tmp/wrap.sh <<WRAP
          #!/system/bin/sh
          export LD_PRELOAD=$GADGET_PATH
          exec "\$@"
          WRAP
          timeout 30 $A push /tmp/wrap.sh /data/local/tmp/wrap.sh
          timeout 30 $A shell chmod 755 /data/local/tmp/wrap.sh
          ls -l /data/local/tmp/ | grep -E "gadget|wrap" || true

      - name: wrap注入设置 + am start(走zygote官方注入点, 免frida spawn)
        run: |
          set +e
          mkdir -p out
          A="adb -s localhost:5555"
          $A shell "settings put global policy_control null*" 2>/dev/null
          # 清场: 杀掉崩溃循环实例
          timeout 30 $A shell am force-stop com.qidian.QDReader
          sleep 3
          timeout 30 $A shell "am force-stop com.qidian.QDReader" >/dev/null 2>&1
          sleep 2
          # ★wrap: 下一次启动走我们的wrapper → LD_PRELOAD gadget → on_load=wait挂起等连接
          WRAPV=""
          if [ "${{ inputs.baseline }}" != "true" ]; then
          for i in 1 2 3 4 5; do
            timeout 30 $A shell setprop wrap.com.qidian.QDReader /data/local/tmp/wrap.sh 2>&1 | head -1 || true
            WRAPV=$(timeout 15 $A shell getprop wrap.com.qidian.QDReader | tr -d '\r')
            [ -n "$WRAPV" ] && break
            echo "setprop try$i 失败, 等3s重试"
            sleep 3
          done
          fi
          echo "wrap属性: [$WRAPV] (baseline=${{ inputs.baseline }})"
          # 转发gadget端口
          timeout 30 $A forward tcp:47822 tcp:47822 || true
          # 正常am start(不走frida spawn → 无forceStopPackage竞速)
          MAINACT=$(timeout 30 $A shell "cmd package resolve-activity --brief com.qidian.QDReader" 2>/dev/null | tr -d '\r' | tail -1)
          echo "主Activity: $MAINACT"
          [ -n "$MAINACT" ] && timeout 30 $A shell "am start -n $MAINACT" 2>&1 | tail -2
          echo "等gadget listen..."
          sleep 8
          timeout 20 $A shell "ps -A -o PID,NAME | grep qidian" || echo NO_PROC
      - name: script模式gadget采集(零连接 — 脚本从磁盘自载, 壳无可杀)
        run: |
          set +e
          SECS='${{ inputs.secs }}'
          # ★/proc取证poller(后台): 每1s记录app pid的Sig位图/Seccomp/cmdline — 静默死亡时看execve与handler位
          export SECS
          nohup python3 - <<'PP' >/dev/null 2>&1 &
          import subprocess, time, os
          secs = int(os.environ.get('SECS', '240')) - 5
          def sh(c):
              try: return subprocess.run(['adb', '-s', 'localhost:5555', 'shell', c],
                                         capture_output=True, text=True, timeout=10).stdout
              except Exception: return ''
          last = None
          t0 = time.time()
          while time.time() - t0 < secs:
              pid = sh('pidof com.qidian.QDReader').strip()
              if pid != last:
                  open('out/proc_watch.txt', 'a').write(f'--- t+{int(time.time()-t0)}s pid[{pid}] (was[{last}])\n')
                  last = pid
              if pid and pid.replace(' ', '').isdigit():
                  p0 = pid.split()[0].strip()
                  st = sh('grep -E "Seccomp|SigIgn|SigCgt|Threads|TracerPid" /proc/{0}/status'.format(p0))
                  cm = sh('cat /proc/{0}/cmdline | tr "\0" " "'.format(p0)).strip()
                  if st.strip():
                      open('out/proc_watch.txt', 'a').write(f't+{int(time.time()-t0)} {st.strip()} cmdline[{cm[:100]}]\n')
              time.sleep(1)
          PP
          echo "poller已启动"
          echo "等App跑 $SECS 秒(gadget自载hook.js, 捕获写cap.jsonl)..."
          sleep $SECS
          echo "===== 拉取文件捕获 ====="
          timeout 30 adb -s localhost:5555 shell "cat /data/data/com.qidian.QDReader/files/cap.jsonl 2>/dev/null" > out/cap_file.jsonl || true
          wc -l out/cap_file.jsonl 2>/dev/null || echo "文件捕获为空"
          grep -c '"t":"REQ"' out/cap_file.jsonl 2>/dev/null || echo "REQ=0"
          grep -c '"t":"GETH"' out/cap_file.jsonl 2>/dev/null || echo "GETH=0"
          head -30 out/cap_file.jsonl 2>/dev/null || true
          echo "===== 取证 ====="
          timeout 30 adb -s localhost:5555 shell "ps -A -o PID,NAME | grep qidian" || echo "进程已死"
          timeout 30 adb -s localhost:5555 shell getprop > out/getprop.txt 2>/dev/null || true
          timeout 20 adb -s localhost:5555 shell "getprop ro.build.fingerprint; getprop ro.product.model; getprop ro.product.brand; getprop ro.hardware; getprop ro.boot.hardware" 2>/dev/null || true
          timeout 20 adb -s localhost:5555 exec-out screencap -p > out/after_capture.png 2>/dev/null || true
          timeout 40 adb -s localhost:5555 shell "logcat -d -b crash -t 200" > out/logcat_crash.txt 2>/dev/null || true
          timeout 40 adb -s localhost:5555 shell "logcat -d -t 2000" > out/logcat_full_tail.txt 2>/dev/null || true
          timeout 40 adb -s localhost:5555 shell "logcat -d -t 1200" 2>/dev/null | grep -iE "qidian|FATAL|SIGSEGV|signal|died|jiagu|Kill" > out/logcat_grep.txt || true
          timeout 40 adb -s localhost:5555 shell "logcat -d -b events -t 800" > out/logcat_events.txt 2>/dev/null || true
          timeout 40 adb -s localhost:5555 shell "logcat -d -b events -t 800" 2>/dev/null | grep -iE "am_kill|am_proc_died|kill" > out/am_kill.txt || true
          timeout 30 adb -s localhost:5555 shell "debuggerd -b $(adb -s localhost:5555 shell pidof com.qidian.QDReader | tr -d '\r' | awk '{print $1}') 2>/dev/null" > out/thr_final.txt 2>/dev/null || true
          timeout 30 adb -s localhost:5555 shell setprop wrap.com.qidian.QDReader "" 2>/dev/null || true
          timeout 30 adb -s localhost:5555 shell "ls -la /data/tombstones/ 2>/dev/null" > out/tombstones.txt 2>/dev/null || true
      - name: Upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vmp464-capture
          path: out/
          if-no-files-found: warn
