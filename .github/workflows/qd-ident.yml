name: qd-ident
on:
  workflow_dispatch:

jobs:
  t:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          set +e
          sudo -S -p '' apt-get update -qq || true
          sudo -S -p '' apt-get install -y -qq linux-modules-extra-$(uname -r) android-tools-adb curl xz-utils unzip python3-pip || echo APT_PARTIAL
          sudo -S -p '' modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>&1 || echo MODPROBE_MAYBE
          pip install -q pycryptodome 2>&1 | tail -1
          exit 0

      - name: redroid + 464 + 初始化 + 读设备真实身份
        run: |
          set +e
          B=localhost:5555
          sudo -S -p '' docker rm -f redroid 2>/dev/null || true
          VOLS=""
          for d in binder hwbinder vndbinder; do [ -e /dev/$d ] && VOLS="$VOLS -v /dev/$d:/dev/$d"; done
          sudo -S -p '' docker run -d --privileged --name redroid $VOLS -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.redroid_width=1080 androidboot.redroid_height=2340 androidboot.redroid_dpi=420 \
            androidboot.redroid_gpu_mode=guest 2>&1 | tail -1
          adb start-server >/dev/null 2>&1; sleep 5
          for i in $(seq 1 30); do adb connect localhost:5555 >/dev/null 2>&1; S=$(timeout 8 adb -s $B shell getprop sys.boot_completed 2>/dev/null | tr -d '\r'); [ "$S" = "1" ] && break; sleep 6; done
          echo "boot=[$(timeout 8 adb -s $B shell getprop sys.boot_completed | tr -d '\r')]"
          curl -sSL --max-time 900 -o q464.apk "https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/qidian_7.9.464.apk"
          timeout 300 adb -s $B push q464.apk /data/local/tmp/q464.apk >/dev/null 2>&1
          timeout 300 adb -s $B shell "pm install -r -d -t --user 0 /data/local/tmp/q464.apk" 2>&1 | tail -1
          timeout 30 adb -s $B root >/dev/null 2>&1; sleep 5; timeout 30 adb -s $B wait-for-device
          bash write_consent.sh 2>&1 | tail -2
          timeout 20 adb -s $B shell "am start -n com.qidian.QDReader/.ui.activity.SplashActivity" >/dev/null 2>&1
          sleep 25
          for i in 1 2 3 4 5; do
            timeout 15 adb -s $B shell "uiautomator dump /sdcard/u.xml >/dev/null 2>&1"
            timeout 20 adb -s $B shell "cat /sdcard/u.xml" 2>/dev/null | tr -d '\r' > /tmp/u2.xml
            for ID in btnAgree upgrade_dialog_close_btn btn_negative tvSkip; do
              XY=$(python3 tap_id.py /tmp/u2.xml $ID 2>/dev/null | head -1)
              [ -n "$XY" ] && { timeout 10 adb -s $B shell "input tap $XY"; sleep 4; }
            done
            SZ=$(timeout 8 adb -s $B shell "stat -c%s /data/data/com.qidian.QDReader/files/mmkv/pref_utils 2>/dev/null" | tr -d '\r')
            [ -n "$SZ" ] && [ "$SZ" -gt 500 ] && { echo "  MMKV 已初始化=${SZ}B"; break; }
          done
          for i in $(seq 1 6); do sleep 10; SZ=$(timeout 8 adb -s $B shell "stat -c%s /data/data/com.qidian.QDReader/files/mmkv/pref_utils 2>/dev/null" | tr -d '\r'); echo "  init t=$((i*10))s MMKV=${SZ}B"; [ -n "$SZ" ] && [ "$SZ" -gt 500 ] && break; done

          echo "########## 设备系统身份 ##########"
          for k in ro.product.model ro.product.brand ro.product.manufacturer ro.product.device ro.serialno ro.build.fingerprint; do
            echo "  $k = $(timeout 6 adb -s $B shell getprop $k | tr -d '\r')"
          done
          echo "  android_id = $(timeout 6 adb -s $B shell 'settings get secure android_id' | tr -d '\r')"
          echo "  gsf_id     = $(timeout 6 adb -s $B shell 'settings get secure android_id gsf_id 2>/dev/null || true' | tr -d '\r')"

          echo "########## MMKV 里的身份（App 自己的） ##########"
          timeout 30 adb -s $B shell "cat /data/data/com.qidian.QDReader/files/mmkv/pref_utils" 2>/dev/null | tr -d '\r' > /tmp/mmkv.bin
          echo "MMKV 大小: $(wc -c < /tmp/mmkv.bin)B"
          strings /tmp/mmkv.bin | grep -iE 'QIMEI|IMEI|uuid|device|id$|serial|mac' | head -25
          echo "--- MMKV 里的 pref_fock_key（App 拿到的密钥）---"
          strings /tmp/mmkv.bin | grep -oE '\{"1639985422":"[A-Za-z0-9+/=]{40,}' | head -2

          echo "########## 其他 MMKV 文件 ##########"
          timeout 20 adb -s $B shell "ls -la /data/data/com.qidian.QDReader/files/mmkv/" 2>/dev/null | head -12
          echo "########## 提取设备真实 QIMEI ##########"
          Q16=$(strings /tmp/mmkv.bin | grep -oE 'O_STAR_Q_IMEI_16%\$([0-9a-f]{16,40})' | head -1 | sed 's/.*\$//')
          echo "★ QIMEI16=[$Q16]"
          AID=$(timeout 6 adb -s $B shell 'settings get secure android_id' | tr -d '\r')
          MODEL=$(timeout 6 adb -s $B shell getprop ro.product.model | tr -d '\r')
          echo "android_id=[$AID] model=[$MODEL]"
          echo "DEV_ANDROID_ID=$AID" >> $GITHUB_ENV
          echo "DEV_MODEL=$MODEL" >> $GITHUB_ENV
          echo "DEV_IMEI=$Q16" >> $GITHUB_ENV
          echo "DEV_Q16=$Q16" >> $GITHUB_ENV
          cp /tmp/mmkv.bin /tmp/logcat.txt
          ls -la /tmp/mmkv.bin
          exit 0

      - name: 用设备真实身份跑协议（纯协议取数）
        run: |
          set +e
          echo "DEV_Q16=[$DEV_Q16] DEV_ANDROID_ID=[$DEV_ANDROID_ID]"
          Q16="$DEV_Q16" SESS=/tmp/sess.json BOOK=1049120379 CID=903350205 timeout 90 python3 argus_final.py 2>&1 | tail -8
          python3 check_key.py
          cp /tmp/params.json /tmp/final_params.json 2>/dev/null
          python3 summarize_params.py
          exit 0

      - name: spawn 注入抓 sn 签名（App 发请求前就钩住）
        run: |
          set +e
          B=localhost:5555
          echo "=== 装 frida（pip 装，避免 No such file or directory）==="
          pip install -q "frida==16.7.19" "frida-tools<14" 2>&1 | tail -1
          which frida || echo "FRIDA_MISSING"
          echo "=== 先确认 App 已初始化（MMKV>500）==="
          for i in 1 2 3 4 5 6 7 8; do
            SZ=$(timeout 8 adb -s $B shell "stat -c%s /data/data/com.qidian.QDReader/files/mmkv/pref_utils 2>/dev/null" | tr -d '\r')
            P=$(timeout 6 adb -s $B shell pidof com.qidian.QDReader | tr -d '\r')
            echo "  t=$((i*10))s PID=[$P] MMKV=${SZ}B"
            [ -n "$SZ" ] && [ "$SZ" -gt 500 ] && break
            if [ -z "$P" ]; then
              timeout 20 adb -s $B shell "am start -n com.qidian.QDReader/.ui.activity.SplashActivity" >/dev/null 2>&1
              sleep 12
              timeout 15 adb -s $B shell "uiautomator dump /sdcard/u.xml >/dev/null 2>&1"
              timeout 20 adb -s $B shell "cat /sdcard/u.xml" 2>/dev/null | tr -d '\r' > /tmp/u2.xml
              for ID in btnAgree tvSkip; do
                XY=$(python3 tap_id.py /tmp/u2.xml $ID 2>/dev/null | head -1)
                [ -n "$XY" ] && { timeout 10 adb -s $B shell "input tap $XY"; sleep 3; }
              done
            fi
            sleep 10
          done
          echo "=== 起 frida（改名，App 已在跑）==="
          if ! timeout 10 adb -s $B shell "ps -A | grep -c fsd" 2>/dev/null | tr -d '\r' | grep -qv '^0'; then
            timeout 20 adb -s $B shell "setsid /data/local/tmp/fsd -D >/dev/null 2>&1 &"
            sleep 6
          fi
          timeout 20 adb -s $B forward tcp:27042 tcp:27042 >/dev/null 2>&1
          timeout 20 adb -s $B shell "rm -f /data/local/tmp/SN_DUMP.txt"
          echo "=== spawn 注入（保持 stdin 100 秒）==="
          ( sleep 100 ) | timeout 160 frida -H 127.0.0.1:27042 -f com.qidian.QDReader -l stepR_sn.js > /tmp/sn.txt 2>&1
          echo "--- 原始前 15 行 ---"; head -15 /tmp/sn.txt
          echo "--- hook 与捕获 ---"
          grep -E "=== R:|hook |IN \[|OUT |URL=|deeplink" /tmp/sn.txt | head -50
          echo "--- 设备端 SN_DUMP ---"
          timeout 30 adb -s $B pull /data/local/tmp/SN_DUMP.txt /tmp/SN_DUMP.txt >/dev/null 2>&1 && { wc -c /tmp/SN_DUMP.txt; head -60 /tmp/SN_DUMP.txt; }
          cp /tmp/sn.txt /tmp/dec.txt 2>/dev/null
          exit 0

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ident
          path: |
            /tmp/mmkv.bin
            /tmp/SN_DUMP.txt
            /tmp/params.json
            /tmp/dec.txt
            /tmp/plain_O.txt
            /tmp/win_out.txt
          if-no-files-found: warn
