name: qd-qq-lite-v5
on: workflow_dispatch
jobs:
  qqlite:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 95
    steps:
      - name: redroid boot + install QQ lite + qidian
        run: |
          set -x
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget linux-modules-extra-$(uname -r) android-tools-adb >/dev/null 2>&1 || true
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>/dev/null || true
          ls /dev/binder* 2>/dev/null || { echo "NO_BINDER"; sudo mkdir -p /dev/binderfs; sudo mount -t binder binder /dev/binderfs 2>/dev/null; ls /dev/binderfs/ 2>/dev/null; }
          # redroid(Android13 arm64)
          docker run -d --name qd --privileged -p 5555:5555 -v ~/data:/data \
            redroid/redroid:13.0.0-latest androidboot.redroid_width=1080 androidboot.redroid_height=2340 &
          sleep 25
          adb wait-for-device 2>/dev/null || true
          adb devices
          # 等系统就绪
          for i in $(seq 1 20); do
            BOOTED=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$BOOTED" = "1" ] && echo "BOOTED" && break
            sleep 5
          done
          # 下载安装两个APK(QQ轻聊版+起点)
          cd /tmp
          wget -q "https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/qqlite.apk" -O qqlite.apk
          wget -q "https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/qidian_7.9.464.apk" -O qd.apk
          ls -la qqlite.apk qd.apk
          adb install -r qqlite.apk 2>&1 | tail -2
          adb install -r qd.apk 2>&1 | tail -2
          adb shell pm list packages | grep -E "tencent|qidian" 

      - name: QQ login (scan QR)
        run: |
          B=$(adb devices | grep -oE "emulator-[0-9]+|localhost:[0-9]+" | head -1)
          adb connect localhost:5555 2>/dev/null || true
          B=$(adb devices | grep -oE "emulator-[0-9]+|localhost:[0-9]+" | head -1)
          echo "DEVICE=$B"
          [ -z "$B" ] && { echo "NO_DEVICE"; exit 1; }
          [ -z "$B" ] && B=localhost:5555
          # 打开QQ轻聊版
          # 启动QQ(monkey带日志)
          timeout 15 adb -s $B shell "monkey -p com.tencent.qqlite -c android.intent.category.LAUNCHER 1" 2>&1 | tail -5 || true
          sleep 12
          # 找QQ的真实启动activity
          timeout 10 adb -s $B shell "cmd package resolve-activity --brief com.tencent.qqlite" 2>&1 | tail -2
          # 直接am start(用resolve的结果)
          LA=$(timeout 10 adb -s $B shell "cmd package resolve-activity --brief com.tencent.qqlite | tail -1" | tr -d '\r')
          echo "LA=$LA"
          [ -n "$LA" ] && timeout 10 adb -s $B shell "am start -n $LA" 2>&1 | tail -2
          sleep 15
          # 崩溃检测
          timeout 10 adb -s $B shell "logcat -d -s AndroidRuntime:E" 2>&1 | tail -5 || true
          adb -s $B exec-out screencap -p > qq_launch.png || true
          ls -la qq_launch.png || true
          # ★权限页处理: 先点警告对话框的确认, 再点CONTINUE
          sleep 3
          for round in 1 2 3 4; do
            timeout 15 adb -s $B shell "uiautomator dump /sdcard/u.xml >/dev/null 2>&1" || true
            timeout 20 adb -s $B shell "cat /sdcard/u.xml" 2>/dev/null | tr -d '\r' > /tmp/qq_perm.xml
            # 警告框(DON'T ALLOW ANYWAY / CANCEL) — 点对话框的按钮(通常右侧确认)
            if grep -q "DON'T ALLOW ANYWAY\|older version" /tmp/qq_perm.xml 2>/dev/null; then
              echo "round$round: 旧版警告 — 点确定(右侧按钮)"
              # 对话框两按钮: 左CANCEL右确认 — 坐标按1080x2340(确认≈900,1370)
              timeout 10 adb -s $B shell "input tap 900 1370" 2>/dev/null || true
              sleep 3
              continue
            fi
            # 权限主页面: 点CONTINUE(底部右)
            if grep -q "CONTINUE" /tmp/qq_perm.xml 2>/dev/null; then
              echo "round$round: 权限页 — 点CONTINUE"
              # CONTINUE按钮(底部右≈900,2100)
              timeout 10 adb -s $B shell "input tap 900 2100" 2>/dev/null || true
              sleep 5
              continue
            fi
            echo "round$round: 权限页完成或无匹配"
            break
          done
          # 等QQ真正起来
          sleep 10
          adb -s $B exec-out screencap -p > qq_perm_done.png || true
          # dump看是否到QQ登录页
          timeout 15 adb -s $B shell "uiautomator dump /sdcard/u.xml >/dev/null 2>&1" || true
          timeout 20 adb -s $B shell "cat /sdcard/u.xml" 2>/dev/null | tr -d '\r' > /tmp/qq_after.xml
          echo "== 权限后页面文字 =="
          grep -o 'text="[^"]*"' /tmp/qq_after.xml | grep -v 'text=""' | head -20
          # QQ登录页dump(找登录按钮)
          timeout 15 adb -s $B shell "uiautomator dump /sdcard/u.xml >/dev/null 2>&1"
          timeout 20 adb -s $B shell "cat /sdcard/u.xml" 2>/dev/null | tr -d '\r' > /tmp/qq_u.xml
          grep -o 'text="[^"]*"' /tmp/qq_u.xml | grep -v 'text=""' | head -20
          # 授权弹窗处理(存储/电话权限)
          for i in 1 2 3; do
            sleep 3
            OK=$(grep -c '允许\|ALLOW\|同意' /tmp/qq_u.xml 2>/dev/null || echo 0)
            if [ "$OK" != "0" ]; then
              timeout 10 adb -s $B shell "input tap 830 1580" 2>/dev/null || true
            fi
            timeout 15 adb -s $B shell "uiautomator dump /sdcard/u.xml >/dev/null 2>&1"
            timeout 20 adb -s $B shell "cat /sdcard/u.xml" 2>/dev/null | tr -d '\r' > /tmp/qq_u.xml
          done
          adb -s $B exec-out screencap -p > qq_login_page.png
          ls -la qq_*.png

      - name: upload QQ screenshots
        uses: actions/upload-artifact@v4
        with:
          name: qq-screens
          path: |
            qq_launch.png
            qq_perm_done.png
            qq_login_page.png
          if-no-files-found: ignore
