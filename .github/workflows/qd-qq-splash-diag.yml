name: qd-qq-splash-diag
on:
  workflow_dispatch:
    inputs:
      qq_url:
        description: QQ apk
        default: https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/com.tencent.mobileqq.apk
        required: false

jobs:
  diag:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Setup binder and adb
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq linux-modules-extra-$(uname -r) adb curl xz-utils || echo APT_FAILED
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>&1 || echo MODPROBE_FAILED

      - name: Start redroid
        run: |
          sudo docker rm -f redroid 2>/dev/null || true
          VOLS=""
          for d in binder hwbinder vndbinder; do if [ -e /dev/$d ]; then VOLS="$VOLS -v /dev/$d:/dev/$d"; fi; done
          sudo docker run -d --privileged --name redroid $VOLS -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.redroid_gpu_mode=guest androidboot.redroid_width=1080 \
            androidboot.redroid_height=2340 androidboot.redroid_dpi=420 \
            androidboot.redroid_adb=5555 || echo DOCKER_FAILED
          sleep 15

      - name: Boot, install QQ, network reachability to tencent
        run: |
          adb start-server >/dev/null 2>&1 || true
          timeout 30 adb connect localhost:5555 2>&1 || true
          for i in $(seq 1 30); do
            B=$(timeout 15 adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "$B" = "1" ]; then echo "booted try $i"; break; fi
            sleep 8
          done
          echo "=== HOST side reachability ==="
          for h in msfwifi.3g.qq.com configsvr.msf.3g.qq.com imgcache.qq.com; do
            curl -sS -o /dev/null -m 12 -w "host $h -> %{http_code} %{time_total}s\n" "https://$h/" || echo "host $h FAIL"
          done
          echo "=== guest tcp connect (bounded) ==="
          for hp in "msfwifi.3g.qq.com 8080" "configsvr.msf.3g.qq.com 8080" "imgcache.qq.com 443" "openmobile.qq.com 443"; do
            set -- $hp
            timeout 20 adb -s localhost:5555 shell "toybox nc -w 4 $1 $2 < /dev/null; echo rc=\$? for $1:$2" || true
          done
          echo "=== guest dns resolve ==="
          timeout 20 adb -s localhost:5555 shell "getprop | grep -i dns" || true
          curl -sSL --max-time 900 -o /tmp/qq.apk "${{ inputs.qq_url }}" || echo QQ_DL_FAIL
          timeout 900 adb -s localhost:5555 install -r -t /tmp/qq.apk 2>&1 | tail -2

      - name: Launch QQ, dismiss privacy, long wait with periodic dumps
        run: |
          timeout 20 adb -s localhost:5555 shell "logcat -c" || true
          timeout 40 adb -s localhost:5555 shell "am start -W -n com.tencent.mobileqq/com.tencent.mobileqq.activity.SplashActivity" 2>&1 | tail -2
          sleep 30
          LINE=$(timeout 30 adb -s localhost:5555 shell "uiautomator dump /sdcard/d1.xml >/dev/null 2>&1; cat /sdcard/d1.xml" 2>/dev/null | tr -d '\r')
          BB=$(echo "$LINE" | sed 's/></>\n</g' | grep -oE 'text="同意"[^>]*bounds="\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]"' | head -1 | grep -oE '\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]')
          echo "agree bounds: $BB"
          if [ -n "$BB" ]; then
            N=$(echo "$BB" | sed -E 's/^\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]$/\1 \2 \3 \4/')
            set -- $N
            echo "tap agree at $(( ($1+$3)/2 )) $(( ($2+$4)/2 ))"
            timeout 20 adb -s localhost:5555 shell "input tap $(( ($1+$3)/2 )) $(( ($2+$4)/2 ))" || true
          fi
          for t in 30 60 120 180 240; do
            sleep 45
            echo "########## T+${t}s ##########"
            timeout 20 adb -s localhost:5555 shell "dumpsys activity activities 2>/dev/null | grep -E 'ResumedActivity|topResumedActivity'" || true
            timeout 20 adb -s localhost:5555 shell "ps -A | grep -i mobileqq" || echo "no qq proc"
            timeout 30 adb -s localhost:5555 exec-out screencap -p > /tmp/sp_${t}.png 2>/dev/null || true
            echo "screencap bytes: $(stat -c%s /tmp/sp_${t}.png 2>/dev/null || echo 0)"
            echo "--- ui text ---"
            timeout 40 adb -s localhost:5555 shell "uiautomator dump /sdcard/u${t}.xml >/dev/null 2>&1; cat /sdcard/u${t}.xml" 2>/dev/null | tr -d '\r' | sed 's/></>\n</g' | grep -oE 'text="[^"]+"' | sort -u | head -25 || true
          done

      - name: What is QQ waiting on
        if: always()
        run: |
          echo "=== crash ==="
          timeout 30 adb -s localhost:5555 shell "logcat -d -b crash -v time" 2>&1 | tail -25 || true
          echo "=== qq interesting ==="
          timeout 40 adb -s localhost:5555 shell "logcat -d -v time" 2>/dev/null | grep -i -E "msf|wtlogin|sso|timeout|connect|fail|risk|安全|验证|EmulatorDetect|device" | tail -80 || true
          echo "=== guest sockets ==="
          timeout 20 adb -s localhost:5555 shell "cat /proc/net/tcp | head -14" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qq-splash-diag
          path: /tmp/sp_*.png
          if-no-files-found: warn
