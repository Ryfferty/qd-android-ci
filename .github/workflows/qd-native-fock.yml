name: qd-native-fock

# ★★★ 路径 C：用 App 的真实组件（libfock.so + Fock 类）在【极简 Android 进程】里解密
#   · 不启动起点 App
#   · 不碰网页接口
#   · 数据全部来自 argus 协议（checkstatus/QDInfo/QDSign/getkey/safegetcontent）
#   · 算法用 APK 里真实的 libfock.so（真实 Android 加载器 → GOT/JNI_OnLoad 正常）
on:
  workflow_dispatch:
    inputs:
      apk_url:
        default: 'https://github.com/Ryfferty/qd-android-ci/releases/download/apks-v1/qidian_7.9.200.apk'
      book_id:
        default: '1040025277'
      chapter_id:
        default: '794290414'

permissions:
  contents: write

jobs:
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup binder + adb + jdk + frida
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq linux-modules-extra-$(uname -r) android-tools-adb python3-pip curl xz-utils unzip || echo APT_PARTIAL
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" 2>&1 || echo MODPROBE_MAYBE
          ls -la /dev/binder* 2>/dev/null || echo "no binder dev"
          pip install -q "frida==16.7.19" "frida-tools<14" 2>&1 | tail -1
          java -version 2>&1 | head -2
          javac -version 2>&1 | head -1

      - name: 启动 redroid
        run: |
          sudo docker rm -f redroid 2>/dev/null || true
          VOLS=""
          for d in binder hwbinder vndbinder; do [ -e /dev/$d ] && VOLS="$VOLS -v /dev/$d:/dev/$d"; done
          sudo docker run -d --privileged --name redroid $VOLS -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.redroid_gpu_mode=guest androidboot.redroid_width=1080 \
            androidboot.redroid_height=2340 androidboot.redroid_dpi=420 \
            androidboot.redroid_adb=5555
          sleep 15
          adb start-server >/dev/null 2>&1 || true
          timeout 30 adb connect localhost:5555 || true
          for i in $(seq 1 45); do
            B=$(timeout 15 adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$B" = "1" ] && { echo "BOOT_OK try $i"; break; }
            sleep 8
          done
          adb -s localhost:5555 shell getprop ro.product.cpu.abi | tr -d '\r'
          adb -s localhost:5555 root 2>&1 | tail -1
          sleep 8
          adb -s localhost:5555 shell id | head -1

      - name: ① 用 argus 协议拿 Key/Version/密文（零网页）
        env:
          QD_SESSION_COOKIES: ${{ secrets.QD_SESSION_COOKIES }}
        run: |
          set +e
          printf '%s' "$QD_SESSION_COOKIES" > /tmp/sess.json
          echo "sess.json $(stat -c%s /tmp/sess.json)B"
          BOOK="${{ inputs.book_id }}"; CID="${{ inputs.chapter_id }}"
          BOOK="$BOOK" CID="$CID" python3 - <<'PYEX'
          import json, base64, hashlib, time, urllib.request, urllib.parse, gzip, os
          from Crypto.Cipher import DES3
          try:
              S = json.load(open('/tmp/sess.json'))
          except Exception:
              S = {}
          G = lambda n: S.get(n, '')
          COOKIE = '; '.join('%s=%s' % (k, v) for k, v in S.items())
          YW = G('ywguid') or '0'
          APPVER='7.9.472'; VC='1956'; ASRC='1000009'; HOST='https://bravev6.if.qidian.com'
          def enc(d,k,iv):
              p=8-len(d)%8 or 8
              return DES3.new(k,DES3.MODE_CBC,iv).encrypt(d+bytes([p])*p)
          B64=lambda b: base64.b64encode(b).decode()
          IMEI='5a271be5da434be'; Q='b3b295be58644158'
          def qdinfo(u='0'):
              ts=str(int(time.time()*1000))
              f=[IMEI,APPVER,'720','1184',ASRC,'14','1','V2329A',VC,ASRC,'4',u,ts,'1',Q,'','','','0']
              k=b'0821CAAD409B8402'; return B64(enc('|'.join(f).encode(),k+k[:8],b'\x00'*8))
          def qdsign(si,u='0'):
              ts=str(int(time.time()*1000))
              pl='|'.join(['Rv1rPTnczce',ts,'0',IMEI,'1',APPVER,'0',hashlib.md5(si.encode()).hexdigest(),'f189adc92b816b3e9da29ea304d4a7e4'])
              return B64(enc(pl.encode(),bytes.fromhex('7B3164596771452968392C5229684B71456376345D6B5B68'),b'01234567'))
          def canon(p): return '&'.join('%s=%s'%(k,v) for k,v in sorted((k.lower(),v) for k,v in p.items()))
          def aget(path, params, lbl, save=None):
              h={'User-Agent':'Mozilla/mobile QDReaderAndroid/%s/%s/%s'%(APPVER,VC,ASRC),
                 'Accept-Encoding':'gzip','Cookie':COOKIE,'QDInfo':qdinfo(YW),
                 'tstamp':str(int(time.time()*1000)),'QDSign':qdsign(canon(params),YW),
                 'Referer':'http://android.qidian.com'}
              url=HOST+path+'?'+urllib.parse.urlencode(params)
              try:
                  r=urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=30)
                  raw=r.read(); code=r.status
              except urllib.error.HTTPError as e:
                  raw=e.read(); code=e.code
              except Exception as e:
                  print('[%s] 异常 %s'%(lbl,str(e)[:110])); return None
              try: raw=gzip.decompress(raw)
              except Exception: pass
              print('[%s] %s %dB %s'%(lbl,code,len(raw),raw[:120]))
              if save and code==200 and not raw.startswith(b'{'):
                  open(save,'wb').write(raw); print('   已存 %s'%save)
              return raw
          BOOK=os.environ['BOOK']; CID=os.environ['CID']
          out={}
          # getkey
          raw=aget('/argus/api/v3/bookcontent/getkey', {'bookId':BOOK}, 'getkey')
          if raw and raw.startswith(b'{'):
              try:
                  d=json.loads(raw); dd=d.get('Data') or {}
                  out['Key']=dd.get('Key'); out['V']=dd.get('V'); out['Version']=dd.get('Version')
                  print('   Key len=%s V=%s Version=%s'%(len(out.get('Key') or ''), out.get('V'), out.get('Version')))
              except Exception as e: print('  解析失败', e)
          time.sleep(3)
          raw=aget('/argus/api/v3/bookcontent/getkey', {'bookId':BOOK,'ui':'1'}, 'getkey ui=1')
          if raw and raw.startswith(b'{'):
              try:
                  dd=json.loads(raw).get('Data') or {}
                  if dd.get('Key') and dd['Key']!=out.get('Key'): out['key_b']=dd['Key']; print('   keyB len=%s'%len(dd['Key']))
              except Exception: pass
          time.sleep(3)
          # 密文
          raw=aget('/argus/api/v2/bookcontent/safegetcontent', {'bookId':BOOK,'chapterId':CID}, 'safegetcontent', '/tmp/cipher.bin')
          if raw and not raw.startswith(b'{'):
              out['blob_b64']=base64.b64encode(raw).decode()
          out.setdefault('qimei16','b3b295be58644158')
          json.dump(out, open('/tmp/params.json','w'))
          print('params keys=%s'%list(out.keys()))
          PYEX
          ls -l /tmp/params.json /tmp/cipher.bin 2>/dev/null
          adb -s localhost:5555 push /tmp/params.json /data/local/tmp/params.json || echo PUSH_PARAMS_FAILED

      - name: ② 准备组件（libfock.so + classes8.dex）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          mkdir -p work && cd work
          curl -sSL --max-time 600 -o qd.apk "${{ inputs.apk_url }}"
          echo "apk $(stat -c%s qd.apk)B"
          unzip -o -j qd.apk 'lib/armeabi-v7a/libfock.so' -d so32 2>/dev/null | tail -1
          unzip -o -j qd.apk 'lib/arm64-v8a/libfock.so' -d so64 2>/dev/null | tail -1
          unzip -o -j qd.apk 'classes8.dex' -d dex 2>/dev/null | tail -1
          ls -la so32 so64 dex 2>/dev/null
          echo "--- 哪个 dex 含 Fock 类 ---"
          for d in dex/*.dex; do
            if strings -n 12 "$d" 2>/dev/null | grep -q 'Lcom/yuewen/fock/Fock;'; then echo "  ★ $d 含 Fock"; fi
          done
          # 若 classes8 不含，遍历全部 dex
          if ! strings -n 12 dex/classes8.dex 2>/dev/null | grep -q 'Lcom/yuewen/fock/Fock;'; then
            echo "  classes8 不含，解全部 dex"
            unzip -o -j qd.apk 'classes*.dex' -d alldex 2>/dev/null | tail -1
            for d in alldex/*.dex; do
              if strings -n 12 "$d" 2>/dev/null | grep -q 'Lcom/yuewen/fock/Fock;'; then
                echo "  ★★ $d 含 Fock"; cp "$d" dex/classes8.dex; break
              fi
            done
          fi
          ls -la dex/

      - name: ③ 编译 harness → dex
        run: |
          set +e
          cd work
          # 取 r8/d8（CI 网络可直连 Maven）
          for U in \
            "https://maven.google.com/com/android/tools/r8/8.2.42/r8-8.2.42.jar" \
            "https://repo1.maven.org/maven2/com/android/tools/r8/8.2.42/r8-8.2.42.jar" \
            "https://maven.google.com/com/android/tools/r8/8.3.37/r8-8.3.37.jar" ; do
            curl -sSL --max-time 300 -o r8.jar "$U" && SZ=$(stat -c%s r8.jar 2>/dev/null || echo 0) && \
              echo "r8 from $U size=$SZ" && [ "$SZ" -gt 1000000 ] && break
          done
          ls -la r8.jar
          mkdir -p hz/com/fock
          cp ../Harness.java hz/com/fock/Harness.java
          echo "--- javac ---"
          (cd hz && javac -source 8 -target 8 -nowarn com/fock/Harness.java 2>&1 | head -10)
          find hz -name '*.class' | head
          echo "--- d8 ---"
          java -cp r8.jar com.android.tools.r8.D8 --min-api 29 --output outdex $(find hz -name '*.class') 2>&1 | head -15
          ls -la outdex/ 2>/dev/null

      - name: ④ push 组件进设备 + 运行
        run: |
          set +e
          B=localhost:5555
          cd work
          adb -s $B push so32/libfock.so /data/local/tmp/libfock.so
          adb -s $B push dex/classes8.dex /data/local/tmp/classes8.dex
          [ -f outdex/classes.dex ] && adb -s $B push outdex/classes.dex /data/local/tmp/harness.dex
          adb -s $B shell chmod 644 /data/local/tmp/libfock.so /data/local/tmp/classes8.dex /data/local/tmp/harness.dex 2>/dev/null
          adb -s $B shell "ls -l /data/local/tmp/" | head -12
          echo
          echo "===== 运行 harness（极简 Android 进程，不启动起点 App）====="
          adb -s $B shell "CLASSPATH=/data/local/tmp/harness.dex:/data/local/tmp/classes8.dex app_process /data/local/tmp com.fock.Harness /data/local/tmp/params.json" 2>&1 | head -120
          echo
          echo "===== 再试 arm64 版 .so（如果 32 位不行）====="
          adb -s $B push so64/libfock.so /data/local/tmp/libfock64.so >/dev/null
          adb -s $B shell "CLASSPATH=/data/local/tmp/harness.dex:/data/local/tmp/classes8.dex app_process /data/local/tmp com.fock.Harness /data/local/tmp/params.json" 2>&1 | head -60

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-fock-out
          path: work/
          if-no-files-found: warn
